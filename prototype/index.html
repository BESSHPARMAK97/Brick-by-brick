<title>Brick by Brick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: рабочий портал проекта — боковая навигация по модулям, справа рабочая область; на телефоне навигация становится лентой вкладок сверху */
:root {
  --bg: #eef0f2;          /* бетон */
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --line: #d9dde3;
  --fg: #1b2129;
  --muted: #5d6672;
  --accent: #1f5fd1;      /* синий чертёжный */
  --accent-soft: #e3ebfb;
  --signal: #e8891c;      /* сигнальный оранжевый, для «нового» */
  --ok: #1f8a54;  --ok-soft: #e0f3e8;
  --warn: #b7791f; --warn-soft: #fbf0dc;
  --bad: #c2382f;  --bad-soft: #fbe4e2;
  --info: #6a4fc4; --info-soft: #ece7fa;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171c; --surface: #1b2027; --surface-2: #222831; --line: #2f3742;
  --fg: #e6e9ee; --muted: #98a2ae; --accent: #6b9bff; --accent-soft: #1f2c47; --signal: #f2a24a;
  --ok: #4cc485; --ok-soft: #173326; --warn: #e0b052; --warn-soft: #3a2f17;
  --bad: #f07a70; --bad-soft: #3d1d1b; --info: #a892ff; --info-soft: #2a2347; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13171c; --surface: #1b2027; --surface-2: #222831; --line: #2f3742;
  --fg: #e6e9ee; --muted: #98a2ae; --accent: #6b9bff; --accent-soft: #1f2c47; --signal: #f2a24a;
  --ok: #4cc485; --ok-soft: #173326; --warn: #e0b052; --warn-soft: #3a2f17;
  --bad: #f07a70; --bad-soft: #3d1d1b; --info: #a892ff; --info-soft: #2a2347; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5 }
h1, h2, h3 { text-wrap: balance; margin: 0 }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -.01em }
h2 { font-family: var(--f-display); font-weight: 500; font-size: 1.15rem }
h3 { font-size: 1rem; font-weight: 600 }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono { font-family: var(--f-mono); font-size: .82em }
.muted { color: var(--muted) }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600 }
.num { font-variant-numeric: tabular-nums }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px }
.brand svg { flex: none }
.brand b { font-family: var(--f-display); font-size: .95rem; font-weight: 700; line-height: 1.1 }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-weight: 500 }
.nav a:hover { background: var(--surface-2) }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent) }
.nav .cnt { font-size: .72rem; font-family: var(--f-mono); color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 7px }
.nav a[aria-current="page"] .cnt { background: var(--surface); color: var(--accent) }
.nav-g { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 14px 10px 4px }
.nav-g:first-child { padding-top: 0 }
.nav .cnt.alert, .subtabs .cnt.alert { color: var(--bad); background: var(--bad-soft) }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 12px }
.subtabs a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 500; font-size: .92rem }
.subtabs a:hover { border-color: var(--accent) }
.subtabs a[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.subtabs .cnt { font-size: .72rem; font-family: var(--f-mono); border-radius: 99px; padding: 1px 7px }
.side-foot { margin-top: auto; font-size: .78rem; color: var(--muted); padding: 0 6px }

.main { padding-block: 24px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; min-width: 0 }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.demo { font-size: .75rem; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 3px 10px; font-weight: 600 }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px }
.grid { display: grid; gap: 14px }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)) }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.between { justify-content: space-between }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 10px; font-size: .78rem; font-weight: 600; white-space: nowrap }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.s-done { color: var(--ok); background: var(--ok-soft) }
.s-fail { color: var(--bad); background: var(--bad-soft) }
.s-agreed { color: var(--accent); background: var(--accent-soft) }
.s-new { color: var(--signal); background: var(--warn-soft) }
.s-changed { color: var(--info); background: var(--info-soft) }
.tag { font-size: .75rem; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; color: var(--muted); white-space: nowrap }
.tag.auto { border-color: var(--accent); color: var(--accent) }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500 }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent) }

/* Карточка */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 20px }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field .v { font-weight: 500 }
.field .v a { color: var(--accent) }
.field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 9px }
.field.key select { border-color: var(--accent) }
.field input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 9px; min-width: 0; width: 100% }
.field select:disabled, .field input:disabled { opacity: .7 }
.hint { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); color: var(--fg); border-radius: var(--r); padding: 12px 14px; font-size: .9rem }
.hint b { color: var(--accent) }

/* Стандарты */
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--muted); font-weight: 600 }
.filters select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; font-weight: 500; color: var(--fg); font-size: .9rem }
.filters select.from-card { border-color: var(--accent); background: var(--accent-soft) }
.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface) }
.summary > div { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0 }
.summary > div:last-child { border-right: 0 }
.summary .dir { font-weight: 600; font-size: .9rem }
.summary .full { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin-top: 8px }
.bar i { display: block; height: 100% }
.std-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden }
.std { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100% }
.std:last-child { border-bottom: 0 }
.std:hover { background: var(--surface-2) }
.std .t { font-weight: 600 }
.std .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
.prog { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); white-space: nowrap }
.empty { padding: 28px; text-align: center; color: var(--muted) }

/* Шторка стандарта */
.scrim { position: fixed; inset: 0; background: rgb(10 14 20 / .45); z-index: 20 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--surface); z-index: 21; overflow-y: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 22px; display: flex; flex-direction: column; gap: 18px; box-shadow: -12px 0 40px rgb(0 0 0 / .18) }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px dashed var(--line) }
.check:last-child { border-bottom: 0 }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ok); flex: none }
.check.on span { color: var(--muted); text-decoration: line-through }
.scheme { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; overflow-x: auto }
.scheme svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto }
table { border-collapse: collapse; width: 100%; font-size: .88rem }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.tbl { overflow-x: auto }


/* Календарь */
.month { display: flex; flex-direction: column; gap: 8px }
.ev { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.ev .d { font-family: var(--f-mono); font-weight: 600 }
.ev.past { opacity: .55 }
.ev.today { border-color: var(--accent) }
.k-gpr { color: var(--accent); background: var(--accent-soft) }
.k-tender { color: var(--info); background: var(--info-soft) }
.k-keys { color: var(--ok); background: var(--ok-soft) }
.k-com { color: var(--warn); background: var(--warn-soft) }
.k-hol { color: var(--bad); background: var(--bad-soft) }
.typebtn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: .82rem; font-weight: 600 }
.typebtn[aria-pressed="true"] { border-color: currentColor }

/* Команда / партнёры */
.person { display: flex; gap: 12px; align-items: flex-start }
.ava { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; font-size: .9rem }
.ava.vac { background: var(--warn-soft); color: var(--warn) }

/* Показатели */
.kpi .big { font-family: var(--f-display); font-weight: 500; font-size: 1.5rem; line-height: 1.15; margin-top: 6px }
.kpi .delta { font-size: .82rem; margin-top: 4px }
.up { color: var(--ok) } .down { color: var(--bad) }
.chess-wrap { overflow-x: auto }
.chess { display: grid; gap: 3px; min-width: 420px }
.chess .fl { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); display: grid; place-items: center }
.cell { height: 26px; border-radius: 4px; font-family: var(--f-mono); font-size: .68rem; display: grid; place-items: center; border: 0 }
.c-sold { background: var(--ok); color: #fff }
.c-res { background: var(--warn); color: #fff }
.c-free { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line) }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem }
.legend span { display: inline-flex; gap: 6px; align-items: center }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block }

@media (max-width: 1000px) { .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .summary { grid-template-columns: repeat(2, minmax(0, 1fr)) } .summary > div { border-bottom: 1px solid var(--line) } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; align-items: center; padding: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); z-index: 5; overflow-x: auto; gap: 12px }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
  .brand b, .side-foot { display: none }
  .nav { flex-direction: row }
  .nav a { white-space: nowrap; padding: 7px 10px }
  .nav .cnt, .nav-g { display: none }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr) }
  .std { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px }
  .std .code { grid-column: 1 / -1 }
  .std .prog { display: none }
  .ev { grid-template-columns: 54px minmax(0, 1fr) }
  .ev .chip { grid-column: 2 }
}
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .22s ease-out } @keyframes slide { from { transform: translateX(30px); opacity: .6 } } }
</style>

<style>
/* Layout: blueprint sheet. Tree of stages on the left, quest panel on the right (bottom sheet on phones). */
/* Цвета и шрифты приходят из портала (свойства наследуются в изолированный блок); здесь только токены, которых в портале нет. */
:host {
  display: block;
  --ink: var(--fg);
  --accent-ink: var(--accent);
  --grid: var(--line);
  --done: var(--ok); --done-soft: var(--ok-soft);
  --locked: var(--muted);
  --risk: var(--signal); --risk-soft: var(--warn-soft);
  --late: var(--bad); --late-soft: var(--bad-soft);
  --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .08);
}
[hidden] { display: none !important; }

* { box-sizing: border-box; }
.zhk {
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.wrap { max-width: none; margin: 0; padding: 0; }

/* Header / HUD */
.hud {
  display: grid; grid-template-columns: 1fr auto; gap: 16px 24px; align-items: end;
  padding-block: 8px 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
}
.hud h1 { font-size: clamp(22px, 3.2vw, 34px); font-weight: 700; }
.hud p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.rank { display: grid; gap: 8px; min-width: 260px; }
.rank-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rank-name { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.xpbar { height: 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.xpbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--done)); transition: width .4s ease; }
.hud-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--locked); margin-right: 6px; vertical-align: 1px; }
.sync[data-mode="shared"]::before { background: var(--done); }
.sync[data-mode="local"]::before { background: var(--accent); }

/* Main layout */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 24px; align-items: start; }
.tree-card { position: relative; min-width: 0; }
.panel {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  max-height: calc(100vh - 24px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}

/* Tree */
.tree { position: relative; display: grid; gap: 34px; padding-block: 8px 24px; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

.tier-nodes { display: flex; justify-content: center; gap: clamp(16px, 6vw, 72px); flex-wrap: wrap; }

.node {

  width: 132px; padding: 0; background: none; border: 0; cursor: pointer; text-align: center;

.node[data-state="risk"] .hex-in { background: var(--risk-soft); color: var(--risk); }
.node-flag {
  position: absolute; top: -4px; left: calc(50% + 18px); z-index: 2;
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center;
  background: var(--late); color: var(--surface); font-family: var(--f-mono); font-size: 11px;
}
.node[aria-current="true"] .node-name { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.node[aria-current="true"] .hex { transform: scale(1.08); }
@media (prefers-reduced-motion: no-preference) {
  .node[data-state="open"] .hex { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: drop-shadow(0 0 8px var(--accent)); } }
}
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Panel */
.panel-inner { padding: 20px; display: grid; gap: 18px; }
.panel-head { display: grid; gap: 6px; }
.panel-head h2 { font-size: 21px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px;
  font-size: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
button.chip { cursor: pointer; }
.chip[data-state="done"] { background: var(--done-soft); border-color: transparent; color: var(--done); }
.chip[data-state="open"], .chip[data-state="active"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.chip[data-state="locked"] { color: var(--muted); }
.status { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.desc { margin: 0; color: var(--ink); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.section-title h3 { font-size: 13px; font-weight: 500; letter-spacing: .02em; }

.gate {
  border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 2px;
  background: var(--surface-2); border: 1px dashed var(--line);
}
.gate[data-state="done"] { background: var(--done-soft); border: 1px solid transparent; color: var(--done); }
.gate[data-state="locked"] { color: var(--muted); }
.gate b { font-weight: 600; }

.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.task { border-radius: 8px; padding: 2px 0; }
.task[data-late="true"] { background: var(--late-soft); }
.task-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; align-items: start; }
.task-row label {
  display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start;
  padding: 8px; border-radius: 8px; cursor: pointer; min-width: 0;
}
.task-row label:hover { background: var(--surface-2); }
.task-more { margin: 4px 4px 0 0; padding: 4px 8px; font-size: 12px; }
.task-meta { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px 6px 38px; }
.task-meta:empty { display: none; }
.mchip { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.mchip[data-tone="late"] { background: var(--late); border-color: var(--late); color: var(--surface); }
.mchip[data-tone="soon"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.mchip[data-tone="ok"] { background: var(--done-soft); border-color: transparent; color: var(--done); }
.task-edit { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; padding: 0 8px 10px 38px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.field input, .field textarea {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); width: 100%;
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
}
.field textarea { resize: vertical; min-height: 70px; }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.gate[data-state="risk"] { background: var(--risk-soft); border: 1px solid transparent; color: var(--risk); }
.gate .btn { justify-self: start; margin-top: 6px; }
.early-form { display: grid; gap: 8px; margin-top: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.hud-late { color: var(--late); font-weight: 600; }
@media (max-width: 560px) { .task-edit { grid-template-columns: minmax(0, 1fr); } .task-edit, .task-meta { padding-left: 8px; } }

/* Tabs and views */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border: 0; background: none; cursor: pointer;
  font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; font-family: var(--f-mono); font-size: 11px; background: var(--late); color: var(--surface); }
.badge[data-tone="soon"] { background: var(--accent); }
.alerts { display: grid; gap: 4px; padding: 10px 14px; margin-bottom: 18px; border-radius: 10px; background: var(--late-soft); border: 1px solid var(--late); color: var(--ink); font-size: 13px; }
.alerts b { color: var(--late); }
.linkbtn { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; justify-self: start; }
.view { display: grid; gap: 18px; }
.view > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.view-title { font-size: 18px; font-weight: 700; }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Model */
.model-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
.model-inputs { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
.fs { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; min-width: 0; }
.fs legend { padding: 0; margin-bottom: 6px; }
.inrow { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 8px; align-items: center; font-size: 13px; }
.inrow label { color: var(--ink); line-height: 1.25; }
.inbox { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.inbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inbox input { width: 100%; min-width: 0; border: 0; background: none; padding: 6px 8px; font: inherit; font-size: 13px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.inbox span { padding-right: 8px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.inrow input[type="checkbox"] { justify-self: end; width: 18px; height: 18px; accent-color: var(--done); }
.model-out { display: grid; gap: 18px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.kpi { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi b { font-family: var(--f-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.kpi[data-tone="good"] b { color: var(--done); }
.kpi[data-tone="warn"] b { color: var(--accent-ink); }
.kpi[data-tone="bad"] b { color: var(--late); }
.verdict { padding: 12px 14px; border-radius: 10px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.verdict[data-tone="good"] { background: var(--done-soft); border-color: transparent; }
.verdict[data-tone="warn"] { background: var(--accent-soft); border-color: transparent; }
.verdict[data-tone="bad"] { background: var(--late-soft); border-color: transparent; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .cum-area { fill: var(--accent-soft); }
.chart .cum-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .debt-line { fill: none; stroke: var(--late); stroke-width: 2; stroke-dasharray: 5 4; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.chart-legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr.total td { font-weight: 600; border-bottom: 0; }
table.t th.num { text-align: right; }
.sens td { text-align: center; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 8px 4px; }
.sens th { text-align: center; }
.sens td[data-tone="bad"] { background: var(--late-soft); color: var(--late); }
.sens td[data-tone="warn"] { background: var(--accent-soft); color: var(--accent-ink); }
.sens td[data-tone="good"] { background: var(--done-soft); color: var(--done); }
.sens td.base { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.sens table { border-collapse: separate; border-spacing: 3px; width: 100%; }

/* Budget */
.tin { width: 100%; min-width: 110px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 5px 7px; font: inherit; font-size: 13px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.tin.note { text-align: left; min-width: 140px; }
.tin:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tin:disabled { background: var(--surface-2); color: var(--muted); }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; min-width: 70px; }
.meter i { display: block; height: 100%; background: var(--done); }
.meter[data-tone="bad"] i { background: var(--late); }
.dev[data-tone="bad"] { color: var(--late); font-weight: 600; }
.dev[data-tone="good"] { color: var(--done); }
.budget-mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

/* Gantt */
.g-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; }
.g-inner { position: relative; }
.g-body { position: relative; }
.g-row { display: grid; grid-template-columns: 300px auto; align-items: center; border-bottom: 1px solid var(--line); min-height: 34px; }
.g-row:last-child { border-bottom: 0; }
.g-head { min-height: 38px; background: var(--surface-2); }
.g-label { position: sticky; left: 0; z-index: 3; background: var(--surface); display: flex; gap: 6px; justify-content: space-between; align-items: center; padding: 4px 8px; height: 100%; border-right: 1px solid var(--line); font-size: 12.5px; min-width: 0; }
.g-head .g-label { background: var(--surface-2); }
.g-label .linkbtn { text-decoration: none; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.g-label .linkbtn:hover { text-decoration: underline; }
.g-dur { display: inline-flex; align-items: center; gap: 4px; flex: none; font-size: 11px; color: var(--muted); }
.g-dur .tin { width: 52px; min-width: 52px; padding: 3px 5px; font-size: 12px; }
.g-track { position: relative; height: 34px; }
.g-axis { height: 38px; }
.g-year { position: absolute; top: 3px; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink); padding-left: 3px; border-left: 1px solid var(--muted); }
.g-tick { position: absolute; bottom: 3px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); padding-left: 3px; }
.g-bar { position: absolute; top: 9px; height: 16px; border-radius: 4px; background: var(--accent-soft); border: 1px solid var(--accent); overflow: hidden; }
.g-bar i { display: block; height: 100%; background: var(--accent); opacity: .55; }
.g-bar.crit { background: var(--late-soft); border-color: var(--late); }
.g-bar.crit i { background: var(--late); }
.g-bar.done { background: var(--done); border-color: var(--done); }
.g-bar.done i { background: var(--done); opacity: 1; }
.g-bar.tail { background: var(--surface-2); border-color: var(--line); border-style: dashed; }
.g-bar.tail i { background: var(--locked); }
.g-slack { position: absolute; top: 16px; height: 2px; background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }
.g-late { position: absolute; top: 9px; height: 16px; border-radius: 0 4px 4px 0; background: repeating-linear-gradient(45deg, var(--late) 0 3px, transparent 3px 7px); opacity: .7; }
.g-late-name { color: var(--late); font-weight: 600; }
.g-overlay { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 1; }
.g-ygrid { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--line); }
.g-now { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--ink); }
.g-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.g-legend i { display: inline-block; width: 16px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lg-crit { background: var(--late-soft); border: 1px solid var(--late); }
.lg-bar { background: var(--accent-soft); border: 1px solid var(--accent); }
.lg-slack { height: 2px !important; background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); vertical-align: 3px !important; }
.lg-late { background: repeating-linear-gradient(45deg, var(--late) 0 3px, transparent 3px 7px); }
.lg-done { background: var(--done); }
.lg-now { width: 2px !important; background: var(--ink); }
.g-crit { margin: 8px 0 0; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
@media (max-width: 560px) { .g-row { grid-template-columns: 180px auto; } .g-overlay { left: 180px !important; } .g-inner { min-width: auto !important; } }

/* Projects, achievements, minimap, norms */
.rep-bar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px; }
.rep-bar .meter { height: 10px; }
.rep-bar .mono { text-align: right; color: var(--muted); font-size: 12px; }
#proj-sel { width: 100%; font-weight: 500; }
table.t tr.cur td { background: var(--surface-2); }
.ach { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ach summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; list-style: none; font-size: 13px; font-weight: 500; }
.ach summary::-webkit-details-marker { display: none; }
.ach-mini { display: inline-flex; gap: 3px; }
.ach-mini i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.ach-mini i[data-on="true"] { background: var(--accent); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 0 14px 14px; }
.ach-item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.ach-item[data-on="false"] { opacity: .55; }
.ach-item .dl-sub { display: block; }
.ach-badge { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--line); color: var(--surface); font-size: 15px; }
.ach-item[data-on="true"] .ach-badge { background: var(--accent); }
.minimap { display: none; }
@media (max-width: 980px) {
  .minimap { display: grid; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0 0 12px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .mm-groups { display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .mm-g { display: grid; gap: 3px; }
  .mm-g > span { font-family: var(--f-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .mm-g > div { display: flex; gap: 3px; }
  .mm-dot { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--f-mono); font-size: 10px; padding: 0; color: var(--muted); cursor: pointer; }
  .mm-dot[data-state="open"], .mm-dot[data-state="active"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .mm-dot[data-state="risk"] { background: var(--risk-soft); border-color: var(--risk); color: var(--risk); }
  .mm-dot[data-state="done"] { background: var(--done); border-color: var(--done); color: var(--surface); }
  .mm-dot[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
  .minimap > .btn { justify-self: start; padding: 5px 10px; font-size: 12px; }
}
.refs { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; }

/* Region and language */
.region-bar { display: grid; gap: 6px; margin: 4px 0 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface); font-size: 13px; }
.region-bar[data-on="true"] { border-style: solid; border-color: var(--accent); }
.region-bar .row { align-items: center; }
.region-bar label { font-weight: 500; }
.region-bar .muted b { color: var(--accent-ink); }
.rank .row { flex-wrap: nowrap; }
.rank .row .btn:first-child { flex: 1; }

/* Attachments and log */
.att-chip { text-decoration: none; color: var(--ink); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-chip:hover { border-color: var(--ink); }
.att-box { grid-column: 1 / -1; display: grid; gap: 8px; padding-top: 4px; }
.att-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.att-item a { color: var(--ink); overflow-wrap: anywhere; }
.att-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.att-add input { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.sel { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.section-title { flex-wrap: wrap; }
@media (max-width: 560px) { .sel { width: 100%; } .section-title > .row { width: 100%; } }

/* Deadlines */
.dl-head { display: grid; gap: 10px; }
.dl-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; padding-top: 8px; border-top: 1px dashed var(--line); }
.dl-form .wide { grid-column: span 2; }
.dl-form select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.dl-quick { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; }
.dl-actions { grid-column: 1 / -1; }
.dl-title { font-weight: 500; }
.dl-sub { font-size: 12px; color: var(--muted); }
@media (max-width: 980px) {
  .model-grid { grid-template-columns: minmax(0, 1fr); }
  .model-inputs { position: static; max-height: none; }
  .dl-form { grid-template-columns: minmax(0, 1fr); }
  .dl-form .wide { grid-column: auto; }
}
.task input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--done); cursor: pointer; }
.task input:disabled, .task input:disabled + span { cursor: not-allowed; }
.task input:disabled + span { color: var(--muted); }
.task input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

.docs { display: grid; gap: 8px; }
.doc {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
  padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2);
}
.doc-ext {
  width: 34px; height: 40px; border-radius: 4px 10px 4px 4px; display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 9.5px; text-transform: uppercase; background: var(--surface); border: 1px solid var(--line); color: var(--muted);
}
.doc-title { font-size: 13px; font-weight: 500; line-height: 1.3; min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn:hover { border-color: var(--ink); }

// Минимальный генератор .docx: текст шаблона -> документ Word (zip без сжатия).
window.buildDocx = (function () {
  const enc = new TextEncoder();
  const CRC = new Uint32Array(256).map((_, n) => {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    return c >>> 0;
  });
  function crc32(b) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files) {
    const parts = [], central = [];
    let offset = 0;
    const DATE = ((2026 - 1980) << 9) | (1 << 5) | 1;
    files.forEach(f => {
      const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
      h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, DATE, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
      h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, DATE, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    });
    const cdSize = central.reduce((s, a) => s + a.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
    const all = parts.concat(central, [new Uint8Array(e.buffer)]);
    const out = new Uint8Array(all.reduce((s, a) => s + a.length, 0));

    all.forEach(a => { out.set(a, p); p += a.length; });

    o = o || {};

    if (o.b) pr += "<w:b/>";
    if (o.i) pr += "<w:i/>";

    if (o.sz) pr += '<w:sz w:val="' + o.sz + '"/><w:szCs w:val="' + o.sz + '"/>';
    return "<w:r><w:rPr>" + pr + '</w:rPr><w:t xml:space="preserve">' + esc(t) + "</w:t></w:r>";
  }
  function para(inner, o) {
    o = o || {};
    return "<w:p><w:pPr>" + (o.center ? '<w:jc w:val="center"/>' : "") +
      '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after || 0) + '" w:line="264" w:lineRule="auto"/></w:pPr>' + inner + "</w:p>";
  }
  return function buildDocx(text) {
    let body = "", titled = false;

  function write(patch) {
    if (!docRef || readOnly) return;
    // Документ и состояние фиксируем в момент правки: к выполнению очереди пользователь мог переключить проект.
    const ref = docRef, proj = curProject, full = JSON.parse(JSON.stringify(S));
    const mark = () => { if (proj === curProject) docExists = true; };
    writeChain = writeChain.then(async () => {
      const exists = proj === curProject ? docExists : !!(projects && projects[proj]);
      try {
        if (exists) await ref.update(patch);
        else { await ref.set(full); mark(); }
      } catch (e) {
        if (e && e.code === "invalid_argument") {
          // update() на несуществующем документе или нет прав на запись
          try { await ref.set(full); mark(); return; }
          catch (e2) {
            if (e2 && e2.code === "invalid_argument") {
              readOnly = true; setSync("local", "Только просмотр: изменения не сохраняются"); renderAll(); return;
            }
          }
        }
        setSync("local", "Нет связи с хранилищем, прогресс сохранён в браузере");
      }
    });
  }
  // Запись в конкретный проект: нужна, когда между действием и записью было ожидание (загрузка файла).
  function writeTo(proj, patch) {
    if (proj === curProject) { commit(patch); return; }
    if (readOnly) return;
    if (dbCap) { const ref = dbCap.doc("progress/" + proj); writeChain = writeChain.then(() => ref.update(patch).catch(() => {})); return; }
    const d = loadLocal(proj); merge(d, patch);
    try { localStorage.setItem(localKey(proj), JSON.stringify(d)); } catch (e) {}
  }
  function commit(patch, opts) {
    merge(S, patch); saveLocal(); write(patch);
    if (opts && opts.defer) {
      // Фокус ещё переходит на следующее поле: перерисуем поля ввода, когда он устроится.
      renderChrome(); setTimeout(() => { renderPanel(); renderView(); }, 0);
    } else renderAll();
  }

  async function connect() {
    const use = window.claude && window.claude.use;
    if (!use) { downloads = blobSaver; setSync("local", "Прогресс сохраняется в этом браузере"); renderAll(); return; }
    try { downloads = await use("downloads"); } catch (e) { downloads = null; }
    try { assetsCap = await use("assets"); } catch (e) { assetsCap = null; }
    try { userCap = await use("user"); meId = userCap ? await userCap.id() : null; } catch (e) { userCap = null; meId = null; }
    try { canAdmin = userCap ? (await userCap.canEdit()) !== false : true; } catch (e) { canAdmin = true; }
    let db = null;
    try { db = await use("db"); } catch (e) { db = null; }
    if (!db) { setSync("local", "Прогресс сохраняется в этом браузере"); renderAll(); return; }
    dbCap = db;
    docRef = db.doc("progress/" + curProject);
    setSync("pending", "Синхронизация…");
    // Каждый проект — отдельный документ коллекции progress; основной проект — progress/main.
    db.collection("progress").onSnapshot(q => {
      const map = {};
      q.docs.forEach(d => { map[d.id] = d.data(); });
      projects = map;
      if (curProject !== "main" && !map[curProject]) {
        curProject = "main"; try { localStorage.setItem(CUR_PROJ, "main"); } catch (e) {}
        docRef = db.doc("progress/main"); achSeen = null;
      }
      const data = map[curProject];
      docExists = !!data;
      if (!data && hasData() && curProject === "main") {
        // Первый запуск общего хранилища: переносим локальный прогресс.
        write({});
      } else {
        S = normalize(data || {});
        saveLocal();
      }
      regionApplied = null;
      setSync("shared", readOnly ? "Только просмотр" : "Общий прогресс команды сохраняется");
      renderAll(); renderProjSel();
    }, () => setSync("local", "Нет связи с хранилищем, прогресс сохранён в браузере"));
  }

  // --- guarded rendering --------------------------------------------------
  // Не перерисовываем блок с полями ввода, пока в нём фокус или идёт клик: иначе пропадёт ввод или клик.
  let pointerDown = false;
  const dirty = new Map();
  function busyIn(el) {
    const a = document.activeElement;
    return !!a && el.contains(a) && (a.tagName === "TEXTAREA" || a.tagName === "SELECT" || (a.tagName === "INPUT" && a.type !== "checkbox"));
  }
  function guarded(el, fn) {
    const run = force => {
      if (!force && (busyIn(el) || pointerDown)) { dirty.set(run, true); return; }
      dirty.delete(run); fn();
    };
    return run;
  }
  const flush = () => setTimeout(() => { [...dirty.keys()].forEach(r => r()); }, 0);
  document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
  document.addEventListener("pointerup", () => { pointerDown = false; flush(); }, true);
  document.addEventListener("focusout", flush, true);

  // --- stage state --------------------------------------------------------
  const key = (n, i) => n.id + "." + (n.keyIds ? n.keyIds[i] : i);
  const doneCount = n => n.tasks.reduce((s, _, i) => s + (S.checked[key(n, i)] ? 1 : 0), 0);
  const isDone = n => doneCount(n) === n.tasks.length;
  const isUnlocked = n => n.req.every(r => isDone(byId[r]));
  const metaOf = k => S.meta[k] || {};
  const isLate = k => !S.checked[k] && metaOf(k).due && daysTo(metaOf(k).due) < 0;
  const lateCount = n => n.tasks.reduce((s, _, i) => s + (isLate(key(n, i)) ? 1 : 0), 0);
  function stateOf(n) {
    if (isDone(n)) return "done";
    if (isUnlocked(n)) return doneCount(n) > 0 ? "active" : "open";
    return S.early[n.id] ? "risk" : "locked";
  }
  const editable = n => !readOnly && stateOf(n) !== "locked";

  // --- deadlines state ----------------------------------------------------
  const deadlineList = () => Object.entries(S.deadlines).filter(([, d]) => d && d.title)
    .map(([id, d]) => Object.assign({ id }, d))
    .sort((a, b) => (a.expires || "9999").localeCompare(b.expires || "9999"));
  function dlStatus(d) {
    if (!d.expires) return { tone: "", text: "Срок не указан", level: 0 };
    const n = daysTo(d.expires);
    if (n < 0) return { tone: "late", text: "Истёк " + fmt(d.expires), level: 3 };
    if (n <= 30) return { tone: "late", text: (n === 0 ? "Истекает сегодня" : "Осталось " + n + " дн."), level: 2 };
    if (n <= 60) return { tone: "soon", text: "Осталось " + n + " дн.", level: 1 };
    return { tone: "ok", text: "Действует до " + fmt(d.expires), level: 0 };
  }

  // --- budget state -------------------------------------------------------
  const EXTRA_ROWS = [{ id: "_interest", code: "—", name: "Проценты по кредиту" }, { id: "_admin", code: "—", name: "Административные расходы" }];
  const budgetRows = () => T.nodes.concat(EXTRA_ROWS);
  const bOf = id => S.budget[id] || {};
  function budgetTotals() {
    let plan = 0, fact = 0, over = 0;
    budgetRows().forEach(r => {
      const b = bOf(r.id);
      plan += b.plan || 0; fact += b.fact || 0;
      if ((b.fact || 0) > (b.plan || 0) && (b.plan || 0) > 0) over++;
    });
    return { plan, fact, over };
  }

  // --- tree ---------------------------------------------------------------
  const treeEl = document.getElementById("tree");
  const edgesEl = document.getElementById("edges");
  const nodeEls = {};

  function buildTree() {
    const tiers = {};
    T.nodes.forEach(n => (tiers[n.lvl] = tiers[n.lvl] || []).push(n));
    Object.keys(tiers).map(Number).sort((a, b) => a - b).forEach(lvl => {
      const row = document.createElement("div");
      row.className = "tier";
      row.innerHTML = '<div class="tier-label"><b>LVL ' + String(lvl).padStart(2, "0") + '</b><span></span></div><div class="tier-nodes"></div>';
      row.querySelector(".tier-label span").textContent = tiers[lvl][0].phase;
      const wrap = row.querySelector(".tier-nodes");
      tiers[lvl].forEach(n => {
        const b = document.createElement("button");
        b.className = "node";
        b.type = "button";
        b.innerHTML = '<span class="node-flag" hidden></span><span class="hex"><span class="hex-in"></span></span><span class="node-name"></span><span class="node-sub mono"></span>';
        b.querySelector(".node-name").textContent = n.name;
        b.addEventListener("click", () => select(n.id, true));
        nodeEls[n.id] = b;
        wrap.appendChild(b);
      });
      treeEl.appendChild(row);
    });
  }

  function renderTree() {
    T.nodes.forEach(n => {
      const b = nodeEls[n.id];
      const st = stateOf(n);
      const dc = doneCount(n);
      const late = lateCount(n);
      b.dataset.state = st;
      b.setAttribute("aria-current", selected === n.id ? "true" : "false");
      b.querySelector(".hex").style.setProperty("--p", Math.round(dc / n.tasks.length * 100));
      b.querySelector(".hex-in").textContent = st === "done" ? "✓" : n.code;
      b.querySelector(".node-sub").textContent = st === "locked" ? "закрыт" : (st === "risk" ? "досрочно · " : "") + dc + " / " + n.tasks.length;
      const flag = b.querySelector(".node-flag");
      flag.hidden = !late;
      flag.textContent = "!" + late;
      b.setAttribute("aria-label", n.name + ", " + STATUS[st] + ", выполнено " + dc + " из " + n.tasks.length + (late ? ", просрочено " + late : ""));
    });
    drawEdges();
  }

  function drawEdges() {
    if (view !== "tree") return;
    const box = treeEl.getBoundingClientRect();
    edgesEl.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
    let out = "";
    T.nodes.forEach(n => n.req.forEach(r => {
      const a = nodeEls[r].getBoundingClientRect();
      const c = nodeEls[n.id].querySelector(".hex").getBoundingClientRect();
      const x1 = a.left + a.width / 2 - box.left, y1 = a.bottom - box.top;
      const x2 = c.left + c.width / 2 - box.left, y2 = c.top - box.top;
      const my = (y2 - y1) / 2;
      const cls = isDone(byId[r]) ? (isDone(n) ? "done" : "open") : "";
      out += '<path class="' + cls + '" d="M' + x1 + " " + y1 + " C" + x1 + " " + (y1 + my) + " " + x2 + " " + (y2 - my) + " " + x2 + " " + y2 + '"/>';
    }));
    edgesEl.innerHTML = out;
  }

  // --- HUD, tabs, alerts --------------------------------------------------
  function renderHud() {
    const tasksDone = T.nodes.reduce((s, n) => s + doneCount(n), 0);
    const stagesDone = T.nodes.filter(isDone).length;
    const late = T.nodes.reduce((s, n) => s + lateCount(n), 0);
    let rank = RANKS[0][1];
    RANKS.forEach(([min, name]) => { if (stagesDone >= min) rank = name; });
    document.getElementById("xp").textContent = (tasksDone * XP_PER_TASK) + " / " + (totalTasks() * XP_PER_TASK) + " XP";
    document.getElementById("rank").textContent = rank;
    document.getElementById("stages").textContent = stagesDone + " / " + T.nodes.length + " этапов";
    const p100 = Math.round(tasksDone / totalTasks() * 100);
    const bar = document.getElementById("xpbar");
    bar.setAttribute("aria-valuenow", p100);
    bar.querySelector("i").style.width = p100 + "%";
    const od = document.getElementById("overdue");
    od.hidden = !late;
    od.textContent = "Просрочено пунктов: " + late;
    document.getElementById("reset-zone").hidden = readOnly || !canAdmin;
    const p = S.project;
    document.getElementById("project-line").textContent = p.name
      ? "ЖК «" + p.name + "»" + (p.city ? " · г. " + p.city : "") + (p.company ? " · " + p.company : "")
      : "Девелопмент · Республика Казахстан";
  }

  function renderTabs() {
    document.querySelectorAll(".tab").forEach(t => {
      const on = t.dataset.view === view;
      if (on && t.getAttribute("aria-selected") !== "true" && t.parentNode.scrollWidth > t.parentNode.clientWidth) t.parentNode.scrollLeft = t.offsetLeft - 16;
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    const bt = budgetTotals();
    const bb = document.getElementById("badge-budget");
    bb.hidden = !bt.over;
    bb.textContent = bt.over;
    bb.title = "Этапов с перерасходом: " + bt.over;
    const list = deadlineList().map(dlStatus);
    const urgent = list.filter(s => s.level >= 2).length, soon = list.filter(s => s.level === 1).length;
    const db = document.getElementById("badge-deadlines");
    db.hidden = !(urgent || soon);
    db.textContent = urgent || soon;
    db.dataset.tone = urgent ? "" : "soon";
    const G = schedule(), lateM = G.fend - G.end;
    const bg = document.getElementById("badge-gantt");
    bg.hidden = !(lateM > 0.25); bg.textContent = "+" + mdec(lateM); bg.title = "Прогноз отставания, мес.";
    if (window.ZHK_onBadges) window.ZHK_onBadges();
  }

  function renderAlerts() {
    const el = document.getElementById("alerts");
    const items = deadlineList().filter(d => dlStatus(d).level >= 2);
    el.hidden = !items.length;
    if (!items.length) { el.innerHTML = ""; return; }
    const lines = items.slice(0, 3).map(d => {
      const n = daysTo(d.expires);
      return "<span><b>" + esc(d.title) + "</b>: " + (n < 0 ? "срок истёк " + fmt(d.expires) : n === 0 ? "истекает сегодня" : "истекает через " + n + " дн., " + fmt(d.expires)) + "</span>";
    });
    if (items.length > 3) lines.push("<span>И ещё " + (items.length - 3) + ".</span>");
    el.innerHTML = lines.join("") + '<button class="linkbtn" type="button" data-goview="deadlines">Открыть реестр сроков</button>';
  }

  function renderChrome() { applyRegion(); renderHud(); renderTree(); renderTabs(); renderAlerts(); renderRegion(); renderMinimap(); renderAch(); }

  // --- region bar ---------------------------------------------------------
  const regionBar = document.getElementById("region-bar");
  function regionCount(reg) { return reg ? Object.values(REG[reg].tasks).reduce((s, a) => s + a.length, 0) : 0; }
  const renderRegion = guarded(regionBar, function () {
    const reg = S.project.region && REG[S.project.region] ? S.project.region : "";
    regionBar.dataset.on = reg ? "true" : "false";
    regionBar.innerHTML = '<div class="row"><label for="region-sel">Регион проекта</label><select id="region-sel" class="sel"' + (readOnly ? " disabled" : "") + '>' +
      '<option value="">Регион не выбран</option>' + Object.keys(REG).map(id => '<option value="' + id + '"' + (id === reg ? " selected" : "") + ">" + esc(REG[id].ru.name) + "</option>").join("") + "</select>" +
      (reg ? '<span class="mchip" data-tone="soon">+' + regionCount(reg) + " пунктов для региона</span>" : "") + "</div>" +
      (reg ? '<p class="muted">' + esc(REG[reg].ru.hint) + '</p><p class="muted"><b>Совет</b> ' + esc(REG[reg].ru.tip) + "</p>"
        : '<p class="muted">Выберите регион, чтобы добавить в чек-листы пункты по сейсмике, климату и грунтам.</p>');
  });
  regionBar.addEventListener("change", e => {
    if (e.target.id !== "region-sel" || readOnly) return;
    const v = e.target.value;
    e.target.blur();
    commit({ project: { region: v } });
  });
  function renderAll() { renderChrome(); renderPanel(); renderView(); resolveNames(); if (window.ZHK_onChange) window.ZHK_onChange(); }

  // --- people -------------------------------------------------------------
  const shortText = s => s.length > 90 ? s.slice(0, 88) + "…" : s;
  function nameOf(id) {
    if (!id) return dbCap ? "Без имени" : "Вы";
    if (id === meId) return "Вы";
    return names[id] || "Участник";
  }
  async function resolveNames() {
    if (!userCap) return;
    const ids = [...new Set(Object.values(S.meta).map(m => m && m.doneBy).filter(x => x && x !== meId && !(x in names)))];
    if (!ids.length) return;
    ids.forEach(id => { names[id] = "Участник"; });
    let ps = {};
    try { ps = await userCap.profiles(ids); } catch (e) { return; }
    ids.forEach(id => { names[id] = (ps[id] && ps[id].name) || "Участник"; });
    renderPanel();
  }

  // --- attachments --------------------------------------------------------
  const ATT_TYPES = { pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", gif: "image/gif" };
  const attList = m => Object.entries((m && m.att) || {}).filter(([, a]) => a && a.name).map(([id, a]) => Object.assign({ id }, a)).sort((a, b) => (a.at || "").localeCompare(b.at || ""));
  const attHref = a => a.kind === "file" ? "/_blob/" + a.asset : (/^https?:\/\//i.test(a.url || "") ? a.url : "");
  const fsize = b => b >= 1048576 ? dec(b / 1048576, 1) + " МБ" : Math.max(1, Math.round(b / 1024)) + " КБ";
  const taskName = k => {
    const [s, i] = k.split("."), n = byId[s];
    const idx = n.keyIds ? n.keyIds.indexOf(i) : +i;
    return shortText(idx >= 0 ? n.tasks[idx] : i);
  };
  const attInput = document.getElementById("att-input");
  attInput.addEventListener("change", async () => {
    const file = attInput.files && attInput.files[0];
    const k = pendingAttKey;
    attInput.value = "";
    if (!file || !k || !assetsCap) return;
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const type = ATT_TYPES[ext] || (Object.values(ATT_TYPES).indexOf(file.type) >= 0 ? file.type : "");
    if (!type) { toast("Поддерживаются PDF и изображения (JPG, PNG, WEBP, GIF). Word и Excel сохраните в PDF или добавьте ссылкой."); return; }
    if (file.size > 20 * 1048576) { toast("Файл больше 20 МБ. Сожмите его или добавьте ссылкой."); return; }
    toast("Загружаю «" + file.name + "»…");
    const proj = curProject;
    try {
      const res = await assetsCap.upload(file, { type });
      const aid = meId ? meId.slice(-4) + Date.now().toString(36) : "a" + Date.now().toString(36);
      writeTo(proj, { meta: { [k]: { att: { [aid]: { kind: "file", name: file.name, asset: res.id, size: res.sizeBytes, type: res.contentType, at: today(), by: meId || "" } } } } });
      toast("Файл прикреплён");
    } catch (e) {
      const c = e && e.code;
      toast(c === "too_large" ? "Файл слишком большой: до 20 МБ." : c === "unsupported_type" ? "Этот тип файла не поддерживается. Сохраните в PDF." : c === "quota_or_state" ? "Хранилище файлов заполнено. Удалите ненужные файлы." : c === "rate_limited" ? "Слишком часто. Попробуйте через минуту." : "Не удалось загрузить файл. Попробуйте ещё раз.");
    }
  });
  function attBoxHtml(k, m) {
    const list = attList(m);
    const items = list.map(a => {
      const href = attHref(a);
      const sub = [a.kind === "file" ? (a.type === "application/pdf" ? "PDF" : "изображение") + (a.size ? ", " + fsize(a.size) : "") : "ссылка", fmt(a.at), a.by ? nameOf(a.by) : ""].filter(Boolean).join(" · ");
      const del = attDel === k + "|" + a.id
        ? '<span class="row" style="flex-wrap:nowrap"><button class="btn" type="button" data-att-del-yes="' + k + "|" + a.id + '">Удалить</button><button class="btn ghost" type="button" data-att-del-no>Отмена</button></span>'
        : '<button class="btn ghost" type="button" data-att-del="' + k + "|" + a.id + '">Удалить</button>';
      return '<div class="att-item"><span>' + (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(a.name) + "</a>" : esc(a.name)) + '<br><span class="dl-sub">' + esc(sub) + "</span></span>" + del + "</div>";
    }).join("");
    return '<div class="att-box"><span class="eyebrow">Вложения и подтверждения</span>' + items +
      (assetsCap ? '<div class="row"><button class="btn" type="button" data-att-file="' + k + '">Прикрепить файл (PDF, фото)</button></div>' : "") +
      '<div class="att-add"><input type="url" id="lnk-' + k + '" placeholder="Ссылка на документ: https://…" aria-label="Ссылка на документ"><button class="btn" type="button" data-att-link="' + k + '">Добавить ссылку</button></div>' +
      (assetsCap ? "" : '<span class="dl-sub">Загружать файлы могут редакторы страницы. Остальные участники могут добавить ссылку, например на Google Диск.</span>') + "</div>";
  }

  function setView(v, push) {
    if (VIEWS.indexOf(v) < 0) v = "tree";
    view = v;
    VIEWS.forEach(x => { document.getElementById("view-" + x).hidden = x !== v; });
    if (push) { try { history.replaceState(null, "", "#" + (v === "tree" ? (selected || "roadmap") : v)); } catch (e) {} if (window.ZHK_onView) window.ZHK_onView(v); }
    renderTabs();
    renderView(true);
    if (v === "tree") drawEdges();
  }
  document.querySelector(".tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) setView(t.dataset.view, true); });
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-goview]");
    if (!g) return;
    if (g.dataset.stage) openDeadlineForm(null, g.dataset.stage);
    setView(g.dataset.goview, true);
    window.scrollTo({ top: 0 });
  });

  function renderView(force) {
    if (view === "model") renderModel(force);
    else if (view === "budget") renderBudget(force);
    else if (view === "deadlines") renderDeadlines();
    else if (view === "gantt") renderGantt(force);
    else if (view === "projects") renderPortfolio(force);
  }

  // --- stage panel --------------------------------------------------------
  const panel = document.getElementById("panel");
  const inner = document.getElementById("panel-inner");

  function chip(id) {
    const n = byId[id];
    return '<button class="chip" type="button" data-go="' + n.id + '" data-state="' + stateOf(n) + '">' + esc(n.code + " · " + n.name) + "</button>";
  }

  function gateHtml(n, st, dc) {
    const left = n.tasks.length - dc;
    const pending = n.req.filter(r => !isDone(byId[r])).map(r => esc(byId[r].name)).join(", ");
    if (st === "done") {
      return '<div class="gate" data-state="done"><b>Условия перехода выполнены</b><span>' + (children[n.id].length ? "Следующие этапы открыты." : "Проект завершён. Поздравляем!") + "</span></div>";
    }
    if (st === "risk") {
      const e = S.early[n.id];
      return '<div class="gate" data-state="risk"><b>Начат досрочно, с риском</b><span>Ещё не пройдены: ' + pending + ".</span>" +
        "<span>Причина: " + esc(e.reason) + " (" + fmt(e.at) + ")</span><span>Осталось " + left + " из " + n.tasks.length + ".</span>" +

  function clampParams(p) {

  function niceStep(span) {
    const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const f = raw / mag;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;
  }
  function chartSvg(R) {
    const W = 640, H = 240, L = 58, Rp = 12, Tp = 12, B = 26;
    const cum = R.months.map(m => m.cum), debt = R.months.map(m => m.debt);
    let lo = Math.min(0, ...cum), hi = Math.max(0, ...cum, ...debt);
    if (hi === lo) hi = lo + 1;
    const step = niceStep(hi - lo);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x = i => L + (W - L - Rp) * (R.N <= 1 ? 0 : i / (R.N - 1));
    const y = v => Tp + (H - Tp - B) * (hi - v) / (hi - lo);
    let g = "";
    for (let v = lo; v <= hi + step / 2; v += step) {
      g += '<line class="' + (Math.abs(v) < step / 1e6 ? "zero" : "grid") + '" x1="' + L + '" x2="' + (W - Rp) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + dec(v / 1e9, Math.abs(step) < 1e9 ? 1 : 0) + "</text>";
    }
    for (let i = 0; i < R.N; i += 6) g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + (i + 1) + "</text>";
    const pts = cum.map((v, i) => x(i) + "," + y(v)).join(" ");
    const area = "M" + x(0) + "," + y(0) + " L" + pts.replace(/ /g, " L") + " L" + x(R.N - 1) + "," + y(0) + " Z";
    const debtPts = debt.map((v, i) => x(i) + "," + y(v)).join(" ");
    const minI = cum.indexOf(Math.min(...cum));
    return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Накопленный денежный поток и долг банку по месяцам">' + g +
      '<path class="cum-area" d="' + area + '"/><polyline class="cum-line" points="' + pts + '"/><polyline class="debt-line" points="' + debtPts + '"/>' +
      '<circle cx="' + x(minI) + '" cy="' + y(cum[minI]) + '" r="4" fill="var(--accent)"/>' +
      '<text x="' + Math.min(x(minI) + 8, W - 150) + '" y="' + Math.min(y(cum[minI]) + 14, H - B - 4) + '">пик потребности ' + dec(-cum[minI] / 1e9, 2) + " млрд</text></svg>";
  }

    modelOut.innerHTML =
      '<div class="verdict" data-tone="' + mTone + '">' + verdict + "</div>" +
      '<div class="kpis">' +
        kpi("Выручка с НДС", short(t.rev)) +
        kpi("Прибыль до налога", short(t.pbt), t.pbt < 0 ? "bad" : "") +
        kpi("Чистая прибыль", short(t.net), t.net < 0 ? "bad" : "") +
        kpi("Маржа к себестоимости", pct(t.margin), mTone) +
        kpi("IRR на собственный капитал", t.irr == null ? "—" : pct(t.irr), t.irr == null ? "" : t.irr >= 0.25 ? "good" : t.irr >= 0.15 ? "warn" : "bad") +
        kpi("NPV при " + dec(p.discount, 0) + "%", short(t.npv), t.npv < 0 ? "bad" : "") +
        kpi("Пиковый долг банку", short(t.peakDebt)) +
        kpi("Пиковая потребность в деньгах", short(t.peakNeed)) +
        kpi("Себестоимость 1 м² с процентами", money(t.costM2)) +
        kpi("НДС к уплате", short(t.vatPaid)) +
        kpi("Проценты по кредиту", short(t.interest)) +

      "</div>" +
      '<div class="card chart"><div class="section-title"><h3 class="eyebrow">Денежный поток по месяцам, млрд тг</h3><span class="muted">' + R.N + " мес.</span></div>" + chartSvg(R) +
        '<div class="chart-legend"><span><i style="background:var(--accent)"></i>Накопленный поток до финансирования</span><span><i style="background:var(--late)"></i>Долг банку</span></div>' +
        '<p class="muted" style="margin-top:8px">Пока линия ниже нуля, проект финансируется собственным капиталом (' + short(Math.min(p.equity, t.peakNeed)) + "), а затем кредитом.</p></div>" +
      '<div class="card sens"><div class="section-title"><h3 class="eyebrow">Чувствительность маржи</h3><span class="muted">цена продажи по столбцам</span></div>' +
        '<div class="tablewrap"><table><tr><th></th>' + PF.map(pf => "<th>" + (pf === 1 ? "Цена" : (pf > 1 ? "+" : "−") + dec(Math.abs(pf - 1) * 100, 0) + "%") + "</th>").join("") + "</tr>" + sens + "</table></div></div>" +
      '<div class="card"><div class="section-title"><h3 class="eyebrow">Структура затрат</h3></div><div class="tablewrap"><table class="t"><tr><th>Статья</th><th class="num">Сумма</th><th class="num">Доля</th></tr>' + catRows + "</table></div>" +
        '<div class="row" style="margin-top:12px">' +
          (downloads ? '<button class="btn" type="button" id="model-csv">Скачать помесячный поток (Excel)</button>' : "") +

        "</div></div>" +
      '<p class="muted">Упрощения модели: продажи равномерны по месяцам, деньги покупателей поступают в месяц продажи, СМР распределены по S-кривой, входящий НДС зачитывается пропорционально доле облагаемой выручки, КПН платится в конце проекта. Цифры примера условные.</p>';
  }

  const renderModel = guarded(modelForm, function () {
    syncModelForm();
    renderModelOutput(readModelForm());
  });
  modelForm.addEventListener("input", e => { if (e.target.dataset.mk) renderModelOutput(readModelForm()); });
  modelForm.addEventListener("change", e => {
    const el = e.target, k = el.dataset.mk;
    if (!k) return;
    let v;
    if (el.type === "checkbox") v = el.checked ? 1 : 0;
    else {
      v = parseNum(el.value);
      if (v == null) { toast("Введите число"); syncModelForm(); return; }
      if (INT_KEYS.indexOf(k) >= 0) v = Math.max(1, Math.round(v));
      el.value = Math.abs(v) >= 1000 ? num(v) : String(v).replace(".", ",");
    }
    if (S.model[k] === v) return;
    commit({ model: { [k]: v } }, { defer: true });
  });
  modelForm.addEventListener("click", e => {
    if (e.target.id !== "model-reset") return;
    const patch = {};

    commit({ model: patch });

  });
  modelOut.addEventListener("click", e => {
    if (e.target.id === "model-csv") {
      const R = window.runModel(params());
      const head = ["Месяц", "Выручка", "Земля", "ИРД и проект", "СМР", "Сети", "Технадзор", "Резерв", "Маркетинг", "Административные", "НДС к уплате", "Проценты", "Поток до финансирования", "Накопленный поток", "Долг банку"];
      const rows = R.months.map(m => [m.m, m.rev, m.cat.land, m.cat.design, m.cat.smr, m.cat.nets, m.cat.supervision, m.cat.reserve, m.cat.marketing, m.cat.admin, m.vat, m.interest, m.rev - m.cost - m.vat, m.cum, m.debt].map(v => Math.round(v)).join(";"));
      save(fileName({ title: "Финмодель помесячно" }, "csv"), "﻿" + [head.join(";")].concat(rows).join("\r\n"));

    if (e.target.closest("[data-plan-from-model]")) { planFromModel(); setView("budget", true); }
  });

  // --- budget -------------------------------------------------------------
  const budgetEl = document.getElementById("view-budget");
  const SPLIT_DESIGN = { ird: 0.10, survey: 0.10, sketch: 0.20, psd: 0.50, expert: 0.10 };
  const SPLIT_SMR = { start: 0.02, zero: 0.18, frame: 0.35, envelope: 0.17, mep: 0.18, finish: 0.10 };
  function planFromModel() {
    const R = window.runModel(params()), c = R.byCat;
    const plan = {};
    budgetRows().forEach(r => { plan[r.id] = 0; });
    plan.land = c.land;
    Object.keys(SPLIT_DESIGN).forEach(k => { plan[k] += c.design * SPLIT_DESIGN[k]; });
    Object.keys(SPLIT_SMR).forEach(k => { plan[k] += (c.smr + c.supervision + c.reserve) * SPLIT_SMR[k]; });
    plan.nets = c.nets; plan.dolevka = c.marketing; plan._admin = c.admin; plan._interest = R.t.interest;
    const patch = {};
    Object.keys(plan).forEach(k => { patch[k] = { plan: Math.round(plan[k] / 1000) * 1000 }; });
    commit({ budget: patch });
    toast("План бюджета заполнен из финмодели");
  }
  let confirmPlan = false;
  const bKpis = document.getElementById("b-kpis"), bTable = document.getElementById("b-table");
  function renderBudgetKpis() {
    const bt = budgetTotals(), dev = bt.fact - bt.plan;
    bKpis.innerHTML = '<div class="kpis">' +
      '<div class="kpi"><span>План</span><b>' + short(bt.plan) + "</b></div>" +
      '<div class="kpi"><span>Факт</span><b>' + short(bt.fact) + "</b></div>" +
      '<div class="kpi" data-tone="' + (bt.plan && dev > 0 ? "bad" : bt.plan ? "good" : "") + '"><span>' + (dev > 0 ? "Перерасход" : "Остаток") + "</span><b>" + short(Math.abs(dev)) + "</b></div>" +
      '<div class="kpi"><span>Освоено</span><b>' + (bt.plan ? pct(bt.fact / bt.plan) : "—") + "</b></div>" +
      '<div class="kpi" data-tone="' + (bt.over ? "bad" : "") + '"><span>Этапов с перерасходом</span><b>' + bt.over + "</b></div></div>";
  }
  const renderBudgetTable = guarded(bTable, function () {
    const bt = budgetTotals();
    const dev = bt.fact - bt.plan;
    const dis = readOnly ? " disabled" : "";
    const rows = budgetRows().map(r => {
      const b = bOf(r.id);
      const d = (b.fact || 0) - (b.plan || 0);
      const over = b.plan > 0 && d > 0;
      const share = b.plan ? Math.min((b.fact || 0) / b.plan, 1) : 0;
      return "<tr><td><span class=\"mono\" style=\"color:var(--muted)\">" + r.code + "</span> " + esc(r.name) + "</td>" +
        '<td><input class="tin" type="text" inputmode="decimal" aria-label="План: ' + esc(r.name) + '" data-b="plan" data-id="' + r.id + '" value="' + (b.plan ? num(b.plan) : "") + '"' + dis + "></td>" +
        '<td><input class="tin" type="text" inputmode="decimal" aria-label="Факт: ' + esc(r.name) + '" data-b="fact" data-id="' + r.id + '" value="' + (b.fact ? num(b.fact) : "") + '"' + dis + "></td>" +
        '<td class="num dev" data-tone="' + (over ? "bad" : b.plan && b.fact ? "good" : "") + '">' + (b.plan || b.fact ? (d > 0 ? "+" : "") + num(d) : "") + "</td>" +
        '<td><div class="meter" data-tone="' + (over ? "bad" : "") + '" title="' + (b.plan ? pct((b.fact || 0) / b.plan) : "") + '"><i style="width:' + Math.round(share * 100) + '%"></i></div></td>' +
        '<td><input class="tin note" type="text" maxlength="120" aria-label="Комментарий: ' + esc(r.name) + '" data-b="note" data-id="' + r.id + '" value="' + esc(b.note || "") + '"' + dis + "></td></tr>";
    }).join("");
    const hasPlan = budgetRows().some(r => bOf(r.id).plan);
    bTable.innerHTML =
      '<div class="card"><div class="section-title"><h2 class="view-title">План и факт по этапам</h2><div class="row">' +
        (readOnly ? "" : confirmPlan
          ? '<span class="muted">Заменить текущий план расчётом из финмодели?</span><button class="btn primary" type="button" data-plan-yes>Да, заменить</button><button class="btn ghost" type="button" data-plan-no>Отмена</button>'
          : '<button class="btn" type="button" data-plan-ask>Заполнить план из финмодели</button>') +
        (downloads ? '<button class="btn" type="button" data-budget-csv>Скачать (Excel)</button>' : "") +
      "</div></div>" +
      '<p class="muted">Суммы в тенге с НДС. Факт вводите нарастающим итогом по оплаченным счетам. Строка краснеет, когда факт превышает план.</p>' +
      '<div class="tablewrap" style="margin-top:10px"><table class="t"><tr><th>Этап</th><th class="num">План, тг</th><th class="num">Факт, тг</th><th class="num">Отклонение</th><th>Освоение</th><th>Комментарий</th></tr>' + rows +
        '<tr class="total"><td>Итого</td><td class="num">' + num(bt.plan) + '</td><td class="num">' + num(bt.fact) + '</td><td class="num dev" data-tone="' + (bt.plan && dev > 0 ? "bad" : "") + '">' + (dev > 0 ? "+" : "") + num(dev) + "</td><td></td><td></td></tr></table></div>" +
      (hasPlan ? "" : '<p class="muted" style="margin-top:10px">План пока пуст. Заполните его вручную или нажмите «Заполнить план из финмодели».</p>') + "</div>";
  });
  function renderBudget(force) { renderBudgetKpis(); renderBudgetTable(force); }
  budgetEl.addEventListener("change", e => { if (e.target.dataset.b) onBudgetInput(e.target); });
  budgetEl.addEventListener("click", e => {
    if (e.target.closest("[data-plan-ask]")) {
      if (budgetRows().some(r => bOf(r.id).plan)) { confirmPlan = true; renderBudgetTable(true); } else planFromModel();
    } else if (e.target.closest("[data-plan-yes]")) { confirmPlan = false; planFromModel(); }
    else if (e.target.closest("[data-plan-no]")) { confirmPlan = false; renderBudgetTable(true); }
    else if (e.target.closest("[data-budget-csv]")) {
      const lines = ["Этап;План, тг;Факт, тг;Отклонение, тг;Комментарий"].concat(budgetRows().map(r => {
        const b = bOf(r.id);
        return [r.code + " " + r.name, b.plan || 0, b.fact || 0, (b.fact || 0) - (b.plan || 0), (b.note || "").replace(/;/g, ",")].join(";");
      }));
      save(fileName({ title: "Бюджет план факт" }, "csv"), "﻿" + lines.join("\r\n"));

  // --- deadlines ----------------------------------------------------------
  const QUICK_DOCS = [
    ["АПЗ", "ird"], ["ТУ на электроснабжение", "ird"], ["ТУ на водоснабжение и водоотведение", "ird"], ["ТУ на теплоснабжение или газоснабжение", "ird"],
    ["ТУ на ливневую канализацию", "ird"], ["Договор аренды земельного участка", "land"], ["Лицензия проектировщика", "sketch"], ["Лицензия генподрядчика", "tender"],
    ["Банковская гарантия исполнения договора", "tender"], ["Банковская гарантия возврата аванса", "tender"], ["Кредитная линия банка", "finance"],
    ["Разрешение МИО на привлечение денег дольщиков", "dolevka"], ["Гарантия КЖК", "dolevka"], ["Аттестаты экспертов технадзора", "start"], ["Страхование строительно-монтажных рисков", "start"]
  ];
  const dlWrap = document.getElementById("dl-form-wrap");
  const dlList = document.getElementById("dl-list");
  let dlEditing = null, dlConfirmDelete = null;

  function openDeadlineForm(id, stage) {
    dlEditing = id || "new";
    const d = id ? S.deadlines[id] || {} : { stage: stage || "" };
    const opts = '<option value="">Без этапа</option>' + T.nodes.map(n => '<option value="' + n.id + '"' + (d.stage === n.id ? " selected" : "") + ">" + n.code + " · " + esc(n.name) + "</option>").join("");
    dlWrap.innerHTML = '<form class="dl-form" id="dl-form" autocomplete="off">' +
      (id ? "" : '<div class="dl-quick">' + QUICK_DOCS.map(([t, s]) => '<button class="chip" type="button" data-quick="' + esc(t) + '" data-qstage="' + s + '">' + esc(t) + "</button>").join("") + "</div>") +
      '<label class="field wide" for="dl-title"><span>Документ *</span><input type="text" id="dl-title" maxlength="120" required placeholder="Например, ТУ на электроснабжение" value="' + esc(d.title || "") + '"></label>' +
      '<label class="field" for="dl-num"><span>Номер</span><input type="text" id="dl-num" maxlength="60" value="' + esc(d.num || "") + '"></label>' +
      '<label class="field" for="dl-issued"><span>Выдан</span><input type="date" id="dl-issued" value="' + esc(d.issued || "") + '"></label>' +
      '<label class="field" for="dl-expires"><span>Действует до *</span><input type="date" id="dl-expires" required value="' + esc(d.expires || "") + '"></label>' +
      '<label class="field" for="dl-owner"><span>Ответственный</span><input type="text" id="dl-owner" maxlength="80" placeholder="Кто продлевает" value="' + esc(d.owner || "") + '"></label>' +

      '<label class="field wide" for="dl-note"><span>Примечание</span><input type="text" id="dl-note" maxlength="200" placeholder="Например, продление подаётся за 30 дней" value="' + esc(d.note || "") + '"></label>' +

  function renderDeadlines() {
