  document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
  document.addEventListener("pointerup", () => { pointerDown = false; flush(); }, true);
  document.addEventListener("focusout", flush, true);

  // --- stage state --------------------------------------------------------
  const key = (n, i) => n.id + "." + (n.keyIds ? n.keyIds[i] : i);
  const doneCount = n => n.tasks.reduce((s, _, i) => s + (S.checked[key(n, i)] ? 1 : 0), 0);
  const isDone = n => doneCount(n) === n.tasks.length;
  const isUnlocked = n => n.req.every(r => isDone(byId[r]));
  const metaOf = k => S.meta[k] || {};
  // Ответственный (задача, документ) — участник команды по ссылке (id); старые записи с текстом показываются как есть.
  const teamLabel = m => [m.role, m.name].filter(Boolean).join(" — ") || "Без роли";
  const whoText = v => isObj((S.team || {})[v]) ? teamLabel(S.team[v]) : v || "";
  const whoSelect = (attrs, v) => '<select ' + attrs + '><option value="">Не выбран</option>' + (v && !isObj((S.team || {})[v]) ? '<option value="' + esc(v) + '" selected>' + esc(v) + "</option>" : "") +
    listOf("team").map(m => '<option value="' + m.id + '"' + (m.id === v ? " selected" : "") + ">" + esc(teamLabel(m)) + "</option>").join("") + "</select>";
  // Ячейка CSV: без разделителя и переносов; текст, начинающийся с = + - @, Excel не должен считать формулой.
  const csvCell = x => { const t = String(x == null ? "" : x).replace(/;/g, ",").replace(/[\r\n]+/g, " "); return /^[=+\-@\t]/.test(t) ? "'" + t : t; };
  const isLate = k => !S.checked[k] && metaOf(k).due && daysTo(metaOf(k).due) < 0;
  const lateCount = n => n.tasks.reduce((s, _, i) => s + (isLate(key(n, i)) ? 1 : 0), 0);
  function stateOf(n) {
    if (isDone(n)) return "done";
    if (isUnlocked(n)) return doneCount(n) > 0 ? "active" : "open";
    return S.early[n.id] ? "risk" : "locked";
  }
  const editable = n => !readOnly && stateOf(n) !== "locked";

  // --- deadlines state ----------------------------------------------------
  const deadlineList = () => Object.entries(S.deadlines).filter(([, d]) => d && d.title)
    .map(([id, d]) => Object.assign({ id }, d))
    .sort((a, b) => (a.expires || "9999").localeCompare(b.expires || "9999"));
  function dlStatus(d) {
    if (!d.expires) return { tone: "", text: "Срок не указан", level: 0 };
    const n = daysTo(d.expires);
    if (n < 0) return { tone: "late", text: "Истёк " + fmt(d.expires), level: 3 };
    if (n <= 30) return { tone: "late", text: (n === 0 ? "Истекает сегодня" : "Осталось " + n + " дн."), level: 2 };
    if (n <= 60) return { tone: "soon", text: "Осталось " + n + " дн.", level: 1 };
    return { tone: "ok", text: "Действует до " + fmt(d.expires), level: 0 };
  }

  // --- budget state -------------------------------------------------------
  const EXTRA_ROWS = [{ id: "_interest", code: "—", name: "Проценты по кредиту" }, { id: "_admin", code: "—", name: "Административные расходы" }];
  const budgetRows = () => T.nodes.concat(EXTRA_ROWS);
  // План бюджета не вводится: он всегда считается из финмодели (planAll). Вручную вносятся только факт и комментарий.
  const bOf = id => Object.assign({}, S.budget[id] || {}, { plan: planAll()[id] || 0 });
  function budgetTotals() {
    let plan = 0, fact = 0, over = 0;
    budgetRows().forEach(r => {
      const b = bOf(r.id);
      plan += b.plan || 0; fact += b.fact || 0;
      if ((b.fact || 0) > (b.plan || 0) && (b.plan || 0) > 0) over++;
    });
    return { plan, fact, over };
  }

  // --- tree ---------------------------------------------------------------
  const treeEl = document.getElementById("tree");
  const edgesEl = document.getElementById("edges");
  const nodeEls = {};

  function buildTree() {
    const tiers = {};
    T.nodes.forEach(n => (tiers[n.lvl] = tiers[n.lvl] || []).push(n));
    Object.keys(tiers).map(Number).sort((a, b) => a - b).forEach(lvl => {
      const row = document.createElement("div");
      row.className = "tier";
      row.innerHTML = '<div class="tier-label"><span></span></div><div class="tier-nodes"></div>';
      row.querySelector(".tier-label span").textContent = tiers[lvl][0].phase;
      const wrap = row.querySelector(".tier-nodes");
      tiers[lvl].forEach(n => {
        const b = document.createElement("button");
        b.className = "node";
        b.type = "button";
        b.innerHTML = '<span class="node-flag" hidden></span><span class="hex"><span class="hex-in"></span></span><span class="node-name"></span><span class="node-sub mono"></span>';
        b.querySelector(".node-name").textContent = n.name;
        b.addEventListener("click", () => select(n.id, true));
        nodeEls[n.id] = b;
        wrap.appendChild(b);
      });
      treeEl.appendChild(row);
    });
  }

  function renderTree() {
    T.nodes.forEach(n => {
      const b = nodeEls[n.id];
      const st = stateOf(n);
      const dc = doneCount(n);
      const late = lateCount(n);
      b.dataset.state = st;
      b.setAttribute("aria-current", selected === n.id ? "true" : "false");
      b.querySelector(".hex").style.setProperty("--p", Math.round(dc / n.tasks.length * 100));
      b.querySelector(".hex-in").textContent = st === "done" ? "✓" : n.code;
      b.querySelector(".node-sub").textContent = st === "locked" ? "закрыт" : (st === "risk" ? "досрочно · " : "") + dc + " / " + n.tasks.length;
      const flag = b.querySelector(".node-flag");
      flag.hidden = !late;
      flag.textContent = "!" + late;
      b.setAttribute("aria-label", n.name + ", " + STATUS[st] + ", выполнено " + dc + " из " + n.tasks.length + (late ? ", просрочено " + late : ""));
    });
    drawEdges();
  }

  function drawEdges() {
    if (view !== "tree") return;
    const box = treeEl.getBoundingClientRect();
    edgesEl.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
    let out = "";
    T.nodes.forEach(n => n.req.forEach(r => {
      const a = nodeEls[r].getBoundingClientRect();
      const c = nodeEls[n.id].querySelector(".hex").getBoundingClientRect();
      const x1 = a.left + a.width / 2 - box.left, y1 = a.bottom - box.top;
      const x2 = c.left + c.width / 2 - box.left, y2 = c.top - box.top;
      const my = (y2 - y1) / 2;
      const cls = isDone(byId[r]) ? (isDone(n) ? "done" : "open") : "";
      out += '<path class="' + cls + '" d="M' + x1 + " " + y1 + " C" + x1 + " " + (y1 + my) + " " + x2 + " " + (y2 - my) + " " + x2 + " " + y2 + '"/>';
    }));
    edgesEl.innerHTML = out;
  }

  // --- HUD, tabs, alerts --------------------------------------------------
  function renderHud() {
    const tasksDone = T.nodes.reduce((s, n) => s + doneCount(n), 0);
    const stagesDone = T.nodes.filter(isDone).length;
    const late = T.nodes.reduce((s, n) => s + lateCount(n), 0);
    let rank = RANKS[0][1];
    RANKS.forEach(([min, name]) => { if (stagesDone >= min) rank = name; });
    document.getElementById("xp").textContent = (tasksDone * XP_PER_TASK) + " / " + (totalTasks() * XP_PER_TASK) + " XP";
    document.getElementById("rank").textContent = rank;
    document.getElementById("stages").textContent = stagesDone + " / " + T.nodes.length + " этапов";
    const p100 = Math.round(tasksDone / totalTasks() * 100);
    const bar = document.getElementById("xpbar");
    bar.setAttribute("aria-valuenow", p100);
    bar.querySelector("i").style.width = p100 + "%";
    const od = document.getElementById("overdue");
    od.hidden = !late;
    od.textContent = "Просрочено пунктов: " + late;
    document.getElementById("reset-zone").hidden = readOnly || !canAdmin;
    const p = S.project;
    document.getElementById("project-line").textContent = p.name
      ? "ЖК «" + p.name + "»" + (p.city ? " · г. " + p.city : "") + (p.company ? " · " + p.company : "")
      : "Девелопмент · Республика Казахстан";
  }

  function renderTabs() {
    document.querySelectorAll(".tab").forEach(t => {
      const on = t.dataset.view === view;
      if (on && t.getAttribute("aria-selected") !== "true" && t.parentNode.scrollWidth > t.parentNode.clientWidth) t.parentNode.scrollLeft = t.offsetLeft - 16;
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    const bt = budgetTotals();
    const bb = document.getElementById("badge-budget");
    bb.hidden = !bt.over;
    bb.textContent = bt.over;
    bb.title = "Этапов с перерасходом: " + bt.over;
    const list = deadlineList().map(dlStatus);
    const urgent = list.filter(s => s.level >= 2).length, soon = list.filter(s => s.level === 1).length;
    const db = document.getElementById("badge-deadlines");
    db.hidden = !(urgent || soon);
    db.textContent = urgent || soon;
    db.dataset.tone = urgent ? "" : "soon";
    const G = schedule(), lateM = G.fend - G.end;
    const bg = document.getElementById("badge-gantt");
    bg.hidden = !(lateM > 0.25); bg.textContent = "+" + mdec(lateM); bg.title = "Прогноз отставания, мес.";
    if (window.ZHK_onBadges) window.ZHK_onBadges();
  }

  function renderAlerts() {
    const el = document.getElementById("alerts");
    const items = deadlineList().filter(d => dlStatus(d).level >= 2);
    el.hidden = !items.length;
    if (!items.length) { el.innerHTML = ""; return; }
    const lines = items.slice(0, 3).map(d => {
      const n = daysTo(d.expires);
      return "<span><b>" + esc(d.title) + "</b>: " + (n < 0 ? "срок истёк " + fmt(d.expires) : n === 0 ? "истекает сегодня" : "истекает через " + n + " дн., " + fmt(d.expires)) + "</span>";
    });
    if (items.length > 3) lines.push("<span>И ещё " + (items.length - 3) + ".</span>");
    el.innerHTML = lines.join("") + '<button class="linkbtn" type="button" data-goview="deadlines">Открыть реестр сроков</button>';
  }

  function renderChrome() { applyRegion(); renderHud(); renderTree(); renderMap(); renderTabs(); renderAlerts(); renderRegion(); renderMinimap(); }

  // --- region bar ---------------------------------------------------------
  const regionBar = document.getElementById("region-bar");
  function regionCount(reg) { return reg ? Object.values(REG[reg].tasks).reduce((s, a) => s + a.length, 0) : 0; }
  const renderRegion = guarded(regionBar, function () {
    const reg = S.project.region && REG[S.project.region] ? S.project.region : "";
    regionBar.dataset.on = reg ? "true" : "false";
    regionBar.innerHTML = '<div class="row"><label for="region-sel">Регион проекта</label><select id="region-sel" class="sel"' + (readOnly ? " disabled" : "") + '>' +
      '<option value="">Регион не выбран</option>' + Object.keys(REG).map(id => '<option value="' + id + '"' + (id === reg ? " selected" : "") + ">" + esc(REG[id].ru.name) + "</option>").join("") + "</select>" +
      (reg ? '<span class="mchip" data-tone="soon">+' + regionCount(reg) + " пунктов для региона</span>" : "") + "</div>" +
      (reg ? '<p class="muted">' + esc(REG[reg].ru.hint) + '</p><p class="muted"><b>Совет</b> ' + esc(REG[reg].ru.tip) + "</p>"
        : '<p class="muted">Выберите регион, чтобы добавить в чек-листы пункты по сейсмике, климату и грунтам.</p>');
  });
  regionBar.addEventListener("change", e => {
    if (e.target.id !== "region-sel" || readOnly) return;
    const v = e.target.value;
    e.target.blur();
    commit({ project: { region: v } });
  });
  function renderAll() { renderChrome(); renderPanel(); renderView(); resolveNames(); if (window.ZHK_onChange) window.ZHK_onChange(); }

  // --- people -------------------------------------------------------------
  const shortText = s => s.length > 90 ? s.slice(0, 88) + "…" : s;
  function nameOf(id) {
    if (!id) return dbCap ? "Без имени" : "Вы";
    if (id === meId) return "Вы";
    return names[id] || "Участник";
  }
  async function resolveNames() {
    if (!userCap) return;
    const varBy = Object.values(S.vars).flatMap(m => m ? [m.sby].concat((m.hist || []).map(h => h.by)) : []).concat(S.baseline && S.baseline.by);
    const ids = [...new Set(Object.values(S.meta).map(m => m && m.doneBy).concat(varBy).filter(x => x && x !== meId && !(x in names)))];
    if (!ids.length) return;
    ids.forEach(id => { names[id] = "Участник"; });
    let ps = {};
    try { ps = await userCap.profiles(ids); } catch (e) { return; }
    ids.forEach(id => { names[id] = (ps[id] && ps[id].name) || "Участник"; });
    renderPanel();
  }

  // --- attachments --------------------------------------------------------
  const ATT_TYPES = { pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", gif: "image/gif" };
  const attList = m => Object.entries((m && m.att) || {}).filter(([, a]) => a && a.name).map(([id, a]) => Object.assign({ id }, a)).sort((a, b) => (a.at || "").localeCompare(b.at || ""));
  const attHref = a => a.kind === "file" ? "/_blob/" + a.asset : (/^https?:\/\//i.test(a.url || "") ? a.url : "");
  const fsize = b => b >= 1048576 ? dec(b / 1048576, 1) + " МБ" : Math.max(1, Math.round(b / 1024)) + " КБ";
  const taskName = k => {
    const [s, i] = k.split("."), n = byId[s];
    const idx = n.keyIds ? n.keyIds.indexOf(i) : +i;
    return shortText(idx >= 0 ? n.tasks[idx] : i);
  };
  const attInput = document.getElementById("att-input");
  attInput.addEventListener("change", async () => {
    const file = attInput.files && attInput.files[0];
    const k = pendingAttKey;
    attInput.value = "";
    if (!file || !k || !assetsCap) return;
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const type = ATT_TYPES[ext] || (Object.values(ATT_TYPES).indexOf(file.type) >= 0 ? file.type : "");
    if (!type) { toast("Поддерживаются PDF и изображения (JPG, PNG, WEBP, GIF). Word и Excel сохраните в PDF или добавьте ссылкой."); return; }
    if (file.size > 20 * 1048576) { toast("Файл больше 20 МБ. Сожмите его или добавьте ссылкой."); return; }
    toast("Загружаю «" + file.name + "»…");
    const proj = curProject;
    try {
      const res = await assetsCap.upload(file, { type });
      const aid = meId ? meId.slice(-4) + Date.now().toString(36) : "a" + Date.now().toString(36);
      writeTo(proj, { meta: { [k]: { att: { [aid]: { kind: "file", name: file.name, asset: res.id, size: res.sizeBytes, type: res.contentType, at: today(), by: meId || "" } } } } });
      toast("Файл прикреплён");
    } catch (e) {
      const c = e && e.code;
      toast(c === "too_large" ? "Файл слишком большой: до 20 МБ." : c === "unsupported_type" ? "Этот тип файла не поддерживается. Сохраните в PDF." : c === "quota_or_state" ? "Хранилище файлов заполнено. Удалите ненужные файлы." : c === "rate_limited" ? "Слишком часто. Попробуйте через минуту." : "Не удалось загрузить файл. Попробуйте ещё раз.");
    }
  });
  function attBoxHtml(k, m) {
    const list = attList(m);
    const items = list.map(a => {
      const href = attHref(a);
      const sub = [a.kind === "file" ? (a.type === "application/pdf" ? "PDF" : "изображение") + (a.size ? ", " + fsize(a.size) : "") : "ссылка", fmt(a.at), a.by ? nameOf(a.by) : ""].filter(Boolean).join(" · ");
      const del = attDel === k + "|" + a.id
        ? '<span class="row" style="flex-wrap:nowrap"><button class="btn" type="button" data-att-del-yes="' + k + "|" + a.id + '">Удалить</button><button class="btn ghost" type="button" data-att-del-no>Отмена</button></span>'
        : '<button class="btn ghost" type="button" data-att-del="' + k + "|" + a.id + '">Удалить</button>';
      return '<div class="att-item"><span>' + (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(a.name) + "</a>" : esc(a.name)) + '<br><span class="dl-sub">' + esc(sub) + "</span></span>" + del + "</div>";
    }).join("");
    return '<div class="att-box"><span class="eyebrow">Вложения и подтверждения</span>' + items +
      (assetsCap ? '<div class="row"><button class="btn" type="button" data-att-file="' + k + '">Прикрепить файл (PDF, фото)</button></div>' : "") +
      '<div class="att-add"><input type="url" id="lnk-' + k + '" placeholder="Ссылка на документ: https://…" aria-label="Ссылка на документ"><button class="btn" type="button" data-att-link="' + k + '">Добавить ссылку</button></div>' +
      (assetsCap ? "" : '<span class="dl-sub">Загружать файлы могут редакторы страницы. Остальные участники могут добавить ссылку, например на Google Диск.</span>') + "</div>";
  }

  function setView(v, push) {
    if (VIEWS.indexOf(v) < 0) v = "tree";
    view = v;
    VIEWS.forEach(x => { document.getElementById("view-" + x).hidden = x !== v; });
    if (push) { try { history.replaceState(null, "", "#" + (v === "tree" ? (selected || "roadmap") : v)); } catch (e) {} if (window.ZHK_onView) window.ZHK_onView(v); }
    renderTabs();
    renderView(true);
    if (v === "tree") drawEdges();
  }
  document.querySelector(".tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) setView(t.dataset.view, true); });
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-goview]");
    if (!g) return;
    if (g.dataset.stage) openDeadlineForm(null, g.dataset.stage);
    setView(g.dataset.goview, true);
    window.scrollTo({ top: 0 });
  });

  function renderView(force) {
    if (view === "model") renderModel(force);
    else if (view === "budget") renderBudget(force);
    else if (view === "deadlines") renderDeadlines();
    else if (view === "gantt") renderGantt(force);
    else if (view === "projects") renderPortfolio(force);
  }

  // --- stage panel --------------------------------------------------------
  const panel = document.getElementById("panel");
  const inner = document.getElementById("panel-inner");

  function chip(id) {
    const n = byId[id];
    return '<button class="chip" type="button" data-go="' + n.id + '" data-state="' + stateOf(n) + '">' + esc(n.code + " · " + n.name) + "</button>";
  }

  function gateHtml(n, st, dc) {
    const left = n.tasks.length - dc;
    const pending = n.req.filter(r => !isDone(byId[r])).map(r => esc(byId[r].name)).join(", ");
    if (st === "done") {
      return '<div class="gate" data-state="done"><b>Условия перехода выполнены</b><span>' + (children[n.id].length ? "Следующие этапы открыты." : "Проект завершён. Поздравляем!") + "</span></div>";
    }
    if (st === "risk") {
      const e = S.early[n.id];
      return '<div class="gate" data-state="risk"><b>Начат досрочно, с риском</b><span>Ещё не пройдены: ' + pending + ".</span>" +
        "<span>Причина: " + esc(e.reason) + " (" + fmt(e.at) + ")</span><span>Осталось " + left + " из " + n.tasks.length + ".</span>" +
        (dc === 0 && !readOnly ? '<button class="btn" type="button" data-early-revoke>Отменить досрочный старт</button>' : "") + "</div>";
    }
    if (st === "locked") {
      let html = '<div class="gate" data-state="locked"><b>Этап закрыт</b><span>Сначала пройдите: ' + pending + ".</span>";
      if (!readOnly && earlyFormFor !== n.id) html += '<button class="btn" type="button" data-early-open>Начать досрочно</button>';
      html += "</div>";
      if (!readOnly && earlyFormFor === n.id) {
        html += '<div class="early-form"><label class="field" for="early-reason"><span>Почему начинаете раньше? Обязательное поле</span>' +
          '<textarea id="early-reason" rows="3" maxlength="400" placeholder="Например: запускаем тендер параллельно с экспертизой, чтобы не потерять строительный сезон"></textarea></label>' +
          '<div class="row"><button class="btn primary" type="button" data-early-go disabled>Начать с риском</button><button class="btn ghost" type="button" data-early-cancel>Отмена</button></div></div>';
      }
      return html;
    }
    return '<div class="gate"><b>Осталось ' + left + " из " + n.tasks.length + "</b><span>Отметьте все пункты, чтобы открыть следующий этап.</span></div>";
  }

  function taskHtml(n, t, i) {
    const k = key(n, i);
    const m = metaOf(k);
    const done = !!S.checked[k];
    const late = isLate(k);
    const dis = editable(n) ? "" : " disabled";
    const chips = [];
    if (n.keyIds && !/^\d+$/.test(n.keyIds[i])) chips.push('<span class="mchip" data-tone="soon">Требования региона</span>');
    if (m.who) chips.push('<span class="mchip">Отв.: ' + esc(whoText(m.who)) + "</span>");
    if (done && m.doneAt) chips.push('<span class="mchip" data-tone="ok">Выполнено ' + fmt(m.doneAt) + (m.doneBy ? " · " + esc(nameOf(m.doneBy)) : "") + "</span>");
    else if (m.due) {
      const d = daysTo(m.due);
      const tone = d < 0 ? "late" : d <= 7 ? "soon" : "";
      const txt = d < 0 ? "Просрочено, срок был " + fmt(m.due) : "Срок " + fmt(m.due) + (d === 0 ? ", сегодня" : "");
      chips.push('<span class="mchip"' + (tone ? ' data-tone="' + tone + '"' : "") + ">" + txt + "</span>");
    }
    const atts = attList(m);
    atts.slice(0, 3).forEach(a => {
      const href = attHref(a);
      chips.push(href ? '<a class="mchip att-chip" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" title="' + esc(a.name) + '">' + (a.kind === "file" ? "Файл: " : "Ссылка: ") + esc(a.name) + "</a>" : '<span class="mchip">' + esc(a.name) + "</span>");
    });
    if (atts.length > 3) chips.push('<span class="mchip">Ещё вложений: ' + (atts.length - 3) + "</span>");
    const open = openEdits.has(k);
    const id = "t-" + k;
    return '<li class="task" data-late="' + late + '">' +
      '<div class="task-row"><label for="' + id + '"><input type="checkbox" id="' + id + '" data-k="' + k + '"' + (done ? " checked" : "") + dis + "><span>" + esc(t) + "</span></label>" +
      (editable(n) ? '<button class="btn ghost task-more" type="button" data-edit="' + k + '" aria-expanded="' + open + '">' + (open ? "Готово" : (m.who || m.due || atts.length ? "Изменить" : "Назначить")) + "</button>" : "") + "</div>" +
      '<div class="task-meta">' + chips.join("") + "</div>" +
      (open && editable(n)
        ? '<div class="task-edit"><label class="field" for="who-' + k + '"><span>Ответственный</span>' + whoSelect('id="who-' + k + '" data-meta="who" data-k="' + k + '"', m.who) + "</label>" +
          '<label class="field" for="due-' + k + '"><span>Срок</span><input type="date" id="due-' + k + '" data-meta="due" data-k="' + k + '" value="' + esc(m.due || "") + '"></label>' + attBoxHtml(k, m) + "</div>"

  const budgetEl = document.getElementById("view-budget");

  let planCache = { key: "", plan: {} };
  function planAll() {
    const p = params(), key = JSON.stringify(p);
    if (key === planCache.key) return planCache.plan;
    const R = window.runModel(p), c = R.byCat, plan = {};
    budgetRows().forEach(r => { plan[r.id] = 0; });
    plan.land = c.land;
    Object.keys(SPLIT_DESIGN).forEach(k => { plan[k] += c.design * SPLIT_DESIGN[k]; });
    Object.keys(SPLIT_SMR).forEach(k => { plan[k] += (c.smr + c.supervision + c.reserve) * SPLIT_SMR[k]; });
    plan.nets = c.nets; plan.dolevka = c.marketing; plan._admin = c.admin; plan._interest = R.t.interest;
    Object.keys(plan).forEach(k => { plan[k] = Math.round(plan[k] / 1000) * 1000; });
    planCache = { key, plan };
    return plan;
  }
  const bKpis = document.getElementById("b-kpis"), bTable = document.getElementById("b-table");

  }

      return "<tr><td><span class=\"mono\" style=\"color:var(--muted)\">" + r.code + "</span> " + esc(r.name) + "</td>" +

"</div>";

  });

  // --- schedule (Gantt, critical path) -----------------------------------
  // Плановые длительности этапов в месяцах. Продажи по ДДУ идут весь срок стройки, в графике это месяц запуска.
  const DUR = { idea: 2, land: 3, ird: 2, survey: 1.5, sketch: 2, finance: 4, psd: 4, expert: 2, tender: 1.5, pkstart: 0.75, dolevka: 1, start: 1, zero: 4, nets: 12, frame: 11, envelope: 6, mep: 8, finish: 6, commission: 1.5, handover: 2, warranty: 24 };
  const KEYS_END = "handover";
  const ganttEl = document.getElementById("view-gantt");
  const thisMonth = () => today().slice(0, 7);
  const schedStart = () => (S.sched && /^\d{4}-\d{2}$/.test(S.sched.start || "")) ? S.sched.start : thisMonth();
  const durOf = id => { const v = S.sched && S.sched.dur && S.sched.dur[id]; return typeof v === "number" && v >= 0 ? v : DUR[id]; };
  const monthsFrom = (ym, iso) => { const y1 = +ym.slice(0, 4), m1 = +ym.slice(5, 7), y2 = +iso.slice(0, 4), m2 = +iso.slice(5, 7), d = +(iso.slice(8, 10) || 1); return (y2 - y1) * 12 + (m2 - m1) + (d - 1) / 30; };
  const ymAdd = (ym, m) => { const t = +ym.slice(0, 4) * 12 + (+ym.slice(5, 7) - 1) + Math.floor(m); return String(Math.floor(t / 12)) + "-" + String(t % 12 + 1).padStart(2, "0"); };
  const ymFmt = ym => ym.slice(5, 7) + "." + ym.slice(0, 4);
  const mdec = x => dec(Math.round(x * 10) / 10, Math.abs(x - Math.round(x)) < 0.05 ? 0 : 1);
  function topo() {
    const out = [], seen = {};
    const visit = n => { if (seen[n.id]) return; seen[n.id] = true; n.req.forEach(r => visit(byId[r])); out.push(n); };
    T.nodes.forEach(visit);
    return out;
  }
  function schedule() {
    const order = topo(), start = schedStart(), now = monthsFrom(start, today());
    const P = {};
    order.forEach(n => {
      const es = n.req.length ? Math.max(...n.req.map(r => P[r].ef)) : 0;
      P[n.id] = { es, ef: es + durOf(n.id), dur: durOf(n.id) };
    });
    const end = P[KEYS_END].ef;
    // Обратный проход: всё, что не ведёт к ключам (гарантия), в критический путь не входит.
    [...order].reverse().forEach(n => {
      const succ = children[n.id].filter(c => c !== "warranty");
      const lf = n.id === "warranty" ? P[n.id].ef : succ.length ? Math.min(...succ.map(c => P[c].ls)) : end;
      P[n.id].lf = lf; P[n.id].ls = lf - P[n.id].dur; P[n.id].slack = Math.max(0, P[n.id].ls - P[n.id].es);
      P[n.id].critical = n.id !== "warranty" && P[n.id].slack < 0.05;
    });
    // Прогноз: завершённый этап кончается по дате последней отметки, просроченный сдвигает всё, что после него.
    order.forEach(n => {
      const p = P[n.id], frac = n.tasks.length ? doneCount(n) / n.tasks.length : 0;
      const fs = Math.max(p.es, ...n.req.map(r => P[r].fe));
      if (isDone(n)) {
        const dates = n.tasks.map((_, i) => metaOf(key(n, i)).doneAt).filter(Boolean).sort();
        p.fe = dates.length ? Math.max(monthsFrom(start, dates[dates.length - 1]), fs) : fs + p.dur;
        p.actual = !!dates.length;
      } else {
        p.fe = now > fs ? Math.max(fs + p.dur, now + p.dur * (1 - frac)) : fs + p.dur;
      }
      p.fs = fs; p.frac = frac;
      p.late = !isDone(n) && now > p.ef + 0.05;
    });
    return { P, order, start, now, end, fend: P[KEYS_END].fe };
  }

  // Этапы СМР для режима «Только СМР (ГПР)» и презентации ПК Start.
  const SMR_IDS = ["start", "zero", "nets", "frame", "envelope", "mep", "finish", "commission"];
  let ganttMode = "all";
  try { if (localStorage.getItem("zhk-gantt-mode") === "smr") ganttMode = "smr"; } catch (e) {}
  const renderGantt = guarded(ganttEl, function () {
    const G = schedule(), P = G.P;
    // Режим «Только СМР»: ГПР от старта СМР до ввода в эксплуатацию, шкала начинается со старта СМР.
    const smr = ganttMode === "smr";
    const list = smr ? T.nodes.filter(n => SMR_IDS.indexOf(n.id) >= 0) : T.nodes;
    const t0 = smr ? Math.floor(P.start.es) : 0;
    const total = smr ? Math.ceil(Math.max(P.commission.ef, P.commission.fe)) + 1 : Math.ceil(Math.max(P.warranty.ef, P.warranty.fe, G.now + 1, 1)) + 1;
    const span = total - t0;
    const W = 22;
    const crit = list.filter(n => P[n.id].critical);
    const blocking = crit.filter(n => !isDone(n));
    const delay = G.fend - G.end;
    const ticks = [];
    for (let m = t0; m <= total; m++) {
      const ym = ymAdd(G.start, m);
      if (ym.slice(5, 7) === "01" || m === t0) ticks.push('<span class="g-year" style="left:' + ((m - t0) * W) + 'px">' + ym.slice(0, 4) + "</span>");
      if ((m - t0) % 3 === 0) ticks.push('<span class="g-tick" style="left:' + ((m - t0) * W) + 'px">' + ym.slice(5, 7) + "</span>");
    }
    const grid = [];
    for (let m = t0; m <= total; m++) if (ymAdd(G.start, m).slice(5, 7) === "01") grid.push('<i class="g-ygrid" style="left:' + ((m - t0) * W) + 'px"></i>');
    const nowLine = G.now >= t0 && G.now <= total ? '<i class="g-now" style="left:' + ((G.now - t0) * W) + 'px" title="Сегодня"></i>' : "";
    const rows = list.map(n => {
      const p = P[n.id], st = stateOf(n);
      const cls = "g-bar" + (p.critical ? " crit" : "") + (st === "done" ? " done" : "") + (n.id === "warranty" ? " tail" : "");
      const shift = p.fe - p.ef;
      const ext = shift > 0.25 && !isDone(n) ? '<span class="g-late" style="left:' + ((p.ef - t0) * W) + "px;width:" + (shift * W) + 'px" title="Прогноз: +' + mdec(shift) + ' мес."></span>' : "";
      const slack = p.slack > 0.05 && n.id !== "warranty" ? '<span class="g-slack" style="left:' + ((p.ef - t0) * W) + "px;width:" + (p.slack * W) + 'px" title="Резерв ' + mdec(p.slack) + ' мес."></span>' : "";
      return '<div class="g-row"><div class="g-label"><button class="linkbtn' + (p.late ? " g-late-name" : "") + '" type="button" data-open-stage="' + n.id + '"' + (p.late ? ' title="Срок этапа по плану прошёл"' : "") + '><span class="mono">' + n.code + "</span> " + esc(n.name) + "</button>" +
        '<span class="g-dur"><input class="tin" type="text" inputmode="decimal" aria-label="Длительность, мес.: ' + esc(n.name) + '" data-gdur="' + n.id + '" value="' + mdec(p.dur) + '"' + (readOnly ? " disabled" : "") + "><span>мес.</span></span></div>" +
        '<div class="g-track" style="width:' + (span * W) + 'px">' + slack + ext +
        '<span class="' + cls + '" style="left:' + ((p.es - t0) * W) + "px;width:" + Math.max(p.dur * W, 3) + 'px" title="' + esc(n.name) + ": " + ymFmt(ymAdd(G.start, p.es)) + " – " + ymFmt(ymAdd(G.start, Math.max(p.ef - 0.01, p.es))) + '"><i style="width:' + Math.round(p.frac * 100) + '%"></i></span>' +
        "</div></div>";
    }).join("");
    const kpi = (label, value, tone) => '<div class="kpi"' + (tone ? ' data-tone="' + tone + '"' : "") + "><span>" + label + "</span><b>" + value + "</b></div>";
    const cm = P.commission, cDelay = cm.fe - cm.ef;
    ganttEl.innerHTML =
      '<div class="g-mode" role="group" aria-label="Что показать"><button class="chip" type="button" data-gmode="all" aria-pressed="' + !smr + '">Весь проект</button><button class="chip" type="button" data-gmode="smr" aria-pressed="' + smr + '">Только СМР (ГПР)</button></div>' +
      (smr ? '<div class="kpis">' +
        kpi("Старт СМР", ymFmt(ymAdd(G.start, P.start.es))) +
        kpi("Ввод по плану", ymFmt(ymAdd(G.start, Math.max(cm.ef - 0.01, 0)))) +
        kpi("Ввод по прогнозу", ymFmt(ymAdd(G.start, Math.max(cm.fe - 0.01, 0))), cDelay > 0.25 ? "bad" : "good") +
        kpi("Длительность СМР", mdec(cm.ef - P.start.es) + " мес.") +
        kpi("Отставание ввода", cDelay > 0.25 ? "+" + mdec(cDelay) + " мес." : "нет", cDelay > 0.25 ? "bad" : "good") +
      "</div>" : '<div class="kpis">' +
        kpi("Старт проекта", ymFmt(G.start)) +
        kpi("Ключи по плану", ymFmt(ymAdd(G.start, G.end))) +
        kpi("Ключи по прогнозу", ymFmt(ymAdd(G.start, G.fend)), delay > 0.25 ? "bad" : "good") +
        kpi("До ключей", mdec(G.end) + " мес.") +
        kpi("Отставание", delay > 0.25 ? "+" + mdec(delay) + " мес." : "нет", delay > 0.25 ? "bad" : "good") +
      "</div>") +
      '<div class="card"><div class="section-title"><h2 class="view-title">' + (smr ? "ГПР: строительно-монтажные работы" : "График строительства") + '</h2>' +
        '<div class="row"><label class="field" for="g-start" style="grid-auto-flow:column;align-items:center;gap:8px"><span>Старт</span><input type="month" id="g-start" class="sel" value="' + G.start + '"' + (readOnly ? " disabled" : "") + "></label>" +
        (readOnly ? "" : '<button class="btn ghost" type="button" id="g-reset">Типовые длительности</button>') + "</div></div>" +
        '<p class="muted">График строится из связей этапов дорожной карты: этап начинается, когда закончены все этапы, которые он требует. Красные этапы лежат на критическом пути: если любой из них задержится, сдвинутся ключи. Длительности можно менять, план пересчитается сразу.</p>' +
        (blocking.length ? '<p class="g-crit"><b>Сдачу сейчас определяют:</b> ' + blocking.slice(0, 6).map(n => '<button class="chip" type="button" data-open-stage="' + n.id + '" data-state="' + stateOf(n) + '">' + esc(n.code + " · " + n.name) + "</button>").join(" ") + "</p>" : "") +
        '<div class="g-legend"><span><i class="lg-crit"></i>Критический путь</span><span><i class="lg-bar"></i>Есть резерв</span><span><i class="lg-slack"></i>Резерв времени</span><span><i class="lg-late"></i>Прогноз сдвига</span><span><i class="lg-done"></i>Пройден</span><span><i class="lg-now"></i>Сегодня</span></div>' +
        '<div class="g-wrap"><div class="g-inner" style="min-width:' + (300 + total * W) + 'px"><div class="g-row g-head"><div class="g-label"></div><div class="g-track g-axis" style="width:' + (span * W) + 'px">' + ticks.join("") + "</div></div>" +
        '<div class="g-body">' + rows + '<div class="g-overlay" style="left:300px;width:' + (span * W) + 'px">' + grid.join("") + nowLine + "</div></div></div></div>" +
        '<p class="muted" style="margin-top:10px">Прогноз: пройденный этап заканчивается по дате последней отметки, незавершённый этап, у которого вышел срок, сдвигает все последующие. Гарантия идёт после ключей и в критический путь не входит.</p></div>';
  });
  ganttEl.addEventListener("change", e => {
    const el = e.target;
    if (el.id === "g-start" && /^\d{4}-\d{2}$/.test(el.value)) {
      commit({ sched: { start: el.value } }, { defer: true });
      return;
    }
    const id = el.dataset.gdur;
    if (!id) return;
    const v = parseNum(el.value);
    if (v == null || v < 0 || v > 120) { toast("Введите длительность в месяцах, от 0 до 120"); el.value = mdec(durOf(id)); return; }
    const val = Math.round(v * 4) / 4;
    if (val === durOf(id)) { el.value = mdec(val); return; }
    commit({ sched: { dur: { [id]: val } } }, { defer: true });
  });
  ganttEl.addEventListener("click", e => {
    const gm = e.target.closest("[data-gmode]");
    if (gm) { ganttMode = gm.dataset.gmode; try { localStorage.setItem("zhk-gantt-mode", ganttMode); } catch (x) {} renderGantt(true); return; }
    const os = e.target.closest("[data-open-stage]");
    if (os) { setView("tree", false); select(os.dataset.openStage, true); return; }
    if (e.target.id === "g-reset") {
      const patch = {};
      Object.keys((S.sched && S.sched.dur) || {}).forEach(k => { patch[k] = null; });
      if (S.sched) S.sched.dur = {};
      commit({ sched: { dur: patch } });
      toast("Возвращены типовые длительности");
    }
  });

  // --- projects (portfolio) ----------------------------------------------
  const portEl = document.getElementById("view-projects");
  const projSel = document.getElementById("proj-sel");
  let projDel = null;
  function projectIds() {
    const ids = dbCap ? ["main"].concat(Object.keys(projects || {}).filter(x => x !== "main")) : localIds();
    if (ids.indexOf(curProject) < 0) ids.push(curProject);
    return ids;
  }
  function projData(id) { return id === curProject ? S : normalize(dbCap ? (projects && projects[id]) || {} : loadLocal(id)); }
  function projName(id) { const d = projData(id); return (d.project && d.project.name) || (id === "main" ? "Основной проект" : "Без названия"); }
  function renderProjSel() {
    const ids = projectIds();
    projSel.innerHTML = ids.map(id => '<option value="' + id + '"' + (id === curProject ? " selected" : "") + ">" + esc(projName(id)) + "</option>").join("") +
      '<option value="__all">Все проекты…</option>';
  }
  projSel.addEventListener("change", () => {
    const v = projSel.value;
    if (v === "__all") { renderProjSel(); setView("projects", true); return; }
    switchProject(v);
  });
  function switchProject(id) {
    if (id === curProject) return;
    curProject = id;
    try { localStorage.setItem(CUR_PROJ, id); } catch (e) {}
    if (dbCap) { docRef = dbCap.doc("progress/" + id); const data = projects && projects[id]; docExists = !!data; S = normalize(data || {}); }
    else S = loadLocal(id);
    regionApplied = null; openEdits.clear(); earlyFormFor = null; attDel = null; achSeen = null;
    applyRegion();
    selected = firstQuest();
    renderAll(); renderProjSel();
    toast("Открыт проект «" + projName(id) + "»");
  }
  async function createProject(name) {
    const id = "p" + Date.now().toString(36);
    const init = normalize({ project: { name } });
    if (dbCap) {
      try { await dbCap.doc("progress/" + id).set(init); } catch (e) { toast("Не удалось создать проект"); return; }
      projects = Object.assign({}, projects, { [id]: init });
    } else {
      try {
        localStorage.setItem(localKey(id), JSON.stringify(init));
        localStorage.setItem(PROJ_IDS, JSON.stringify(localIds().filter(x => x !== "main").concat(id)));
      } catch (e) {}
    }
    switchProject(id);
  }
  async function deleteProject(id) {
    if (id === "main") { toast("Основной проект удалить нельзя."); return; }
    if (!canAdmin) { toast("Удалять проекты могут только редакторы страницы"); return; }
    if (dbCap) {
      try { await dbCap.doc("progress/" + id).delete(); } catch (e) { toast("Не удалось удалить проект"); return; }
      if (projects) { const c = Object.assign({}, projects); delete c[id]; projects = c; }
    } else {
      try { localStorage.removeItem(localKey(id)); localStorage.setItem(PROJ_IDS, JSON.stringify(localIds().filter(x => x !== "main" && x !== id))); } catch (e) {}
    }
    if (id === curProject) switchProject("main"); else { renderProjSel(); renderPortfolio(true); }
    toast("Проект удалён");
  }
  // Метрики чужого проекта считаем теми же функциями, временно подставив его данные.
  function withState(data, fn) {
    const saved = S;
    S = normalize(data); regionApplied = null; applyRegion();
    try { return fn(); } finally { S = saved; regionApplied = null; applyRegion(); }
  }
  function projMetrics() {
    const tasksDone = T.nodes.reduce((s, n) => s + doneCount(n), 0), G = schedule(), bt = budgetTotals();
    return { ready: tasksDone / totalTasks(), stages: T.nodes.filter(isDone).length, keys: ymFmt(ymAdd(G.start, G.fend)), delay: G.fend - G.end,
      budget: bt.plan ? bt.fact / bt.plan : null,
      city: S.project.city || "", region: S.project.region && REG[S.project.region] ? REG[S.project.region].ru.name : "" };
  }
  const renderPortfolio = guarded(portEl, function () {
    const ids = projectIds();
    const rows = ids.map(id => ({ id, name: projName(id), m: id === curProject ? projMetrics() : withState(projData(id), projMetrics) }));
    const avg = rows.reduce((s, r) => s + r.m.ready, 0) / (rows.length || 1);
    const lateN = rows.filter(r => r.m.delay > 0.25).length;
    const tr = rows.map(r => {
      const cur = r.id === curProject;
      const act = cur ? '<span class="mchip" data-tone="ok">Открыт</span>' : '<button class="btn" type="button" data-proj-open="' + r.id + '">Открыть</button>';
      const del = r.id === "main" || readOnly || !canAdmin ? "" : projDel === r.id
        ? '<button class="btn" type="button" data-proj-del-yes="' + r.id + '">Да, удалить</button><button class="btn ghost" type="button" data-proj-del-no>Отмена</button>'
        : '<button class="btn ghost" type="button" data-proj-del="' + r.id + '">Удалить</button>';
      return "<tr" + (cur ? ' class="cur"' : "") + '><td><div class="dl-title">' + esc(r.name) + "</div>" + (r.m.city ? '<div class="dl-sub">' + esc(r.m.city) + "</div>" : "") + "</td>" +
        "<td>" + (r.m.region ? esc(r.m.region) : '<span class="muted">—</span>') + "</td>" +
        '<td><div class="rep-bar" style="grid-template-columns:minmax(60px,1fr) 44px"><div class="meter"><i style="width:' + Math.round(r.m.ready * 100) + '%"></i></div><span class="mono">' + pct(r.m.ready) + "</span></div></td>" +
        '<td class="num">' + r.m.stages + " / " + T.nodes.length + '</td><td class="num">' + r.m.keys + "</td>" +
        '<td class="num dev" data-tone="' + (r.m.delay > 0.25 ? "bad" : "good") + '">' + (r.m.delay > 0.25 ? "+" + mdec(r.m.delay) + " мес." : "нет") + "</td>" +
        '<td class="num">' + (r.m.budget == null ? "—" : pct(r.m.budget)) + "</td>" +
        '<td><div class="row" style="flex-wrap:nowrap">' + act + del + "</div></td></tr>";
    }).join("");
    portEl.innerHTML =
      '<div class="kpis">' +
        '<div class="kpi"><span>Проектов</span><b>' + rows.length + "</b></div>" +
        '<div class="kpi"><span>Средняя готовность</span><b>' + pct(avg) + "</b></div>" +
        '<div class="kpi" data-tone="' + (lateN ? "bad" : "good") + '"><span>С отставанием</span><b>' + lateN + "</b></div>" +
      "</div>" +
      '<div class="card"><div class="section-title"><h2 class="view-title">Портфель проектов</h2></div>' +
        '<p class="muted">Каждый проект хранит свои этапы, график, финмодель, бюджет и реестр сроков. Переключайтесь между проектами в шапке или здесь.</p>' +
        (readOnly ? "" : '<form class="row" id="proj-form" style="margin:10px 0" autocomplete="off"><input type="text" id="proj-name" class="sel" maxlength="80" placeholder="Название нового ЖК" aria-label="Название нового ЖК" style="flex:1;min-width:180px"><button class="btn primary" type="submit">Новый проект</button></form>') +
        '<div class="tablewrap"><table class="t"><tr><th>Проект</th><th>Регион</th><th>Готовность</th><th class="num">Этапов</th><th class="num">Ключи (прогноз)</th><th class="num">Отставание</th><th class="num">Бюджет</th><th></th></tr>' + tr + "</table></div></div>";
  });
  portEl.addEventListener("submit", e => {
    if (e.target.id !== "proj-form") return;
    e.preventDefault();
    const name = (document.getElementById("proj-name").value || "").trim();
    if (!name) { toast("Введите название проекта"); return; }
    createProject(name);
  });
  portEl.addEventListener("click", e => {
    const o = e.target.closest("[data-proj-open]");
    if (o) { switchProject(o.dataset.projOpen); setView("tree", true); return; }
    const d = e.target.closest("[data-proj-del]");
    if (d) { projDel = d.dataset.projDel; renderPortfolio(true); return; }
    if (e.target.closest("[data-proj-del-no]")) { projDel = null; renderPortfolio(true); return; }
    const y = e.target.closest("[data-proj-del-yes]");
    if (y) { projDel = null; deleteProject(y.dataset.projDelYes); }
  });

  // --- риски и команда ----------------------------------------------------
  // Списки проекта: S.risks и S.team — объекты {id: запись}; удалённая запись хранится как null, чтобы удаление дошло до команды.
  // Ответственный за риск хранится ссылкой на участника команды (who): переименовали роль или вписали ФИО — риск показывает новое.
  const LIST_FIELDS = { risks: ["kind", "level", "title", "measure", "who"], team: ["role", "name", "zone"], partners: ["role", "org", "subject", "status"],
    blocks: ["name", "kind", "floors", "under", "entrances", "lifts", "flats", "frame", "design", "contour"],
    scenarios: ["name", "price", "smr", "delay", "sales", "rate"], plans: ["name", "note"], planRooms: ["plan", "kind", "name", "area"] };
  function listOf(k) { return listFrom(S, k); }

    const lo = fl.length ? Math.min(...fl) : null, hi = fl.length ? Math.max(...fl) : null;

  function plansOf(st) {
    const K = Object.fromEntries(window.DICTS.roomKind.items.map(i => [i.v, i])), M = {}, r1 = v => Math.round(v * 10) / 10;
    listFrom(st, "plans").forEach(p => { M[p.id] = { id: p.id, name: p.name || "Планировка", note: p.note || "", rooms: [], area: 0, live: 0, nLive: 0, raw: 0 }; });

  // Квартиры шахматки: число на этаже, номера, планировка, комнаты, площадь, статус. Без графика —
  // чтобы площадь квартир шла в финмодель. Ключ — «блок.подъезд.этаж.поле», квартира — «….q<№>.поле».
  function chessFlats(st) {
    const C = (st && st.chess) || {}, PL = plansOf(st);

    const num = k => { const v = parseNum(C[k]); return v == null || v <= 0 ? null : v; };
    const all = listFrom(st, "blocks"), L = all.map(b => ({ b, fl: Math.min(150, Math.max(0, Math.round(parseNum(b.floors) || 0))), un: Math.min(10, Math.max(0, Math.round(parseNum(b.under) || 0))), en: Math.min(30, Math.max(1, Math.round(parseNum(b.entrances) || 1))) })).filter(x => x.fl + x.un > 0);
    return { PL, skipped: all.length - L.length, blocks: L.map(x => {
      const res = (x.b.kind || "res") === "res";
      // Квартиры блока — поровну по надземным этажам и подъездам, остаток на верхние; свою раскладку можно задать по ячейкам.
      const F = res ? Math.round(parseNum(x.b.flats) || 0) : 0, nc = x.fl * x.en, base = nc ? Math.floor(F / nc) : 0, rem = nc ? F - base * nc : 0;
      const nOf = (e, f) => { const k = x.b.id + "." + e + "." + f, nAuto = res && f > 0 ? base + ((f - 1) * x.en + (e - 1) >= nc - rem ? 1 : 0) : 0, nSet = res && f > 0 ? int(k + ".n") : null; return { nAuto, nSet, n: nSet == null ? nAuto : nSet }; };
      // Номера квартир по умолчанию сквозные в блоке: по подъездам, этажам снизу вверх и по порядку на этаже.
      const first = {}, cells = {}; let no = 0;
      for (let e = 1; e <= x.en; e++) for (let f = 1; f <= x.fl; f++) { first[e + "." + f] = no + 1; no += nOf(e, f).n; }
      for (let e = 1; e <= x.en; e++) for (let f = -x.un; f <= x.fl; f++) {
        if (!f) continue;
        const k = x.b.id + "." + e + "." + f, N = nOf(e, f);
        N.apts = Array.from({ length: N.n }, (_, j) => {
          const kq = k + ".q" + (j + 1) + ".", noSet = int(kq + "no") || null, noAuto = first[e + "." + f] + j, t = PL[C[kq + "t"]] ? C[kq + "t"] : null, pl = t ? PL[t] : null;
          return { q: j + 1, no: noSet || noAuto, noSet, noAuto, t, plan: pl ? pl.name : "", rSet: int(kq + "r") || null, aSet: num(kq + "a"),
            r: pl ? pl.nLive || null : int(kq + "r") || null, a: pl ? pl.area || null : num(kq + "a"), x: Math.min(3, int(kq + "x") || 0) };

  // Продаваемая жилая площадь по шахматке — когда площадь задана у всех квартир; иначе в финмодели остаётся введённое значение.
  function aptsArea(st) {
    let n = 0, a = 0, ok = true;
    chessFlats(st).blocks.forEach(B => Object.values(B.cells).forEach(c => c.apts.forEach(q => { n++; if (q.a) a += q.a; else ok = false; })));

  // Шахматка: этажи и подъезды — из блоков проекта, план по этажам — из графика, объём СМР — из финмодели.
  // Команда вносит только факт: стадию СМР на этаже подъезда и проданные квартиры. Ключ — «блок.подъезд.этаж.поле».
  // Квартиры: «блок.подъезд.этаж.q<№ на этаже>.поле» — no номер, r комнат, a площадь, x статус.
  const CHESS_KEY = /^[\w\-]{1,40}\.\d{1,2}\.-?\d{1,3}\.(st|s|n|q\d{1,2}\.(no|r|a|x|t))$/;
  function chessCalc(at, R) {
    const G = schedule(), P = G.P, C = S.chess || {};
    const t = /^\d{4}-\d{2}$/.test(at || "") ? monthsFrom(G.start, at + "-01") + 1 : G.now;
    const ST = window.DICTS.chessStage.items, W = ST.map(x => P[x.stage].dur || 0), Ws = W.reduce((a, b) => a + b, 0) || 1;
    const part = k => W.slice(0, k).reduce((a, b) => a + b, 0) / Ws;
    const smr = (R || window.runModel(params())).byCat.smr || 0;
    const int = k => { const v = parseNum(C[k]); return v == null ? null : Math.max(0, Math.round(v)); };
    const CF = chessFlats(S), L = CF.blocks.map(B => B.x);
    // Объём СМР из финмодели делится поровну на этаж подъезда, внутри этажа — по длительности стадий в графике.
    const nCells = L.reduce((a, x) => a + (x.fl + x.un) * x.en, 0), unit = nCells ? smr / nCells : 0;
    const sp = P.handover.ef - P.dolevka.es, share = sp > 0 ? Math.min(1, Math.max(0, (t - P.dolevka.es) / sp)) : 0;
    const zero = () => ({ cells: 0, pw: 0, fw: 0, plan: 0, fact: 0, flats: 0, sold: 0, late: 0, rsv: 0, area: 0, aptA: 0 }), tot = zero();
    const blocks = CF.blocks.map(B => {
      const x = B.x, res = B.res, F = B.F, floors = [], cells = {}, bt = zero();
      for (let f = x.fl; f >= 1; f--) floors.push(f);
      for (let f = -1; f >= -x.un; f--) floors.push(f);
      floors.forEach(f => { for (let e = 1; e <= x.en; e++) {

// События календаря: из графика, чек-листов и реестра документов; праздники — на 18 месяцев вперёд.
function calEvents() {
  const ev = window.ZHK ? window.ZHK.events() : [], y = TODAY.getFullYear(), till = new Date(y, TODAY.getMonth() + 18, 1);
  [y, y + 1].forEach(yy => HOLIDAYS.forEach(([md, t]) => { const d = new Date(yy + "-" + md); if (d >= new Date(y, TODAY.getMonth(), 1) && d < till) ev.push({ date: yy + "-" + md, kind: "hol", title: t }); }));
  return ev.sort((a, b) => a.date.localeCompare(b.date));
}

function money(n) { return (n / 1e9).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + " млрд ₸" }

function viewStandards() {
  const list = STD.filter(s => matches(s, filt));
  const sel = (k, label, opts, fmt = o => o) => {
    const fromCard = KEYS.includes(k) && filt[k] && filt[k] === card[k];
    return `<label>${label}<select id="f-${k}" data-f="${k}" class="${fromCard ? "from-card" : ""}"><option value="">Все</option>${opts.map(o => `<option value="${esc(o)}"${filt[k] === o ? " selected" : ""}>${esc(fmt(o))}</option>`).join("")}</select></label>`;
  };
  const sum = DIRS.map(d => {
    const items = STD.filter(s => s.dir === d.id && matches(s, { ...filt, dir: "", status: "" }));
    const n = items.length || 1;
    const by = st => items.filter(s => s.status === st).length;
    const seg = ["done", "agreed", "changed", "new", "fail"].map(st => `<i style="width:${by(st) / n * 100}%;background:var(--${{ done: "ok", agreed: "accent", changed: "info", new: "signal", fail: "bad" }[st]})"></i>`).join("");
    return `<div><div class="row between"><span class="dir">${d.id}</span><span class="mono muted">${items.length}</span></div><div class="full" title="${d.name}">${d.name}</div><div class="bar">${items.length ? seg : ""}</div></div>`;
  }).join("");
  const rows = list.map(s => `<button class="std" data-std="${s.code}">
      <span class="code mono muted">${s.code}</span>
      <span style="min-width:0"><span class="t">${esc(s.name)}</span><span class="meta"><span class="tag">${s.dir}</span>${s.scheme ? '<span class="tag">Схема</span>' : ""}${s.nom.length ? `<span class="tag">Смета: ${s.nom.length}</span>` : ""}<span class="tag">v${s.ver}</span></span></span>
      <span class="prog num">${done(s)}/${s.checks.length}</span>${chip(s.status)}</button>`).join("");
  return head("Стандарты", "Отобраны по данным карточки проекта. Без лишних шагов: фильтр, стандарт, чек-лист.", true) + `
  <section class="panel stack">
    <div class="row between"><h2>Фильтры</h2><div class="row"><span class="tag auto">Синие — из карточки проекта</span><button class="btn" id="f-card">Как в карточке</button><button class="btn ghost" id="f-clear">Сбросить всё</button></div></div>
    <div class="filters">
      ${KEYS.map(k => sel(k, KEYLBL[k], OPTIONS[k], k === "stage" ? o => STAGE[o] : undefined)).join("")}
      ${sel("dir", "Направление", DIRS.map(d => d.id))}
      ${sel("status", "Статус", Object.keys(STATUS), o => STATUS[o].t)}
    </div>
  </section>
  <section class="stack"><div class="row between"><h2>Общий чек-лист соблюдения стандартов</h2><div class="row">${Object.keys(STATUS).map(chip).join("")}</div></div><div class="summary">${sum}</div></section>
  <section class="stack"><div class="row between"><h2>Найдено: <span class="num">${list.length}</span></h2></div>
    <div class="std-list">${rows || `<div class="empty">Под эти параметры стандартов нет. Ослабьте фильтры или нажмите «Как в карточке».</div>`}</div>
  </section>`;
}

function openStd(code) {
  const s = STD.find(x => x.code === code); if (!s) return;
  const layer = document.getElementById("layer");
  const render = () => {
    const n = done(s);
    layer.innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
      <div class="row between"><span class="mono muted">${s.code} · v${s.ver} · ${s.dir}</span><button class="btn" data-close id="close-std">Закрыть</button></div>
      <div class="stack" style="gap:8px"><h2>${esc(s.name)}</h2><div class="row">${chip(s.status)}${[...new Set([].concat(s.stage === ALL ? ["Все этапы"] : s.stage.map(id => STAGE[id]), s.work === ALL ? [] : s.work))].map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
      ${s.scheme ? `<section class="stack" style="gap:8px"><span class="label">Схема (векторная графика)</span><div class="scheme">${scheme(s.scheme)}</div></section>` : ""}
      <section class="stack" style="gap:4px"><div class="row between"><span class="label">Чек-лист выполнения</span><span class="mono num">${n}/${s.checks.length}</span></div>
        <div class="bar"><i style="width:${n / s.checks.length * 100}%;background:var(--ok)"></i></div>
        <div>${s.checks.map((c, i) => { const id = s.code + ":" + i; return `<label class="check${checks[id] ? " on" : ""}"><input type="checkbox" id="chk-${i}" data-chk="${id}"${checks[id] ? " checked" : ""}><span>${esc(c)}</span></label>` }).join("")}</div>
      </section>
      ${s.nom.length ? `<section class="stack" style="gap:8px"><span class="label">Сметная номенклатура СМР и ТМЦ</span><div class="tbl"><table><thead><tr><th>Тип</th><th>Код</th><th>Наименование</th><th>Ед.</th></tr></thead><tbody>${s.nom.map(r => `<tr><td><span class="tag">${r[0]}</span></td><td class="mono">${r[1]}</td><td>${esc(r[2])}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
      <div class="row"><button class="btn primary" id="agree">Согласовать</button><button class="btn" id="propose">Предложить изменение</button></div>
      <div id="std-msg" class="muted" aria-live="polite"></div>
    </aside>`;
    layer.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
    layer.querySelectorAll("[data-chk]").forEach(b => b.onchange = () => { checks[b.dataset.chk] = b.checked; store.set("checks", checks); if (done(s) === s.checks.length && s.status !== "done") s.status = "done"; render(); });
    layer.querySelector("#agree").onclick = () => { s.status = "agreed"; render(); layer.querySelector("#std-msg").textContent = "Стандарт согласован (в прототипе — до перезагрузки)." };
    layer.querySelector("#propose").onclick = () => { s.status = "changed"; render(); layer.querySelector("#std-msg").textContent = "Изменение отправлено владельцу стандарта, статус «Изменён»." };
  };
  const close = () => { layer.innerHTML = ""; route() };
  render();
  document.getElementById("close-std").focus();
}

function viewCal() {
  const months = {};
  calEvents().filter(e => evKinds.has(e.kind)).map(e => [e.date, e.kind, e.title]).forEach(e => { const d = new Date(e[0] + "T00:00"); const k = d.toLocaleDateString("ru-RU", { month: "long", year: "numeric" }); (months[k] ||= []).push([d, ...e.slice(1)]) });
  const same = (a, b) => a.toDateString() === b.toDateString();
  return head("Календарь событий", "Собирается из данных проекта: старты этапов и ключи — из графика, сроки — из чек-листов дорожной карты и реестра документов. Праздники РК — справочник.") + `
  <div class="row">${Object.entries(KIND).map(([k, [t, c]]) => `<button class="typebtn ${c}" aria-pressed="${evKinds.has(k)}" data-kind="${k}">${t}</button>`).join("")}</div>
  ${Object.entries(months).map(([m, evs]) => `<section class="month"><span class="label">${m}</span>${evs.map(([d, k, t]) => `<div class="ev${d < TODAY && !same(d, TODAY) ? " past" : ""}${same(d, TODAY) ? " today" : ""}"><span class="d num">${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}</span><span>${esc(t)}${same(d, TODAY) ? ' <span class="muted">· сегодня</span>' : ""}</span><span class="chip ${KIND[k][1]}">${KIND[k][0]}</span></div>`).join("")}</section>`).join("") || '<div class="empty">Выберите хотя бы один тип событий.</div>'}`;
}

    const items = lvl2.map(x => ({ a: x.a, name: x.name, sum: Math.round(sumUnder(x.a)), err: errUnder(x.a) }));
    const sections = top.map(x => ({ a: x.a, name: x.name, sum: Math.round(sumUnder(x.a)), err: errUnder(x.a) }));
    const total = sections.reduce((s, x) => s + x.sum, 0);
    window.ZHK.setPnrCalc({ at: new Date().toISOString(), file: F.name, total, sections, items, mism, left: pnrLeft() });
    setTimeout(() => pnrSay(mism > 5 ? `Посчитано. Внимание: ${mism} строк листа «Показатели проекта» в файле не совпадают с порталом — возможно, другая версия калькулятора.` : "Посчитано и сохранено в проект."), 0);
    return true;
  } catch (e) { pnrSay(("Не удалось прочитать файл: " + (e && e.message ? e.message : "ошибка")).replace(/([^.?!])$/, "$1.")); return false; }
}

const WI_PARAMS = [["price", "Цена продажи", "%"], ["smr", "Стоимость СМР", "%"], ["delay", "Задержка старта СМР и продаж", "мес."], ["sales", "Длительность продаж", "%"], ["rate", "Ставка кредита", "п.п."]];

const wiAssume = sc => WI_PARAMS.filter(([f]) => +String(sc[f] || "").replace(",", ".")).map(([f, l, u]) => { const v = +String(sc[f]).replace(",", "."); return l.split(" ")[0] + " " + (v > 0 ? "+" : "−") + Math.abs(v).toLocaleString("ru-RU") + (u === "%" ? "%" : " " + u); }).join(", ") || "как в базовом";
const WI_OUT = [["net", "Чистая прибыль", "m", 1], ["margin", "Маржа", "%", 1], ["irr", "IRR", "%", 1], ["npv", "NPV", "m", 1], ["peakDebt", "Пиковый долг", "m", -1], ["keys", "Ключи", "ym", -1]];
const wiFmt = (v, k) => v == null || (typeof v === "number" && !isFinite(v)) ? "—" : k === "m" ? bln(v) + " млрд" : k === "%" ? v.toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + "%" : k === "ym" ? v.slice(5, 7) + "." + v.slice(0, 4) : String(v);
function wiDelta(b, v, k, better) {
  if (v == null || b == null) return "";
  if (k === "ym") { const d = (+v.slice(0, 4) * 12 + +v.slice(5, 7)) - (+b.slice(0, 4) * 12 + +b.slice(5, 7)); return d ? `<div class="delta ${d * better > 0 ? "good" : "bad"}">${d > 0 ? "+" : "−"}${Math.abs(d)} мес.</div>` : ""; }
  const d = v - b; if (Math.abs(d) < (k === "m" ? 5e5 : 0.05)) return "";
  return `<div class="delta ${d * better > 0 ? "good" : "bad"}">${d > 0 ? "+" : "−"}${k === "m" ? bln(Math.abs(d)) + " млрд" : Math.abs(d).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " п.п."}</div>`;

function todayItems() {
  const Z = window.ZHK, V = Object.fromEntries(Z.vars().map(v => [v.id, v])), ev = Z.events(), out = [];
  const t0 = isoDay(new Date()), plus = n => isoDay(new Date(Date.now() + n * 86400000));
  ev.filter(e => e.kind === "due" && e.date < t0).forEach(e => out.push({ lvl: "bad", what: "Просрочен пункт этапа", text: e.title, when: e.date, href: "roadmap" }));
  ev.filter(e => e.kind === "doc" && e.date <= plus(60)).forEach(e => out.push({ lvl: e.date <= plus(30) ? "bad" : "warn", what: e.date < t0 ? "Документ истёк" : "Истекает документ", text: e.title.replace(/^Истекает: /, ""), when: e.date, href: "deadlines" }));
  if (V.delay && V.delay.raw > 0.25) out.push({ lvl: "bad", what: "Отставание от графика", text: "ключи по прогнозу " + V.keys_fc.text + ", по плану " + V.keys_plan.text, href: "gantt" });
  const X = Z.chess();
  if (X.tot.late) out.push({ lvl: "warn", what: "Стройка отстаёт", text: "этажей подъездов ниже плановой стадии: " + X.tot.late, href: "chess" });
  if (X.tot.flats && X.tot.sold < X.tot.soldPlan) out.push({ lvl: "warn", what: "Продажи ниже плана", text: "продано " + X.tot.sold + " квартир из плана " + X.tot.soldPlan, href: "chess" });
  const B = Z.budget(); if (B.over) out.push({ lvl: "warn", what: "Перерасход бюджета", text: "этапов с фактом выше плана: " + B.over, href: "budget" });
  const inp = Object.values(V).filter(v => !v.calc), dr = inp.filter(v => v.st === "draft").length, ag = inp.filter(v => v.st === "agreed").length;
  if (!Z.baseline()) out.push({ lvl: "info", what: "Базовая версия ПК Start", text: "не зафиксирована: отклонения не с чем сравнивать", href: "data" });
  if (dr + ag) out.push({ lvl: "info", what: "Данные на согласовании", text: "черновиков: " + dr + ", ждут утверждения: " + ag, href: "data" });

  return out.sort((a, b) => R[a.lvl] - R[b.lvl] || (a.when || "9").localeCompare(b.when || "9"));
}

    I.push({ kind: "Квартира", title: "Кв. " + a.no, sub: b.name + ", подъезд " + e + ", этаж " + f + (a.plan ? ", " + a.plan : ""), key: "кв " + a.no, go: () => { chUI.layer = "apts"; chUI.sel = b.id + "." + ef; goHash("chess"); } }); })));

function openSearch() {
  const layer = document.getElementById("layer"), I = searchIndex();
  layer.innerHTML = `<div class="scrim" data-s-close></div><div class="search" role="dialog" aria-modal="true" aria-label="Поиск по порталу">
    <input id="s-q" type="search" placeholder="Раздел, показатель, квартира, документ, стандарт, этап, человек" autocomplete="off" aria-label="Что найти">
    <div id="s-res" class="s-res" role="listbox"></div><div class="muted s-hint">↑ ↓ — выбор, Enter — открыть, Esc — закрыть</div></div>`;
  const q = layer.querySelector("#s-q"), res = layer.querySelector("#s-res");
  let hits = [], at = 0;
  const norm = x => String(x).toLowerCase().replace(/ё/g, "е");
  const draw = () => {
    const w = norm(q.value).trim().split(/\s+/).filter(Boolean);
    hits = !w.length ? I.filter(x => x.kind === "Раздел") : I.filter(x => { const h = norm(x.title + " " + x.sub + " " + x.kind + " " + (x.key || "")); return w.every(t => h.includes(t)); });
    const per = {}; hits = hits.filter(x => (per[x.kind] = (per[x.kind] || 0) + 1) <= 8).slice(0, 40); at = Math.min(at, Math.max(0, hits.length - 1));
    res.innerHTML = hits.length ? hits.map((x, i) => `<button type="button" role="option" class="s-item${i === at ? " on" : ""}" data-s="${i}" aria-selected="${i === at}"><span class="tag">${esc(x.kind)}</span><span class="s-t">${esc(x.title)}</span><span class="muted s-sub">${esc(x.sub)}</span></button>`).join("") : '<div class="empty">Ничего не найдено.</div>';
    const on = res.querySelector(".on"); if (on) on.scrollIntoView({ block: "nearest" });
  };
  q.oninput = () => { at = 0; draw(); };
  q.onkeydown = e => {
    if (e.key === "ArrowDown") { at = Math.min(at + 1, hits.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { at = Math.max(at - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && hits[at]) { e.preventDefault(); hits[at].go(); }
  };
  res.onclick = e => { const b = e.target.closest("[data-s]"); if (b && hits[+b.dataset.s]) hits[+b.dataset.s].go(); };
  layer.querySelector("[data-s-close]").onclick = () => { layer.innerHTML = ""; };
  draw(); q.focus();
}
document.addEventListener("keydown", e => {
  const typing = e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName));
  if (((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K" || e.code === "KeyK")) || (e.key === "/" && !typing && !document.getElementById("layer").innerHTML)) { e.preventDefault(); openSearch(); }
});

      { x: 0.5, y: 1.2, w: 12.3, fontFace: F, fontSize: 13, border: { type: "solid", color: "E3E6EA", pt: 0.75 }, colW: [4.5, 2.6, 2.6, 2.6] });

    const dr = ["area_total", "area_sale", "price", "smr", "land", "design", "nets", "rate", "equity"].map(id => V[id]).filter(v => v && v.st === "draft");
    s.addText(dr.length ? "Ключевые данные в статусе «черновик»: " + dr.map(v => v.name).join(", ") + "." : "Ключевые данные согласованы.", { x: 0.5, y: 2.6, w: 12.3, h: 1.2, fontFace: F, fontSize: 15, color: INK, valign: "top" });

  }

  // Команда

    { x: 0.5, y: 1.2, w: 12.3, fontFace: F, fontSize: 12, color: INK, border: { type: "solid", color: "E3E6EA", pt: 0.75 }, colW: [3.6, 3.4, 5.3] });
  else s.addText("Команда не заполнена. Добавьте роли на странице «Команда проекта».", { x: 0.5, y: 1.2, w: 12, h: 0.5, fontFace: F, fontSize: 16, color: INK });
  // Решение
  s = page("Предлагаемое решение");
  s.addText([`Одобрить запуск проекта ${D.title}.`, `Утвердить бюджет ${t("fin_cost")} с НДС и цену продажи жилья ${t("price")}.`, `Утвердить старт СМР ${d.smrStart} и передачу ключей ${t("keys_plan")}.`,
    "Назначить руководителя проекта: " + D.pm + ".", "Зафиксировать базовую версию данных проекта на дату комитета."].map(l => ({ text: l, options: { bullet: { type: "number" }, paraSpaceAfter: 10 } })),
    { x: 0.5, y: 1.3, w: 12.3, h: 4.5, fontFace: F, fontSize: 20, color: INK, valign: "top" });
  try { await window.ZHK.save(deckFile("pptx"), await x.write({ outputType: "blob" })); deckSay("PowerPoint готов.") }
  catch (e) { deckSay("Не удалось собрать PowerPoint.") }
}

// Показатели: сводка, финмодель и сроки документов — подразделы одной страницы.
// Разделы той же группы — вкладками под заголовком (на телефоне, где меню свёрнуто в ленту групп).
function subTabs(v) {
  const items = Object.keys(VIEWS).filter(k => VIEWS[k].g === VIEWS[v].g);
  if (items.length < 2) return "";
  return `<nav class="subtabs" aria-label="Разделы группы">${items.map(k => { const n = navCnt(k, VIEWS[k]); return `<a href="#${k}"${k === v ? ' aria-current="page"' : ""}>${VIEWS[k].t}${n && (VIEWS[k].z || VIEWS[k].alert) ? ` <span class="cnt alert">${n}</span>` : ""}</a>`; }).join("")}</nav>`;
}

// ---------- Дорожная карта (приложение этапов) ----------
// Работает в изолированном блоке (shadow DOM): свои стили не пересекаются с порталом, цвета берутся из портала.
let cur = "card", zhkHost = null;
const ZKEY = Object.fromEntries(Object.entries(VIEWS).filter(([, x]) => x.z).map(([k, x]) => [x.z, k]));
function bootZhk() {
  zhkHost = document.createElement("div");
  zhkHost.id = "zhk";
  const root = zhkHost.attachShadow({ mode: "open" });
  root.innerHTML = document.getElementById("zhk-tpl").innerHTML;
  const body = root.querySelector(".zhk");
  window.ZHK_ROOT = body;
  window.ZHK_BOOT({
    getElementById: id => root.getElementById(id), querySelector: s => root.querySelector(s), querySelectorAll: s => root.querySelectorAll(s),
    addEventListener: (...a) => root.addEventListener(...a), createElement: t => document.createElement(t), createRange: () => document.createRange(),
    fonts: document.fonts, body, documentElement: document.documentElement, get activeElement() { return root.activeElement },
  });
}
function mountZhk(main, view, mode) {
  main.appendChild(zhkHost);
  zhkHost.dataset.view = view;
  zhkHost.dataset.mode = mode || "";
  window.ZHK.setView(view);
  if (mode) window.ZHK.redraw();
}
function zhkBadge(view) {
  const b = zhkHost && zhkHost.shadowRoot.getElementById("badge-" + view);
  return b && !b.hidden && b.textContent.trim() ? b.textContent.trim() : "";
}
// Переход внутри дорожной карты (например, «Открыть в графике»): обновить заголовок и меню без перерисовки дерева.
window.ZHK_onView = v => {
  const k = v === "tree" ? (cur === "scheme" ? "scheme" : "roadmap") : ZKEY[v]; if (!k) return;
  cur = k; zhkHost.dataset.view = v;
  document.getElementById("nav").innerHTML = navHtml(k);
  const old = document.querySelector("#main > .subtabs"); if (old) old.remove();
  const top = document.querySelector("#main > .topbar"); if (top) top.outerHTML = VIEWS[k].r() + subTabs(k);
};
// Данные проекта изменились (своя правка или синхронизация команды): обновить карточку, стандарты и счётчики.
window.ZHK_onChange = late => {
  // При переходе по Tab изменение приходит, когда фокус ещё «между полями»: ждём, пока он встанет на следующее поле.
  const f = document.activeElement;
  if (!late && (!f || f === document.body)) { clearTimeout(window.zocT); window.zocT = setTimeout(() => window.ZHK_onChange(true), 0); return; }
  const before = JSON.stringify(pick(card));
  syncCard();
  if (JSON.stringify(pick(card)) !== before) filt = { ...filt, ...pick(card) };
  if (!document.getElementById("main").children.length) return;
  if (VIEWS[cur].z) { const l = document.querySelector("#main > .topbar .crumbs .label"); if (l) l.textContent = projTitle(); return; }
  const a = document.activeElement;
  if (a && a.closest && a.closest("#main") && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && /^(text|month)$/.test(a.type)))) return;
  route();
};
window.ZHK_onBadges = () => {
  if (!zhkHost) return;
  document.getElementById("nav").innerHTML = navHtml(cur);
  const st = document.querySelector("#main > .subtabs"); if (st) st.outerHTML = subTabs(cur);
};

function bind(m) {
  m.querySelectorAll("[data-pk]").forEach(el => el.onchange = () => window.ZHK.setProject({ [el.dataset.pk]: el.value.trim() }));
  m.querySelectorAll("[data-var]").forEach(el => el.onchange = () => {
    const r = window.ZHK.setVar(el.dataset.var, el.type === "checkbox" ? el.checked : el.value);
    if (typeof r === "string") { el.setCustomValidity(r); el.reportValidity(); setTimeout(() => el.setCustomValidity(""), 2000) }
  });
  m.querySelectorAll("[data-vst]").forEach(b => b.onclick = () => { const [id, st] = b.dataset.vst.split(":"); window.ZHK.setVarStatus(id, st) });
  m.querySelectorAll("[data-df]").forEach(el => { el[el.tagName === "INPUT" ? "oninput" : "onchange"] = () => {
    dataF[el.dataset.df] = el.value;
    if (el.tagName !== "INPUT") return route();
    clearTimeout(window.dfT); window.dfT = setTimeout(() => { route(); const q = document.getElementById("df-q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length) }, 250);
  } });
  const dp = m.querySelector("#deck-pptx"); if (dp) dp.onclick = deckPptx;
  const df = m.querySelector("#deck-pdf"); if (df) df.onclick = deckPdf;
  const du = m.querySelector("#deck-full"); if (du) du.onclick = () => { const d = document.getElementById("deck"); (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(() => deckSay("Полноэкранный режим здесь недоступен.")) };
  const bf = m.querySelector("#base-fix"); if (bf) bf.onclick = () => { baseAsk = true; route() };
  const by = m.querySelector("#base-yes"); if (by) by.onclick = () => { baseAsk = false; window.ZHK.fixBaseline() };
  const bn = m.querySelector("#base-no"); if (bn) bn.onclick = () => { baseAsk = false; route() };
  m.querySelectorAll("[data-f]").forEach(s => s.onchange = () => { filt[s.dataset.f] = s.value; route() });
  const fc = m.querySelector("#f-card"); if (fc) fc.onclick = () => { filt = { ...pick(card), dir: "", status: "" }; route() };
  const fx = m.querySelector("#f-clear"); if (fx) fx.onclick = () => { filt = { region: "", city: "", klass: "", stage: "", work: "", construct: "", dir: "", status: "" }; route() };
  m.querySelectorAll("[data-std]").forEach(b => b.onclick = () => openStd(b.dataset.std));
  m.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { const k = b.dataset.kind; evKinds.has(k) ? evKinds.delete(k) : evKinds.add(k); route() });
  m.querySelectorAll("[data-item]").forEach(el => el.onchange = () => {
    const [k, id, f] = el.dataset.item.split(":");
    window.ZHK.setItem(k, id, { [f]: el.value });
    if (el.tagName === "SELECT") route();
    // Сценарии «что если»: итоги пересчитываются сразу, курсор остаётся в поле, куда перешёл пользователь.
    else if (k === "scenarios" || k === "plans" || k === "planRooms") setTimeout(() => { const a = document.activeElement, sel = a && a.dataset ? a.dataset.item : null; route(); const nx = sel && document.querySelector(`[data-item="${sel}"]`); if (nx) nx.focus(); }, 0);
  });
  m.querySelectorAll("[data-item-del]").forEach(b => b.onclick = () => { const [k, id] = b.dataset.itemDel.split(":"); window.ZHK.setItem(k, id, null) });
  m.querySelectorAll("[data-item-add]").forEach(b => b.onclick = () => {
    const k = b.dataset.itemAdd, id = window.ZHK.setItem(k, null, k === "risks" ? { kind: "risk", level: "mid" } : k === "partners" ? { status: "tender" } : k === "blocks" ? { name: "Блок " + (window.ZHK.list("blocks").length + 1), kind: "res" } : k === "scenarios" ? { name: "Свой сценарий" } : k === "plans" ? { name: "Новая планировка" } : { role: "" });
    const el = id && document.querySelector(`[data-item="${k}:${id}:${{ risks: "title", partners: "org", blocks: "floors", scenarios: "price", plans: "name" }[k] || "role"}"]`); if (el) { el.focus(); if (el.select) el.select(); }
  });
  m.querySelectorAll("[data-b0]").forEach(el => el.onchange = () => { window.ZHK.setB0(el.dataset.b0, el.type === "checkbox" ? (el.checked ? "1" : "") : el.value); if (el.tagName === "SELECT" || el.type === "checkbox") route() });
  const bx = m.querySelector("#b0-xlsx"); if (bx) bx.onclick = b0Xlsx;
  const px = m.querySelector("#pnr-xlsx"); if (px) px.onclick = pnrXlsx;
  const pf = m.querySelector("#pnr-file"); if (pf) pf.onchange = async () => {
    const f = pf.files && pf.files[0]; if (!f) return;
    if (f.size > 30 * 1048576) { pnrSay("Файл больше 30 МБ."); return; }
    const prev = await pnrLoadCached();
    pnrFile = { name: f.name, buf: await f.arrayBuffer(), at: new Date().toISOString() };
    if (await pnrCalcRun()) { try { await pnrIdb("readwrite", st => st.put(pnrFile, "calc")); } catch (e) {} }
    else pnrFile = prev;   // неподходящий файл не заменяет сохранённый
  };
  const sf = m.querySelector("#smeta-file"); if (sf) sf.onchange = () => { const f = sf.files && sf.files[0]; if (f) smetaLoad(f); };
  const su = m.querySelector("#smeta-use"); if (su) su.onchange = () => window.ZHK.setSmeta({ use: su.checked });
  const sv = m.querySelector("#smeta-vat"); if (sv) sv.onchange = () => window.ZHK.setSmeta({ vatIncl: !sv.checked });
  const pr2 = m.querySelector("#pnr-run"); if (pr2) pr2.onclick = pnrCalcRun;
  m.querySelectorAll("[data-pnrf]").forEach(b => b.onclick = () => { const [k, v] = b.dataset.pnrf.split(":"); pnrF[k] = v; route() });
  const bl = m.querySelector("#blocks-legacy"); if (bl) bl.onclick = () => {
    const p = window.ZHK.project(), k = Math.max(1, Math.min(30, parseInt(p.blocks) || 1)), fl = parseInt(p.floors) || "", fq = parseInt(p.flats) || 0;
    window.ZHK.addItems("blocks", Array.from({ length: k }, (_, i) => ({ name: "Блок " + (i + 1), kind: "res", floors: fl, flats: fq ? Math.round(fq / k) + (i === k - 1 ? fq - Math.round(fq / k) * k : 0) : "" })));
  };

  m.querySelectorAll("[data-ch-brush]").forEach(b => b.onclick = () => { chUI.brush = +b.dataset.chBrush; route() });
  const cat = m.querySelector("#ch-at"); if (cat) cat.onchange = () => { chUI.at = cat.value; route() };
  m.querySelectorAll("[data-ch-cell]").forEach(b => b.onclick = () => window.ZHK.setChess({ [b.dataset.chCell + ".st"]: chUI.brush }));
  m.querySelectorAll("[data-ch-floor]").forEach(b => b.onclick = () => {
    // Этаж и все ниже (подземные — раньше надземных), где стадия ещё не достигнута; «Очистить» — только этот этаж.
    const [bid, fs] = b.dataset.chFloor.split("."), f = +fs, B = window.ZHK.chess().blocks.find(x => x.id === bid), d = {}, k = chUI.brush;

    window.ZHK.setChess(d);
  });
  m.querySelectorAll("[data-plan-room]").forEach(b => b.onclick = () => { const id = window.ZHK.setItem("planRooms", null, { plan: b.dataset.planRoom, kind: "Жилая комната" }); const el = id && document.querySelector(`[data-item="planRooms:${id}:area"]`); if (el) el.focus(); });
  m.querySelectorAll("[data-ch-sel]").forEach(b => b.onclick = () => { chUI.sel = b.dataset.chSel; route() });
  m.querySelectorAll("[data-ch-copy]").forEach(b => b.onclick = () => {
    const src = b.dataset.chCopy, [bid, e, f] = src.split("."), B = window.ZHK.chess().blocks.find(x => x.id === bid), S0 = B && B.cells[e + "." + f], d = {};
    if (!S0) return;
    B.floors.forEach(g => { for (let e2 = 1; e2 <= B.en; e2++) { const c = B.cells[e2 + "." + g], k = bid + "." + e2 + "." + g; if (!c.flat || k === src || c.n !== S0.n) continue;
      S0.apts.forEach(a => { const kq = k + ".q" + a.q + "."; d[kq + "t"] = a.t; d[kq + "r"] = a.rSet; d[kq + "a"] = a.aSet; }); } });
    window.ZHK.setChess(d);
  });
  m.querySelectorAll("[data-ch-in]").forEach(el => el.onchange = () => {
    window.ZHK.setChess({ [el.dataset.chIn]: el.value });
    setTimeout(() => { const a = document.activeElement, sel = a && a.dataset ? a.dataset.chIn : null; route(); const nx = sel && document.querySelector(`[data-ch-in="${sel}"]`); if (nx) nx.focus(); }, 0);

  m.querySelectorAll("[data-wi-preset]").forEach(b => b.onclick = () => window.ZHK.addItems("scenarios", [WI_PRESETS[+b.dataset.wiPreset]]));
  const pr = m.querySelector("#partner-roles"); if (pr) pr.onclick = () => window.ZHK.addItems("partners", PARTNER_ROLES.map(([role, subject]) => ({ role, subject, status: "tender" })));
