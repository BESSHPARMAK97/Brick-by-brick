<style>

:root {

  --warn: #b7791f; --warn-soft: #fbf0dc;
  --bad: #c2382f;  --bad-soft: #fbe4e2;
  --info: #6a4fc4; --info-soft: #ece7fa;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;

  --ok: #4cc485; --ok-soft: #173326; --warn: #e0b052; --warn-soft: #3a2f17;

:root[data-theme="dark"] {
  --bg: #13171c; --surface: #1b2027; --surface-2: #222831; --line: #2f3742;
  --fg: #e6e9ee; --muted: #98a2ae; --accent: #6b9bff; --accent-soft: #1f2c47; --signal: #f2a24a;
  --ok: #4cc485; --ok-soft: #173326; --warn: #e0b052; --warn-soft: #3a2f17;

* { box-sizing: border-box }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px }
.grid { display: grid; gap: 14px }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)) }
.stack { display: flex; flex-direction: column; gap: 12px }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500 }

.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 20px }

.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface) }
.summary > div { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0 }
.summary > div:last-child { border-right: 0 }
.summary .dir { font-weight: 600; font-size: .9rem }
.summary .full { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin-top: 8px }
.bar i { display: block; height: 100% }
.std-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden }
.std { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100% }

.std:hover { background: var(--surface-2) }
.std .t { font-weight: 600 }

.prog { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); white-space: nowrap }
.empty { padding: 28px; text-align: center; color: var(--muted) }

/* Шторка стандарта */
.scrim { position: fixed; inset: 0; background: rgb(10 14 20 / .45); z-index: 20 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--surface); z-index: 21; overflow-y: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 22px; display: flex; flex-direction: column; gap: 18px; box-shadow: -12px 0 40px rgb(0 0 0 / .18) }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px dashed var(--line) }

.check.on span { color: var(--muted); text-decoration: line-through }
.scheme { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; overflow-x: auto }
.scheme svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto }
table { border-collapse: collapse; width: 100%; font-size: .88rem }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.tbl { overflow-x: auto }

/* Дорожная карта */
.road { display: flex; flex-direction: column; gap: 0; position: relative }
.stage { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 18px }

.dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: .8rem; font-weight: 600; background: var(--surface); border: 2px solid var(--line); color: var(--muted); position: relative; z-index: 1 }

.ev { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.ev .d { font-family: var(--f-mono); font-weight: 600 }
.ev.past { opacity: .55 }

.k-com { color: var(--warn); background: var(--warn-soft) }

@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .22s ease-out } @keyframes slide { from { transform: translateX(30px); opacity: .6 } } }
</style>

const store = {

  set(k, v) { try { localStorage.setItem("bbb:" + k, JSON.stringify(v)) } catch {} },

function pick(o) { const r = {}; KEYS.forEach(k => r[k] = o[k]); return r }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) }
function matches(s, f) {
  for (const k of KEYS) { if (f[k] && s[k] !== ALL && !s[k].includes(f[k])) return false }
  if (f.dir && s.dir !== f.dir) return false;
  if (f.status && s.status !== f.status) return false;
  return true;
}
function done(s) { return s.checks.filter((_, i) => checks[s.code + ":" + i]).length }
function chip(st) { const x = STATUS[st]; return `<span class="chip ${x.c}">${x.t}</span>` }
function relevant() { return STD.filter(s => matches(s, { ...pick(card) })) }

function viewStandards() {
  const list = STD.filter(s => matches(s, filt));
  const sel = (k, label, opts, fmt = o => o) => {
    const fromCard = KEYS.includes(k) && filt[k] && filt[k] === card[k];
    return `<label>${label}<select id="f-${k}" data-f="${k}" class="${fromCard ? "from-card" : ""}"><option value="">Все</option>${opts.map(o => `<option value="${esc(o)}"${filt[k] === o ? " selected" : ""}>${esc(fmt(o))}</option>`).join("")}</select></label>`;
  };
  const sum = DIRS.map(d => {
    const items = STD.filter(s => s.dir === d.id && matches(s, { ...filt, dir: "", status: "" }));
    const n = items.length || 1;
    const by = st => items.filter(s => s.status === st).length;
    const seg = ["done", "agreed", "changed", "new", "fail"].map(st => `<i style="width:${by(st) / n * 100}%;background:var(--${{ done: "ok", agreed: "accent", changed: "info", new: "signal", fail: "bad" }[st]})"></i>`).join("");
    return `<div><div class="row between"><span class="dir">${d.id}</span><span class="mono muted">${items.length}</span></div><div class="full" title="${d.name}">${d.name}</div><div class="bar">${items.length ? seg : ""}</div></div>`;
  }).join("");
  const rows = list.map(s => `<button class="std" data-std="${s.code}">
      <span class="code mono muted">${s.code}</span>
      <span style="min-width:0"><span class="t">${esc(s.name)}</span><span class="meta"><span class="tag">${s.dir}</span>${s.scheme ? '<span class="tag">Схема</span>' : ""}${s.nom.length ? `<span class="tag">Смета: ${s.nom.length}</span>` : ""}<span class="tag">v${s.ver}</span></span></span>
      <span class="prog num">${done(s)}/${s.checks.length}</span>${chip(s.status)}</button>`).join("");
  return head("Стандарты", "Отобраны по данным карточки проекта. Без лишних шагов: фильтр, стандарт, чек-лист.") + `
  <section class="panel stack">
    <div class="row between"><h2>Фильтры</h2><div class="row"><span class="tag auto">Синие — из карточки проекта</span><button class="btn" id="f-card">Как в карточке</button><button class="btn ghost" id="f-clear">Сбросить всё</button></div></div>
    <div class="filters">
      ${KEYS.map(k => sel(k, KEYLBL[k], OPTIONS[k])).join("")}
      ${sel("dir", "Направление", DIRS.map(d => d.id))}
      ${sel("status", "Статус", Object.keys(STATUS), o => STATUS[o].t)}
    </div>
  </section>
  <section class="stack"><div class="row between"><h2>Общий чек-лист соблюдения стандартов</h2><div class="row">${Object.keys(STATUS).map(chip).join("")}</div></div><div class="summary">${sum}</div></section>
  <section class="stack"><div class="row between"><h2>Найдено: <span class="num">${list.length}</span></h2></div>
    <div class="std-list">${rows || `<div class="empty">Под эти параметры стандартов нет. Ослабьте фильтры или нажмите «Как в карточке».</div>`}</div>
  </section>`;
}

      <rect x="30" y="30" width="460" height="180" fill="none" stroke="${sig}" stroke-width="3" stroke-dasharray="10 6"/>
      <rect x="200" y="70" width="150" height="100" fill="${acc}" opacity=".25" stroke="${acc}" stroke-width="2"/><text x="275" y="125" text-anchor="middle" font-size="13" fill="${ink}">Пятно застройки</text>
      <rect x="50" y="50" width="100" height="44" fill="var(--surface)" stroke="${ink}"/><text x="100" y="77" text-anchor="middle" font-size="12" fill="${ink}">Бытовой городок</text>
      <rect x="50" y="150" width="60" height="40" fill="var(--surface)" stroke="${ink}"/><text x="80" y="174" text-anchor="middle" font-size="11" fill="${ink}">Мойка</text>
      <line x1="30" y1="190" x2="30" y2="150" stroke="var(--bg)" stroke-width="6"/><text x="36" y="226" font-size="12" fill="${mut}">Въезд</text>
      <rect x="400" y="60" width="70" height="60" fill="none" stroke="${ink}"/><text x="435" y="95" text-anchor="middle" font-size="11" fill="${ink}">Кран</text>
    </svg>`,
  };
  return S[kind] || "";
}

function openStd(code) {
  const s = STD.find(x => x.code === code); if (!s) return;
  const layer = document.getElementById("layer");
  const render = () => {
    const n = done(s);
    layer.innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
      <div class="row between"><span class="mono muted">${s.code} · v${s.ver} · ${s.dir}</span><button class="btn" data-close id="close-std">Закрыть</button></div>
      <div class="stack" style="gap:8px"><h2>${esc(s.name)}</h2><div class="row">${chip(s.status)}${[...new Set([].concat(s.stage === ALL ? ["Все этапы"] : s.stage, s.work === ALL ? [] : s.work))].map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
      ${s.scheme ? `<section class="stack" style="gap:8px"><span class="label">Схема (векторная графика)</span><div class="scheme">${scheme(s.scheme)}</div></section>` : ""}
      <section class="stack" style="gap:4px"><div class="row between"><span class="label">Чек-лист выполнения</span><span class="mono num">${n}/${s.checks.length}</span></div>
        <div class="bar"><i style="width:${n / s.checks.length * 100}%;background:var(--ok)"></i></div>
        <div>${s.checks.map((c, i) => { const id = s.code + ":" + i; return `<label class="check${checks[id] ? " on" : ""}"><input type="checkbox" id="chk-${i}" data-chk="${id}"${checks[id] ? " checked" : ""}><span>${esc(c)}</span></label>` }).join("")}</div>
      </section>
      ${s.nom.length ? `<section class="stack" style="gap:8px"><span class="label">Сметная номенклатура СМР и ТМЦ</span><div class="tbl"><table><thead><tr><th>Тип</th><th>Код</th><th>Наименование</th><th>Ед.</th></tr></thead><tbody>${s.nom.map(r => `<tr><td><span class="tag">${r[0]}</span></td><td class="mono">${r[1]}</td><td>${esc(r[2])}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
      <div class="row"><button class="btn primary" id="agree">Согласовать</button><button class="btn" id="propose">Предложить изменение</button></div>
      <div id="std-msg" class="muted" aria-live="polite"></div>
    </aside>`;
    layer.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
    layer.querySelectorAll("[data-chk]").forEach(b => b.onchange = () => { checks[b.dataset.chk] = b.checked; store.set("checks", checks); if (done(s) === s.checks.length && s.status !== "done") s.status = "done"; render(); });
    layer.querySelector("#agree").onclick = () => { s.status = "agreed"; render(); layer.querySelector("#std-msg").textContent = "Стандарт согласован (в прототипе — до перезагрузки)." };
    layer.querySelector("#propose").onclick = () => { s.status = "changed"; render(); layer.querySelector("#std-msg").textContent = "Изменение отправлено владельцу стандарта, статус «Изменён»." };
  };
  const close = () => { layer.innerHTML = ""; route() };
  render();
  document.getElementById("close-std").focus();
}

function viewRoad() {
  return head("Дорожная карта проекта", "От начала анализа рынка до полного завершения проекта.") + `<section class="panel"><div class="road">${ROAD.map((st, i) => `
    <div class="stage ${st.s}"><div class="dot">${st.s === "done" ? "✓" : i + 1}</div>
      <button class="stage-card" aria-expanded="${st.s === "now"}" data-stage="${i}">
        <div class="row between"><h3>${esc(st.n)}</h3><span class="row"><span class="mono muted">${st.d}</span>${st.s === "now" ? '<span class="chip s-agreed">Сейчас</span>' : ""}</span></div>
        <div class="more">${st.note ? `<div class="q">${esc(st.note)}</div>` : ""}${st.items ? `<div class="sub">${st.items.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : ""}${st.q ? `<div class="q"><b>Ответы на выходе:</b> ${esc(st.q)}</div>` : ""}${st.std ? `<div class="q"><a href="#standards" data-go-stage="${st.n === "Старт СМР" ? "Начало СМР" : "СМР: каркас"}">Стандарты этого этапа →</a></div>` : ""}</div>
      </button></div>`).join("")}</div></section>`;
}

function viewCal() {
  const months = {};
  EVENTS.filter(e => evKinds.has(e[1])).forEach(e => { const d = new Date(e[0]); const k = d.toLocaleDateString("ru-RU", { month: "long", year: "numeric" }); (months[k] ||= []).push([d, ...e.slice(1)]) });
  const same = (a, b) => a.toDateString() === b.toDateString();
  return head("Календарь событий", "ГПР ключевых работ, тендеры, комиссии, передача ключей и праздники РК.") + `
  <div class="row">${Object.entries(KIND).map(([k, [t, c]]) => `<button class="typebtn ${c}" aria-pressed="${evKinds.has(k)}" data-kind="${k}">${t}</button>`).join("")}</div>
  ${Object.entries(months).map(([m, evs]) => `<section class="month"><span class="label">${m}</span>${evs.map(([d, k, t]) => `<div class="ev${d < TODAY && !same(d, TODAY) ? " past" : ""}${same(d, TODAY) ? " today" : ""}"><span class="d num">${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}</span><span>${esc(t)}${same(d, TODAY) ? ' <span class="muted">· сегодня</span>' : ""}</span><span class="chip ${KIND[k][1]}">${KIND[k][0]}</span></div>`).join("")}</section>`).join("") || '<div class="empty">Выберите хотя бы один тип событий.</div>'}`;
}

function viewTeam() {
  return head("Команда проекта", "Роли и зоны ответственности. Пустые роли уходят заявкой в HR.") + `<div class="grid g3">${TEAM.map(([role, who, zone]) => `
    <div class="panel person"><div class="ava${who ? "" : " vac"}">${who ? who.split(" ").map(w => w[0]).join("").replace(".", "") : "?"}</div>
    <div class="stack" style="gap:2px;min-width:0"><span class="label">${role}</span><b>${who || "Не назначен"}</b><span class="muted" style="font-size:.88rem">${zone}</span>${who ? "" : '<button class="btn" style="margin-top:6px;align-self:flex-start" data-hr>Заявка в HR</button>'}</div></div>`).join("")}</div>
    <div id="hr-msg" class="muted" aria-live="polite"></div>`;
}

function viewKpi() {
  const K = [
    ["Качество", "12", "открытых замечаний технадзора", "−5 за неделю", "up"],
    ["Безопасность", "86", "дней без инцидентов", "1 нарушение СТ-БиОТ-003", "down"],
    ["Сроки", "+6 дн.", "отклонение от ГПР", "котлован, подъезд 2", "down"],
    ["Финансы", "2,4 млрд ₸", "освоено из 18,6 млрд ₸", "13% бюджета", "up"],
    ["Опер. факт", "640 м³", "бетона за неделю, план 700", "91% плана", "down"],
  ];
  const floors = 12, per = 18;
  let h = `<div class="chess" style="grid-template-columns:34px repeat(${per}, minmax(0,1fr))">`;
  let sold = 0, res = 0;
  for (let f = floors; f >= 1; f--) {
    h += `<div class="fl">${f}</div>`;
    for (let a = 1; a <= per; a++) {
      const v = (f * 7 + a * 13 + (f > 8 ? 5 : 0)) % 10;
      const st = v < 4 ? "sold" : v < 5 ? "res" : "free";
      if (st === "sold") sold++; if (st === "res") res++;
      h += `<button class="cell c-${st}" title="Этаж ${f}, кв. ${(f - 1) * per + a}: ${{ sold: "продано", res: "бронь", free: "свободно" }[st]}">${(f - 1) * per + a}</button>`;
    }
  }
  h += "</div>";
  const total = floors * per;
  return head("Показатели проекта", "Качество, безопасность, сроки, финансы и оперативный факт.") + `
  <div class="grid g5">${K.map(([l, v, d, dl, dir]) => `<div class="panel kpi"><span class="label">${l}</span><div class="big num">${v}</div><div class="muted" style="font-size:.85rem">${d}</div><div class="delta ${dir}">${dl}</div></div>`).join("")}</div>
  <section class="panel stack"><div class="row between"><h2>Поэтажная шахматка</h2><div class="legend"><span><i class="c-sold"></i>Продано <b class="num">${sold}</b></span><span><i class="c-res"></i>Бронь <b class="num">${res}</b></span><span><i class="c-free"></i>Свободно <b class="num">${total - sold - res}</b></span></div></div>
  <div class="chess-wrap">${h}</div><div class="muted" style="font-size:.85rem">Продано ${Math.round(sold / total * 100)}% квартир. Наведите на ячейку, чтобы увидеть номер и статус.</div></section>`;
}

function viewPartners() {
  return head("Партнёры", "Подрядчики, поставщики и финансовые партнёры проекта.") + `<div class="panel tbl"><table><thead><tr><th>Роль</th><th>Организация</th><th>Предмет</th><th>Статус</th></tr></thead><tbody>${PARTNERS.map(([r, o, p, s]) => `<tr><td><b>${r}</b></td><td>${esc(o)}</td><td class="muted">${esc(p)}</td><td>${s === "ok" ? '<span class="chip s-done">Договор</span>' : '<span class="chip s-new">Тендер</span>'}</td></tr>`).join("")}</tbody></table></div>`;
}

// ---------- Маршрутизация и события ----------
function route() {
  let v = location.hash.slice(1); if (!VIEWS[v]) v = "card";
  document.getElementById("nav").innerHTML = Object.entries(VIEWS).map(([k, x]) => `<a href="#${k}"${k === v ? ' aria-current="page"' : ""}><span>${x.t}</span>${x.cnt() !== "" ? `<span class="cnt">${x.cnt()}</span>` : ""}</a>`).join("");
  const main = document.getElementById("main");
  main.innerHTML = VIEWS[v].r();
  bind(main);
}

function bind(m) {
  m.querySelectorAll("[data-k]").forEach(s => s.onchange = () => { card[s.dataset.k] = s.value; store.set("card", pick(card)); filt = { ...filt, ...pick(card) }; route() });
  m.querySelectorAll("[data-f]").forEach(s => s.onchange = () => { filt[s.dataset.f] = s.value; route() });
  const fc = m.querySelector("#f-card"); if (fc) fc.onclick = () => { filt = { ...pick(card), dir: "", status: "" }; route() };
  const fx = m.querySelector("#f-clear"); if (fx) fx.onclick = () => { filt = { region: "", city: "", klass: "", stage: "", work: "", construct: "", dir: "", status: "" }; route() };
  const rc = m.querySelector("#reset-card"); if (rc) rc.onclick = () => { store.set("card", {}); Object.assign(card, { region: "C2 North", city: "Астана", klass: "Бизнес", stage: "Начало СМР", work: "Железобетонный каркас", construct: "Каркас здания" }); filt = { ...pick(card), dir: "", status: "" }; route() };
  m.querySelectorAll("[data-std]").forEach(b => b.onclick = () => openStd(b.dataset.std));
  m.querySelectorAll("[data-stage]").forEach(b => b.onclick = e => { if (e.target.closest("a")) return; b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") !== "true") });
  m.querySelectorAll("[data-go-stage]").forEach(a => a.onclick = () => { filt = { ...pick(card), stage: a.dataset.goStage, dir: "", status: "" } });
  m.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { const k = b.dataset.kind; evKinds.has(k) ? evKinds.delete(k) : evKinds.add(k); route() });
  m.querySelectorAll("[data-hr]").forEach(b => b.onclick = () => { b.disabled = true; b.textContent = "Заявка отправлена"; m.querySelector("#hr-msg").textContent = "Заявка на роль «Специалист БиОТ» передана в HR (в прототипе — без отправки)." });
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("layer").innerHTML) { document.getElementById("layer").innerHTML = ""; route() } });
addEventListener("hashchange", () => { document.getElementById("layer").innerHTML = ""; route(); scrollTo(0, 0) });
route();
</script>
