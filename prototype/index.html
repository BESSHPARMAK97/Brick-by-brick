<title>Brick by brick</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: project card on top → block tabs → floor-by-floor chessboard; unit opens in a side drawer with editable works */
:root {
  --bg: #eef0f2;
  --surface: #ffffff;
  --fg: #1c2127;
  --muted: #66707b;
  --line: #d7dbe0;
  --cell: #e3e6ea;
  --accent: #b4472b;
  --warn-bg: #fbeee9;
  --s0: #c9ced5; --s1: #e6a23c; --s2: #3c8dbc; --s3: #2f9e5b; --s4: #d6336c;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181c; --surface: #1d2126; --fg: #e7eaee; --muted: #98a2ad; --line: #30363d; --cell: #2a2f36; --warn-bg: #3a2620;
  --accent: #e0714f; --s0: #4a525c; --s1: #e0a23f; --s2: #4ba3d6; --s3: #43b873; --s4: #ec5a8a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15181c; --surface: #1d2126; --fg: #e7eaee; --muted: #98a2ad; --line: #30363d; --cell: #2a2f36; --warn-bg: #3a2620;
  --accent: #e0714f; --s0: #4a525c; --s1: #e0a23f; --s2: #4ba3d6; --s3: #43b873; --s4: #ec5a8a; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 15px; }
.logo-mark { display: grid; grid-template-columns: repeat(3, 9px); gap: 2px; }
.logo-mark i { height: 6px; background: var(--accent); border-radius: 1px; }
.logo-mark i:nth-child(4), .logo-mark i:nth-child(5) { transform: translateX(5px); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

.project { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px;
  display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }
.project h1 { font-size: clamp(22px, 3.2vw, 30px); }
.project .sub { color: var(--muted); margin-top: 4px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; margin-top: 18px; }
.facts div { display: grid; gap: 2px; min-width: 0; }
.facts b { font-weight: 500; }
.prog-big { display: grid; gap: 10px; align-content: start; }
.prog-big .pct { font-family: var(--display); font-size: 40px; line-height: 1; }
.bar { height: 8px; border-radius: 4px; background: var(--cell); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.count { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }

.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 8px 14px; display: grid; gap: 2px; text-align: left; min-width: 120px; }
.tab small { color: var(--muted); font-size: 12px; }
.tab[aria-selected="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
:is(.tab, .cell, .btn, select, input, .wrow, .floor-label):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { display: grid; gap: 4px; }
select, input { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0; }
input[type="number"] { font-family: var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }

.board-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.board-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.board-head h2 { font-size: 18px; }
.board-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.board-scroll { overflow-x: auto; padding: 2px 2px 4px; }
.board { display: grid; gap: 4px; min-width: max-content; }
.floor { display: grid; grid-template-columns: 54px auto; gap: 8px; align-items: stretch; }
.floor-label { font: inherit; color: var(--fg); background: none; border: 0; border-right: 2px solid var(--line);
  display: grid; align-content: center; justify-items: end; padding: 0 6px 0 0; }
.mass .floor-label { cursor: pointer; }
.floor-label .num { font-size: 15px; font-weight: 500; }
.floor-label small { font-size: 10px; color: var(--muted); }
.units { display: flex; gap: 4px; }
.cell { font: inherit; color: var(--fg); cursor: pointer; width: 78px; min-height: 56px; border-radius: 6px;
  border: 1px solid transparent; background: var(--cell); padding: 6px 7px; display: grid; align-content: space-between;
  text-align: left; position: relative; transition: transform .12s ease; }
.cell:hover { transform: translateY(-1px); border-color: var(--fg); }
.cell .n { font-family: var(--mono); font-weight: 500; font-size: 13px; }
.cell .t { font-size: 11px; color: var(--muted); }
.cell .p { font-family: var(--mono); font-size: 11px; }
.cell.k { width: 118px; border-style: dashed; border-color: var(--line); }
.cell.tech { width: 104px; border-style: dashed; border-color: var(--line); }
.cell.mop { width: 64px; border-style: dashed; border-color: var(--line); }
.cell.dim { opacity: .35; }
.cell.sel { outline: 3px solid var(--fg); outline-offset: 1px; }
.cell .flag { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--s4); }
.cell.on-dark .t, .cell.on-dark .n, .cell.on-dark .p { color: #fff; }

.btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 7px 12px; }
.btn:hover:not(:disabled) { border-color: var(--fg); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.btn.ok { background: var(--s3); color: #fff; border-color: var(--s3); }
.btn.bad { color: var(--s4); border-color: var(--s4); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }

/* drawer + modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 15, .4); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); z-index: 21; background: var(--surface);
  border-left: 1px solid var(--line); overflow-y: auto; display: grid; align-content: start; gap: 18px;
  padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.modal { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100% - 24px));
  max-height: calc(100% - 48px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 16px; }
.d-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.drawer h2, .modal h2 { font-size: 22px; margin-top: 4px; }
.crumbs { font-size: 13px; color: var(--muted); }
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.specs div { display: grid; gap: 2px; }
.specs b { font-weight: 500; }
.nav-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }

.wlist { display: grid; border-top: 1px solid var(--line); }
.witem { border-bottom: 1px solid var(--line); }
.wrow { font: inherit; color: var(--fg); background: none; border: 0; width: 100%; cursor: pointer; text-align: left;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 4px; align-items: center; }
.wrow:hover { background: var(--bg); }
.wrow small { color: var(--muted); font-size: 11px; display: block; }
.wrow .right { display: grid; justify-items: end; gap: 3px; }
.mini { width: 90px; height: 4px; border-radius: 2px; background: var(--cell); overflow: hidden; }
.mini span { display: block; height: 100%; background: var(--fg); }
.editor { background: var(--bg); border-radius: 8px; padding: 14px; margin: 0 0 12px; display: grid; gap: 14px; }
.ed-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.ed-grid > div { display: grid; gap: 6px; align-content: start; }
.inline { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.inline input[type="number"] { width: 110px; }
.form { display: grid; grid-template-columns: 120px 150px minmax(0, 1fr); gap: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--warn-bg); }
.hist { display: grid; gap: 6px; font-size: 12px; margin: 0; padding: 0; list-style: none; }
.hist li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; }
.hist .d { color: var(--muted); font-family: var(--mono); }

.tpl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tpl th, .tpl td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); text-align: left; }
.tpl th { font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tpl input { width: 84px; padding: 5px 8px; }
.scroll-x { overflow-x: auto; }

.bulkbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bulkbar-in { max-width: 1240px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .project { grid-template-columns: 1fr; }
  .drawer { border-left: 0; }
  .form { grid-template-columns: 1fr 1fr; }
  .form input[name="note"] { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { .cell { transition: none; } .cell:hover { transform: none; } }
</style>

  <section class="project" aria-label="Карточка проекта">

<script>
// ---------- справочники ----------
const STATUS = [
  { name: "Не начато", color: "var(--s0)" },
  { name: "В работе", color: "var(--s1)" },
  { name: "Выполнено, ждёт приёмки", color: "var(--s2)" },
  { name: "Принято технадзором", color: "var(--s3)" },
  { name: "Замечания", color: "var(--s4)" },
];
const ROLES = { pto: "Инженер ПТО", foreman: "Прораб", tn: "Технадзор", boss: "Руководитель" };
const ROLE_HINT = {
  pto: "ПТО задаёт плановые объёмы: один раз на планировку или вручную для конкретного помещения.",
  foreman: "Прораб вносит факт выполнения, частично или полностью, по одному помещению или сразу по нескольким.",
  tn: "Технадзор принимает выполненные работы или выставляет замечания.",
  boss: "Руководитель видит всё, но ничего не меняет.",
};
const WORKS = {
  apt: [
    ["Кладка перегородок", "АР", "м²"], ["Установка окон ПВХ", "АР", "шт."], ["Стояки ВК", "ВК", "п.м."],
    ["Электромонтаж: разводка", "ЭОМ", "п.м."], ["Радиаторы отопления", "ОВ", "шт."], ["Штукатурка стен", "Отделка", "м²"],
    ["Стяжка пола", "Отделка", "м²"], ["Входная дверь", "АР", "шт."], ["Шпаклёвка стен", "Отделка", "м²"], ["Установка счётчиков", "ВК", "шт."],
  ],
  k: [["Витражное остекление", "АР", "м²"], ["Электромонтаж: разводка", "ЭОМ", "п.м."], ["Вентиляция", "ОВ", "п.м."], ["Стяжка пола", "Отделка", "м²"], ["Штукатурка стен", "Отделка", "м²"]],
  mop: [["Штукатурка стен", "Отделка", "м²"], ["Плитка пола", "Отделка", "м²"], ["Освещение МОП", "ЭОМ", "шт."], ["Окраска стен", "Отделка", "м²"]],
  tech: [["Гидроизоляция пола", "АР", "м²"], ["Электромонтаж: разводка", "ЭОМ", "п.м."], ["Вентиляция", "ОВ", "п.м."], ["Окраска стен", "Отделка", "м²"]],
};
// плановые объёмы по типу квартиры — вносятся один раз, применяются ко всем квартирам этого типа
const TEMPLATE = {
  1: { "Кладка перегородок": 22, "Установка окон ПВХ": 2, "Стояки ВК": 6, "Электромонтаж: разводка": 90, "Радиаторы отопления": 2, "Штукатурка стен": 95, "Стяжка пола": 40, "Входная дверь": 1, "Шпаклёвка стен": 95, "Установка счётчиков": 2 },
  2: { "Кладка перегородок": 34, "Установка окон ПВХ": 3, "Стояки ВК": 6, "Электромонтаж: разводка": 140, "Радиаторы отопления": 3, "Штукатурка стен": 150, "Стяжка пола": 61, "Входная дверь": 1, "Шпаклёвка стен": 150, "Установка счётчиков": 2 },
  3: { "Кладка перегородок": 48, "Установка окон ПВХ": 4, "Стояки ВК": 9, "Электромонтаж: разводка": 190, "Радиаторы отопления": 4, "Штукатурка стен": 205, "Стяжка пола": 85, "Входная дверь": 1, "Шпаклёвка стен": 205, "Установка счётчиков": 2 },
};
const CREWS = { "АР": "Бригада №1 (общестрой)", "ВК": "Субподрядчик: ВК", "ЭОМ": "Субподрядчик: электрика", "ОВ": "Субподрядчик: ОВ", "Отделка": "Бригада №3 (отделка)" };
const ALL_WORK_NAMES = [...new Set(Object.values(WORKS).flat().map(w => w[0]))];

// ---------- даты ----------
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
const isoToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isoToRu = s => s.split("-").reverse().join(".");

// ---------- генерация примера ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PROJECT = {
  name: "ЖК «Кереге»",
  address: "г. Астана, район Есиль · пример объекта",
  facts: [["Застройщик", "ТОО «Пример Девелопмент»"], ["Генподрядчик", "ТОО «Пример Строй»"], ["Класс жилья", "Комфорт"],
          ["Отделка", "Предчистовая"], ["Ввод в эксплуатацию", "IV кв. 2027"]],
  blocks: [],
};
const BLOCK_CFG = [
  { name: "Блок A", floors: 12, perFloor: [1, 1, 2, 2, 3], stage: 9.5 },
  { name: "Блок B", floors: 9, perFloor: [1, 2, 2, 3], stage: 7 },
  { name: "Блок C", floors: 12, perFloor: [1, 1, 2, 3, 3, 2], stage: 3.5 },
];
const AREA = { 1: [38, 44], 2: [56, 66], 3: [78, 92] };
const baseQty = (name, unit, area) => unit === "шт." ? Math.max(1, Math.round(area / 25)) : unit === "п.м." ? Math.round(area * 1.6) : /пол/i.test(name) ? Math.round(area) : Math.round(area * 2.4);

function genEntries(w, qty, mon) {
  const day = () => 1 + Math.floor(rnd() * 27);
  if (w.unit === "шт." || qty < 20) { w.entries.push({ type: "fact", qty, date: `${pad(day())}.${pad(mon)}.2026`, who: ROLES.foreman }); return; }
  const first = Math.round(qty * (.4 + rnd() * .3));
  w.entries.push({ type: "fact", qty: first, date: `${pad(day())}.${pad(mon)}.2026`, who: ROLES.foreman });
  w.entries.push({ type: "fact", qty: qty - first, date: `${pad(day())}.${pad(Math.min(mon + 1, 10))}.2026`, who: ROLES.foreman });
}
function makeWorks(kind, floorNo, floors, stage, area, rooms) {
  const s = stage - (Math.max(floorNo, 1) - 1) * (stage / floors) * 0.9 + (rnd() - .5) * 1.2;
  return WORKS[kind].map(([name, section, unit], i) => {
    let st = i < s - 1.5 ? 3 : i < s - .5 ? 2 : i < s + .4 ? 1 : 0;
    if (st >= 2 && rnd() < .07) st = 4;
    const plan = kind === "apt" ? TEMPLATE[rooms][name] : baseQty(name, unit, area);
    const w = { name, section, unit, plan, crew: CREWS[section], status: st, entries: [], override: false };
    const mon = 3 + Math.min(6, Math.floor(i * .7 + floorNo * .3));
    if (st === 1) genEntries(w, Math.max(unit === "шт." ? 0 : 1, Math.round(plan * (.2 + rnd() * .6))), mon);
    if (st === 1 && fact(w) === 0) w.status = 0;
    if (st >= 2) genEntries(w, plan, mon);
    if (st === 3) w.entries.push({ type: "status", to: 3, date: `${pad(5 + Math.floor(rnd() * 20))}.${pad(Math.min(mon + 1, 10))}.2026`, who: ROLES.tn });

// ---------- логика объёмов и статусов ----------
function fact(w) { return w.entries.reduce((s, e) => s + (e.type === "fact" ? e.qty : 0), 0); }
function rest(w) { return Math.max(0, +(w.plan - fact(w)).toFixed(2)); }
// статусы 0–2 вычисляются из факта; «принято» и «замечание» ставит только технадзор
function autoStatus(w) {
  const f = fact(w);
  if (w.status === 3 && f >= w.plan) return;
  if (w.status === 4) return;
  w.status = f <= 0 ? 0 : f < w.plan ? 1 : 2;
}
function addFact(w, qty, date, note) {
  w.entries.push({ type: "fact", qty, date, who: ROLES[role], note });
  autoStatus(w);
}
function setStatus(w, to, note) {
  w.entries.push({ type: "status", to, date: fmt(new Date()), who: ROLES[role], note });
  w.status = to;
  if (to === 2) autoStatus(w);
}
function setPlan(w, plan, manual) {
  const old = w.plan;
  if (old === plan) return false;
  w.plan = plan;
  if (manual) w.override = true;
  w.entries.push({ type: "plan", from: old, to: plan, date: fmt(new Date()), who: ROLES[role], note: manual ? "вручную" : "по шаблону планировки" });
  if (w.status === 3 && fact(w) < plan) w.status = 1;

}

const unitType = u => ({ apt: `${u.rooms}-комн. квартира`, k: "Коммерческое", mop: "Места общего пользования", tech: "Техническое" })[u.kind];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

      <thead><tr><th>Работа</th><th>Ед.</th><th>1-комн.</th><th>2-комн.</th><th>3-комн.</th></tr></thead>
      <tbody>${works.map(([n, , unit], i) => `<tr><td>${n}</td><td>${unit}</td>${[1, 2, 3].map(r =>
        `<td>${edit ? `<input type="number" min="0" step="any" id="tpl-${r}-${i}" value="${TEMPLATE[r][n]}" aria-label="${n}, ${r}-комн.">` : `<span class="num">${TEMPLATE[r][n]}</span>`}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>
    <div class="actions">${edit ? `<button class="btn primary" data-m="apply">Сохранить и применить ко всем квартирам</button>` : ""}<button class="btn" data-m="close">Закрыть</button></div>`;
}
$("tpl-open").addEventListener("click", () => { renderModal(); $("modal").hidden = false; $("scrim").hidden = false; $("modal").querySelector("[data-m]").focus(); });
$("modal").addEventListener("click", e => {
  const a = e.target.closest("[data-m]")?.dataset.m; if (!a) return;
  if (a === "close") return closeAll();
  WORKS.apt.forEach(([n], i) => [1, 2, 3].forEach(r => { const v = parseFloat($(`tpl-${r}-${i}`).value); if (v > 0) TEMPLATE[r][n] = v; }));
  let changed = 0, kept = 0;
  PROJECT.blocks.flatMap(blockUnits).filter(u => u.kind === "apt").forEach(u => u.works.forEach(w => {
    if (w.override) { kept++; return; }
    if (setPlan(w, TEMPLATE[u.rooms][w.name], false)) changed++;
  }));
  closeAll(); renderAll();
  toast(`Шаблон применён. Изменено работ: ${changed}${kept ? `; с ручным планом, не тронуто: ${kept}` : ""}`);
});

// ---------- прочее ----------
let toastTimer;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3200); }

$("role").innerHTML = Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === role ? "selected" : ""}>${v}</option>`).join("");
$("role").addEventListener("change", e => { role = e.target.value; edMsg = ""; if (!$("modal").hidden) renderModal(); renderAll(); });
$("colorby").innerHTML = `<option value="progress">По общей готовности</option><optgroup label="По виду работы">` +
  ALL_WORK_NAMES.map(n => `<option value="${n}">${n}</option>`).join("") + "</optgroup>";
$("colorby").addEventListener("change", e => { colorBy = e.target.value; if (colorBy !== "progress") bulkWork = colorBy; renderLegend(); renderBoard(); renderBulk(); });
$("tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (!t) return; current = +t.dataset.i; selected.clear(); renderAll(); });
$("mass-toggle").addEventListener("click", () => setMass(!mass));
$("board").addEventListener("click", e => {
  const fl = e.target.closest(".floor-label");
  if (fl && mass) {
    const fn = +fl.dataset.floor, f = PROJECT.blocks[current].floors.find(x => x.no === fn);
    const keys = f.units.map((_, i) => `${fn}:${i}`), all = keys.every(k => selected.has(k));
    keys.forEach(k => all ? selected.delete(k) : selected.add(k));
    renderBoard(); renderBulk(); return;
  }
  const c = e.target.closest(".cell"); if (!c) return;
  if (mass) { const k = `${c.dataset.f}:${c.dataset.u}`; selected.has(k) ? selected.delete(k) : selected.add(k); renderBoard(); renderBulk(); }
  else openDrawer(+c.dataset.f, +c.dataset.u);
});
$("scrim").addEventListener("click", closeAll);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden) closeAll(); });

renderAll();
</script>
