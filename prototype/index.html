<style>
/* Layout: one quiet column — project summary, block switch, chessboard; unit opens as a side sheet (bottom sheet on phones) */
:root {
  --bg: #ffffff;
  --fg: #17181a;
  --muted: #74777d;
  --line: #ececee;
  --soft: #f5f5f6;
  --cell: #efeff1;
  --brick: #c4542f;
  --s0: #d9dadd; --s1: #f2b33d; --s2: #4a7fd6; --s3: #2f9e6b; --s4: #e5484d;
  --bad-bg: #fdeeee;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121314; --fg: #ececed; --muted: #94979d; --line: #26282b; --soft: #1b1c1e; --cell: #232528;
  --brick: #e27450; --s0: #3a3d42; --s1: #e9ab3a; --s2: #5b8fe3; --s3: #3bb07b; --s4: #f06267; --bad-bg: #3a2022; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121314; --fg: #ececed; --muted: #94979d; --line: #26282b; --soft: #1b1c1e; --cell: #232528;
  --brick: #e27450; --s0: #3a3d42; --s1: #e9ab3a; --s2: #5b8fe3; --s3: #3bb07b; --s4: #f06267; --bad-bg: #3a2022; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
button, select, input { font: inherit; color: inherit; }
:is(button, select, input, summary, label.btn):focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1120px; margin: 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.mark { display: grid; grid-template-columns: 8px 8px; gap: 2px; }
.mark i { width: 8px; height: 5px; background: var(--brick); border-radius: 1px; }
.mark i:nth-child(3) { grid-column: 1 / span 2; width: 18px; }
.role { position: relative; }
.role select { appearance: none; border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 30px 6px 14px; font-size: 14px; cursor: pointer; }
.role::after { content: ""; position: absolute; right: 13px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }

.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 120px; display: grid; gap: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* summary */
.summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 32px; align-items: end; }
.summary h1 { font-size: clamp(24px, 4vw, 32px); }
.big { display: grid; gap: 8px; justify-items: end; min-width: 220px; }
.pct { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
.track { height: 4px; width: 100%; border-radius: 2px; background: var(--cell); overflow: hidden; display: flex; }
.track span { display: block; height: 100%; background: var(--s3); }
.stats { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.stat b { font-weight: 600; }
.stat:hover { border-color: var(--muted); }
.stat.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.facts { grid-column: 1 / -1; font-size: 14px; }
.facts summary { cursor: pointer; color: var(--muted); width: max-content; list-style: none; }
.facts summary::-webkit-details-marker { display: none; }
.facts summary::after { content: " ↓"; }
.facts[open] summary::after { content: " ↑"; }
.facts dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 24px; margin: 14px 0 0; }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { margin: 2px 0 0; }

/* toolbar */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 8px; align-items: baseline; }
.seg button small { color: var(--muted); font-size: 12px; }
.seg button[aria-selected="true"] { background: var(--bg); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); font-weight: 500; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select.plain { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; font-size: 14px; max-width: 100%; }

.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.danger { background: var(--s4); color: #fff; border-color: var(--s4); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.link { border: 0; background: none; padding: 0; cursor: pointer; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.link:hover { text-decoration-color: currentColor; }
.link.danger { color: var(--s4); }
.icon { width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--muted); }
.icon:hover:not(:disabled) { background: var(--soft); color: var(--fg); }
.icon:disabled { opacity: .3; cursor: default; }

/* chessboard */
.board-wrap { display: grid; gap: 16px; min-width: 0; }
.board-scroll { overflow-x: auto; padding: 4px 2px; }
.board { display: grid; gap: 4px; min-width: max-content; }
.floor { display: grid; grid-template-columns: 36px auto; gap: 8px; align-items: center; }
.floor-no { border: 0; background: none; font-size: 13px; color: var(--muted); text-align: right; padding: 0 4px 0 0; height: 100%; }
.mass .floor-no { cursor: pointer; color: var(--fg); }
.units { display: flex; gap: 4px; }
.cell { position: relative; min-width: 58px; height: 46px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--cell); cursor: pointer;
  display: grid; align-content: center; justify-items: start; gap: 0; text-align: left; transition: transform .12s ease, box-shadow .12s ease; }
.cell:hover { box-shadow: inset 0 0 0 1.5px var(--fg); }
.cell .n { font-weight: 600; font-size: 14px; line-height: 1.1; }
.cell .p { font-size: 11px; opacity: .7; }
.cell.alt { background: transparent !important; box-shadow: inset 0 0 0 1px var(--line); }
.cell.alt.hit { box-shadow: inset 0 0 0 2px var(--hit); }
.cell.dim { opacity: .3; }
.cell.dark { color: #fff; }
.cell.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.cell .flag { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--s4); box-shadow: 0 0 0 1.5px var(--bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .28); z-index: 20; }
.sheet { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); overflow-y: auto;
  box-shadow: -12px 0 40px rgba(0, 0, 0, .12); display: grid; align-content: start; gap: 20px;
  padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.sheet-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.sheet-head h2 { font-size: 24px; }
.icon-row { display: flex; margin-right: -8px; }
.sheet-progress { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.sheet-progress b { font-weight: 600; font-size: 15px; }
.works { list-style: none; margin: 0 -8px; padding: 0; display: grid; }
.work-row { width: 100%; border: 0; background: none; cursor: pointer; display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 8px; border-radius: 8px; text-align: left; }
.work-row:hover { background: var(--soft); }
.work.open .work-row { background: var(--soft); border-radius: 8px 8px 0 0; }
.work-qty { color: var(--muted); font-size: 13px; white-space: nowrap; }
.editor { background: var(--soft); border-radius: 0 0 8px 8px; padding: 4px 8px 16px 28px; display: grid; gap: 14px; margin-bottom: 6px; }
.nums { display: flex; gap: 24px; margin: 0; }
.nums dt { font-size: 12px; color: var(--muted); }
.nums dd { margin: 0; font-weight: 600; }
.field-row { display: flex; gap: 8px; }
.qty { flex: 1; display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding-right: 12px; min-width: 0; }
.qty input { flex: 1; border: 0; background: none; padding: 9px 12px; min-width: 0; font-size: 16px; }
.qty input:focus-visible { outline: none; }
.qty:focus-within { border-color: var(--fg); }
.qty span { color: var(--muted); font-size: 14px; }
.text { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; font-size: 15px; }
.text:focus-visible { outline: none; border-color: var(--fg); }
.row { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
.more { display: grid; gap: 8px; }
.more input[type="date"] { width: 100%; }
.banner { border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; font-size: 14px; }
.banner.bad { background: var(--bad-bg); }
.banner b { color: var(--s4); font-weight: 600; }
.err { font-size: 14px; color: var(--s4); }
.hist-wrap summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style: none; width: max-content; }
.hist-wrap summary::-webkit-details-marker { display: none; }
.hist-wrap summary::after { content: " ↓"; }
.hist-wrap[open] summary::after { content: " ↑"; }
.hist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.hist li { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; }
.hist .d { color: var(--muted); }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.thumb { width: 52px; height: 52px; padding: 0; border: 0; border-radius: 6px; overflow: hidden; cursor: zoom-in; background: var(--cell); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* modal, bulk, toast, lightbox */
.modal { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 24px)); max-height: calc(100% - 48px);
  overflow-y: auto; background: var(--bg); border-radius: 14px; padding: 24px; display: grid; gap: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .2); }
.scroll-x { overflow-x: auto; }
.tpl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tpl th, .tpl td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tpl th { font-weight: 500; color: var(--muted); font-size: 13px; }
.tpl input { width: 76px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--bg); }
.bulk { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  width: min(720px, calc(100% - 24px)); background: var(--fg); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 18px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
.bulk select { border: 0; border-radius: 8px; padding: 7px 10px; background: var(--bg); color: var(--fg); flex: 1; min-width: 160px; }
.bulk .btn { background: var(--bg); color: var(--fg); border-color: var(--bg); }
.bulk .icon { color: var(--bg); }
.bulk .icon:hover { background: rgba(255, 255, 255, .12); color: var(--bg); }
.bulk .hint { font-size: 13px; opacity: .7; }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0, 0, 0, .2); }
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .88); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

@media (max-width: 640px) {
  .summary { grid-template-columns: 1fr; }
  .big { justify-items: start; min-width: 0; }
  .sheet { top: auto; left: 0; width: 100%; height: 92%; border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .15); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .editor { padding-left: 8px; }
}
@media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
</style>

<header class="top"><div class="top-in">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Brick by brick</div>
  <label class="role"><span class="sr">Роль</span><select id="role"></select></label>
</div></header>

<main class="wrap">
  <section class="summary" aria-label="Проект">
    <div>
      <h1 id="p-name"></h1>
      <p class="muted" id="p-sub"></p>
    </div>

<div class="bulk" id="bulk" hidden></div>

<script>
// ---------- справочники ----------
const STATUS = [
  { name: "Не начато", color: "var(--s0)" },
  { name: "В работе", color: "var(--s1)" },
  { name: "Ждёт приёмки", color: "var(--s2)" },
  { name: "Принято", color: "var(--s3)" },
  { name: "Замечания", color: "var(--s4)" },
];
const ROLES = { pto: "Инженер ПТО", foreman: "Прораб", tn: "Технадзор", boss: "Руководитель" };
const WORKS = {
  apt: [
    ["Кладка перегородок", "АР", "м²"], ["Установка окон ПВХ", "АР", "шт."], ["Стояки ВК", "ВК", "п.м."],
    ["Электромонтаж: разводка", "ЭОМ", "п.м."], ["Радиаторы отопления", "ОВ", "шт."], ["Штукатурка стен", "Отделка", "м²"],
    ["Стяжка пола", "Отделка", "м²"], ["Входная дверь", "АР", "шт."], ["Шпаклёвка стен", "Отделка", "м²"], ["Установка счётчиков", "ВК", "шт."],
  ],
  k: [["Витражное остекление", "АР", "м²"], ["Электромонтаж: разводка", "ЭОМ", "п.м."], ["Вентиляция", "ОВ", "п.м."], ["Стяжка пола", "Отделка", "м²"], ["Штукатурка стен", "Отделка", "м²"]],
  mop: [["Штукатурка стен", "Отделка", "м²"], ["Плитка пола", "Отделка", "м²"], ["Освещение МОП", "ЭОМ", "шт."], ["Окраска стен", "Отделка", "м²"]],
  tech: [["Гидроизоляция пола", "АР", "м²"], ["Электромонтаж: разводка", "ЭОМ", "п.м."], ["Вентиляция", "ОВ", "п.м."], ["Окраска стен", "Отделка", "м²"]],
};
// плановые объёмы по типу квартиры — вносятся один раз, применяются ко всем квартирам этого типа
const TEMPLATE = {
  1: { "Кладка перегородок": 22, "Установка окон ПВХ": 2, "Стояки ВК": 6, "Электромонтаж: разводка": 90, "Радиаторы отопления": 2, "Штукатурка стен": 95, "Стяжка пола": 40, "Входная дверь": 1, "Шпаклёвка стен": 95, "Установка счётчиков": 2 },
  2: { "Кладка перегородок": 34, "Установка окон ПВХ": 3, "Стояки ВК": 6, "Электромонтаж: разводка": 140, "Радиаторы отопления": 3, "Штукатурка стен": 150, "Стяжка пола": 61, "Входная дверь": 1, "Шпаклёвка стен": 150, "Установка счётчиков": 2 },
  3: { "Кладка перегородок": 48, "Установка окон ПВХ": 4, "Стояки ВК": 9, "Электромонтаж: разводка": 190, "Радиаторы отопления": 4, "Штукатурка стен": 205, "Стяжка пола": 85, "Входная дверь": 1, "Шпаклёвка стен": 205, "Установка счётчиков": 2 },
};
const CREWS = { "АР": "Бригада №1 (общестрой)", "ВК": "Субподрядчик: ВК", "ЭОМ": "Субподрядчик: электрика", "ОВ": "Субподрядчик: ОВ", "Отделка": "Бригада №3 (отделка)" };
const ALL_WORK_NAMES = [...new Set(Object.values(WORKS).flat().map(w => w[0]))];

// ---------- даты ----------
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
const isoToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isoToRu = s => s.split("-").reverse().join(".");

// ---------- генерация примера ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PROJECT = {
  name: "ЖК «Кереге»",
  address: "Астана, район Есиль · пример данных",
  facts: [["Застройщик", "ТОО «Пример Девелопмент»"], ["Генподрядчик", "ТОО «Пример Строй»"], ["Класс жилья", "Комфорт"],
          ["Отделка", "Предчистовая"], ["Ввод в эксплуатацию", "IV кв. 2027"]],
  blocks: [],
};
const BLOCK_CFG = [
  { name: "Блок A", floors: 12, perFloor: [1, 1, 2, 2, 3], stage: 9.5 },
  { name: "Блок B", floors: 9, perFloor: [1, 2, 2, 3], stage: 7 },
  { name: "Блок C", floors: 12, perFloor: [1, 1, 2, 3, 3, 2], stage: 3.5 },

const baseQty = (name, unit, area) => unit === "шт." ? Math.max(1, Math.round(area / 25)) : unit === "п.м." ? Math.round(area * 1.6) : /пол/i.test(name) ? Math.round(area) : Math.round(area * 2.4);

function genEntries(w, qty, mon) {
  const day = () => 1 + Math.floor(rnd() * 27);
  if (w.unit === "шт." || qty < 20) { w.entries.push({ type: "fact", qty, date: `${pad(day())}.${pad(mon)}.2026`, who: ROLES.foreman }); return; }
  const first = Math.round(qty * (.4 + rnd() * .3));
  w.entries.push({ type: "fact", qty: first, date: `${pad(day())}.${pad(mon)}.2026`, who: ROLES.foreman });
  w.entries.push({ type: "fact", qty: qty - first, date: `${pad(day())}.${pad(Math.min(mon + 1, 10))}.2026`, who: ROLES.foreman });
}
function makeWorks(kind, floorNo, floors, stage, area, rooms) {
  const s = stage - (Math.max(floorNo, 1) - 1) * (stage / floors) * 0.9 + (rnd() - .5) * 1.2;
  return WORKS[kind].map(([name, section, unit], i) => {
    let st = i < s - 1.5 ? 3 : i < s - .5 ? 2 : i < s + .4 ? 1 : 0;
    if (st >= 2 && rnd() < .07) st = 4;
    const plan = kind === "apt" ? TEMPLATE[rooms][name] : baseQty(name, unit, area);
    const w = { name, section, unit, plan, crew: CREWS[section], status: st, entries: [], override: false };
    const mon = 3 + Math.min(6, Math.floor(i * .7 + floorNo * .3));
    if (st === 1) genEntries(w, Math.max(unit === "шт." ? 0 : 1, Math.round(plan * (.2 + rnd() * .6))), mon);
    if (st === 1 && fact(w) === 0) w.status = 0;
    if (st >= 2) genEntries(w, plan, mon);
    const tnDate = () => `${pad(5 + Math.floor(rnd() * 20))}.${pad(Math.min(mon + 1, 10))}.2026`;
    const f = fact(w);
    // принято: всё (3), частично (часть 1, 2 и 4) или ничего
    let acc = st === 3 ? plan : (st >= 1 && f > 0 && unit !== "шт." && rnd() < .4) ? Math.round(f * (.3 + rnd() * .4)) : 0;
    if (st === 3 && unit !== "шт." && plan >= 20) { const part = Math.round(plan * .5); w.entries.push({ type: "accept", qty: part, date: tnDate(), who: ROLES.tn }); acc -= part; }
    if (acc > 0) w.entries.push({ type: "accept", qty: acc, date: tnDate(), who: ROLES.tn });
    if (st === 4) w.entries.push({ type: "remark", date: tnDate(), who: ROLES.tn, note: "Отклонение от плоскости более 3 мм на 2 м, переделать" });
    return w;
  });
}
let aptNo = 1;

    } else {

// ---------- логика объёмов и статусов ----------
function sum(w, type) { return +w.entries.reduce((s, e) => s + (e.type === type ? e.qty : 0), 0).toFixed(2); }
function fact(w) { return sum(w, "fact"); }
function accepted(w) { return sum(w, "accept"); }
function rest(w) { return Math.max(0, +(w.plan - fact(w)).toFixed(2)); }
function pending(w) { return Math.max(0, +(fact(w) - accepted(w)).toFixed(2)); }
// статус вычисляется из плана, факта и принятого объёма; открытое замечание держит статус «Замечания»
function autoStatus(w) {
  if (w.status === 4) return;
  const f = fact(w), a = accepted(w);
  w.status = a >= w.plan ? 3 : f >= w.plan ? 2 : f > 0 ? 1 : 0;
}
function addFact(w, qty, date, note, photos) {
  w.entries.push({ type: "fact", qty, date, who: ROLES[role], note, photos });
  autoStatus(w);
}
function addAccept(w, qty, note) {
  w.entries.push({ type: "accept", qty, date: fmt(new Date()), who: ROLES[role], note });
  autoStatus(w);
}
function addRemark(w, note, photos) {
  w.entries.push({ type: "remark", date: fmt(new Date()), who: ROLES[role], note, photos });
  w.status = 4;
}
function fixRemark(w, note, photos) {
  w.entries.push({ type: "fixed", date: fmt(new Date()), who: ROLES[role], note, photos });
  w.status = 0; autoStatus(w);
}
function setPlan(w, plan, manual) {
  const old = w.plan;
  if (old === plan) return false;
  w.plan = plan;
  if (manual) w.override = true;
  w.entries.push({ type: "plan", from: old, to: plan, date: fmt(new Date()), who: ROLES[role], note: manual ? "вручную" : "по шаблону планировки" });
  autoStatus(w);

}
// принятый объём считается полностью, выполненный, но не принятый — на 90%

const progress = works => works.length ? works.reduce((s, w) => s + workProgress(w), 0) / works.length : 0;
const allWorks = units => units.flatMap(u => u.works);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// фото уменьшаются до 1280 px по длинной стороне, чтобы не хранить многомегабайтные снимки
function readPhoto(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onerror = () => res(null);
    r.onload = () => {
      const img = new Image();
      img.onerror = () => res(null);
      img.onload = () => {
        const s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", .8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
async function readPhotos(id) {
  const el = $(id);
  if (!el?.files?.length) return [];
  return (await Promise.all([...el.files].map(readPhoto))).filter(Boolean);
}

  const th = e.target.closest("[data-photo]");
  if (th) { $("lightbox-img").src = th.dataset.photo; $("lightbox").hidden = false; return; }
  const row = e.target.closest(".work-row");
  if (row) { const i = +row.dataset.w; openWork = openWork === i ? null : i; edMsg = ""; remarkForm = false; renderDrawer(); return; }
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const act = btn.dataset.act, { b, f, u } = getUnit(), idx = b.floors.indexOf(f);
  if (act === "close") return closeAll();
  if (act === "prev" || act === "next") return openDrawer(f.no, openUnit.ui + (act === "prev" ? -1 : 1));
  if (act === "up" || act === "down") { const nf = b.floors[idx + (act === "up" ? -1 : 1)]; return openDrawer(nf.no, Math.min(openUnit.ui, nf.units.length - 1)); }
  const w = u.works[openWork]; edMsg = "";
  if (act === "remark-open") { remarkForm = true; renderDrawer(); $("ed-remark")?.focus(); return; }
  if (act === "plan") {
    const v = parseFloat($("ed-plan").value);
    if (!(v > 0)) edMsg = "План должен быть больше нуля.";
    else if (setPlan(w, v, true)) toast(`План: ${q(v)} ${w.unit}`);
  }
  if (act === "fact" || act === "full") {
    const qty = act === "full" ? rest(w) : parseFloat($("ed-qty").value);
    const note = $("ed-note").value.trim(), date = isoToRu($("ed-date").value || isoToday());
    if (!(qty > 0)) edMsg = "Укажите объём больше нуля.";
    else if (fact(w) + qty > w.plan * 1.05 && !note) edMsg = `Получится ${q(fact(w) + qty)} из ${q(w.plan)} ${w.unit} — больше плана. Напишите причину в комментарии.`;
    else {
      const photos = await readPhotos("ed-photo");
      addFact(w, qty, date, note, photos);
      toast(`+${q(qty)} ${w.unit}${photos.length ? ` · фото ${photos.length}` : ""}`);
    }
  }
  if (act === "fixed") {
    const photos = await readPhotos("ed-fixphoto");
    fixRemark(w, $("ed-fixnote").value.trim(), photos);
    toast("Отправлено на повторную приёмку");
  }
  if (act === "accept") {
    const qty = parseFloat($("ed-acc").value), pend = pending(w);
    if (!(qty > 0)) edMsg = "Укажите объём больше нуля.";
    else if (qty > pend) edMsg = `Можно принять не больше ${q(pend)} ${w.unit}.`;
    else { addAccept(w, qty); toast(`Принято ${q(qty)} ${w.unit}${qty < pend ? ` · осталось ${q(pend - qty)}` : ""}`); }
  }
  if (act === "remark") {
    const t = $("ed-remark").value.trim();
    if (!t) edMsg = "Опишите, что нужно исправить.";
    else { const photos = await readPhotos("ed-rphoto"); addRemark(w, t, photos); remarkForm = false; toast("Замечание выставлено"); }
  }
  renderAll();
});

// ---------- массовая отметка ----------
function selectedUnits() {
  const b = PROJECT.blocks[current];
  return [...selected].map(k => { const [fn, ui] = k.split(":").map(Number); return b.floors.find(f => f.no === fn).units[ui]; });
}
function renderBulk() {
  $("bulk").hidden = !mass;
  if (!mass) return;
  const n = selected.size;
  const act = role === "foreman" ? `<button class="btn" data-bulk="done" ${n ? "" : "disabled"}>Выполнено</button>`
    : role === "tn" ? `<button class="btn" data-bulk="accept" ${n ? "" : "disabled"}>Принять</button>`
    : `<span class="hint">Отмечать может прораб или технадзор</span>`;
  $("bulk").innerHTML = `
    <span>${n ? `Выбрано: <b>${n}</b>` : "Выберите помещения"}</span>
    <select id="bulk-work" aria-label="Вид работы">${ALL_WORK_NAMES.map(x => `<option ${x === bulkWork ? "selected" : ""}>${x}</option>`).join("")}</select>
    ${act}
    <button class="icon" data-bulk="exit" aria-label="Выйти из режима выбора">${ICON.close}</button>`;
}
$("bulk").addEventListener("change", e => {
  if (e.target.id !== "bulk-work") return;
  bulkWork = colorBy = e.target.value; $("view").value = colorBy; renderSummary(); renderBoard();
});
$("bulk").addEventListener("click", e => {
  const a = e.target.closest("[data-bulk]")?.dataset.bulk; if (!a) return;
  if (a === "exit") return setMass(false);
  let ok = 0, skip = 0;
  selectedUnits().forEach(u => {
    const w = u.works.find(x => x.name === bulkWork);
    if (a === "done" && w && (w.status === 0 || w.status === 1)) { addFact(w, rest(w), fmt(new Date()), "массовая отметка"); ok++; }
    else if (a === "accept" && w && w.status !== 4 && pending(w) > 0) { addAccept(w, pending(w), "массовая приёмка"); ok++; }
    else skip++;
  });
  toast(`${bulkWork}: ${ok} готово${skip ? `, ${skip} пропущено` : ""}`);
  selected.clear(); renderAll();
});
function setMass(on) {
  mass = on; selected.clear();
  $("mass-toggle").setAttribute("aria-pressed", on);
  $("mass-toggle").textContent = on ? "Готово" : "Выбрать";
  if (on && !ALL_WORK_NAMES.includes(colorBy)) colorBy = bulkWork;
  $("view").value = colorBy;
  renderAll();
}

// ---------- шаблоны объёмов ----------
function renderModal() {
  $("modal").innerHTML = `
    <div class="sheet-head"><div><h2 id="m-title">Объёмы по планировкам</h2>
      <p class="muted small">Применяются ко всем квартирам этого типа. Планы, изменённые вручную, не меняются.</p></div>
      <button class="icon" data-m="close" aria-label="Закрыть">${ICON.close}</button></div>
    <div class="scroll-x"><table class="tpl">
      <thead><tr><th>Работа</th><th>Ед.</th><th>1-комн.</th><th>2-комн.</th><th>3-комн.</th></tr></thead>
      <tbody>${WORKS.apt.map(([n, , unit], i) => `<tr><td>${n}</td><td class="muted">${unit}</td>${[1, 2, 3].map(r =>
        `<td><input type="number" min="0" step="any" id="tpl-${r}-${i}" value="${TEMPLATE[r][n]}" aria-label="${n}, ${r}-комн."></td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>
    <div class="row"><button class="btn primary" data-m="apply">Применить</button><button class="btn" data-m="close">Отмена</button></div>`;
}
$("tpl-open").addEventListener("click", () => { renderModal(); $("modal").hidden = false; $("scrim").hidden = false; $("modal").querySelector("[data-m]").focus(); });
$("modal").addEventListener("click", e => {
  const a = e.target.closest("[data-m]")?.dataset.m; if (!a) return;
  if (a === "close") return closeAll();
  WORKS.apt.forEach(([n], i) => [1, 2, 3].forEach(r => { const v = parseFloat($(`tpl-${r}-${i}`).value); if (v > 0) TEMPLATE[r][n] = v; }));
  let changed = 0, kept = 0;
  PROJECT.blocks.flatMap(blockUnits).filter(u => u.kind === "apt").forEach(u => u.works.forEach(w => {
    if (w.override) { kept++; return; }
    if (setPlan(w, TEMPLATE[u.rooms][w.name], false)) changed++;
  }));
  closeAll(); renderAll();
  toast(`Изменено работ: ${changed}${kept ? ` · с ручным планом не тронуто: ${kept}` : ""}`);
});

// ---------- прочее ----------
let toastTimer;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3000); }
function renderAll() {
  $("tpl-open").hidden = role !== "pto";
  renderSummary(); renderTabs(); renderBoard(); renderBulk();
  if (openUnit) renderDrawer();
}

$("role").innerHTML = Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === role ? "selected" : ""}>${v}</option>`).join("");
$("role").addEventListener("change", e => { role = e.target.value; edMsg = ""; remarkForm = false; if (!$("modal").hidden) closeAll(); renderAll(); });
$("view").addEventListener("change", e => { colorBy = e.target.value; if (ALL_WORK_NAMES.includes(colorBy)) bulkWork = colorBy; renderSummary(); renderBoard(); renderBulk(); });
$("p-stats").addEventListener("click", e => {
  const s = e.target.closest("[data-mode]"); if (!s) return;
  colorBy = colorBy === s.dataset.mode ? "progress" : s.dataset.mode; $("view").value = colorBy;
  renderSummary(); renderBoard();
});
$("tabs").addEventListener("click", e => { const t = e.target.closest("[data-i]"); if (!t) return; current = +t.dataset.i; selected.clear(); renderAll(); });
$("mass-toggle").addEventListener("click", () => setMass(!mass));
$("board").addEventListener("click", e => {
  const fl = e.target.closest(".floor-no");
  if (fl && mass) {
    const fn = +fl.dataset.floor, f = PROJECT.blocks[current].floors.find(x => x.no === fn);
    const keys = f.units.map((_, i) => `${fn}:${i}`), all = keys.every(k => selected.has(k));
    keys.forEach(k => all ? selected.delete(k) : selected.add(k));
    renderBoard(); renderBulk(); return;
  }
  const c = e.target.closest(".cell"); if (!c) return;
  if (mass) { const k = `${c.dataset.f}:${c.dataset.u}`; selected.has(k) ? selected.delete(k) : selected.add(k); renderBoard(); renderBulk(); }
  else openDrawer(+c.dataset.f, +c.dataset.u);
});
$("scrim").addEventListener("click", closeAll);
$("lightbox").addEventListener("click", () => { $("lightbox").hidden = true; });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("lightbox").hidden) $("lightbox").hidden = true;
  else if (!$("scrim").hidden) closeAll();
  else if (mass) setMass(false);
});

renderView();
renderAll();
</script>
