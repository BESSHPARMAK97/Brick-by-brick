<title>Brick by Brick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: рабочий портал проекта — боковая навигация по модулям, справа рабочая область; на телефоне навигация становится лентой вкладок сверху */
:root {
  --bg: #eef0f2;          /* бетон */
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --line: #d9dde3;
  --fg: #1b2129;
  --muted: #5d6672;
  --accent: #1f5fd1;      /* синий чертёжный */
  --accent-soft: #e3ebfb;
  --signal: #e8891c;      /* сигнальный оранжевый, для «нового» */
  --ok: #1f8a54;  --ok-soft: #e0f3e8;
  --warn: #b7791f; --warn-soft: #fbf0dc;
  --bad: #c2382f;  --bad-soft: #fbe4e2;
  --info: #6a4fc4; --info-soft: #ece7fa;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171c; --surface: #1b2027; --surface-2: #222831; --line: #2f3742;
  --fg: #e6e9ee; --muted: #98a2ae; --accent: #6b9bff; --accent-soft: #1f2c47; --signal: #f2a24a;
  --ok: #4cc485; --ok-soft: #173326; --warn: #e0b052; --warn-soft: #3a2f17;
  --bad: #f07a70; --bad-soft: #3d1d1b; --info: #a892ff; --info-soft: #2a2347; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13171c; --surface: #1b2027; --surface-2: #222831; --line: #2f3742;
  --fg: #e6e9ee; --muted: #98a2ae; --accent: #6b9bff; --accent-soft: #1f2c47; --signal: #f2a24a;
  --ok: #4cc485; --ok-soft: #173326; --warn: #e0b052; --warn-soft: #3a2f17;
  --bad: #f07a70; --bad-soft: #3d1d1b; --info: #a892ff; --info-soft: #2a2347; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5 }
h1, h2, h3 { text-wrap: balance; margin: 0 }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -.01em }
h2 { font-family: var(--f-display); font-weight: 500; font-size: 1.15rem }
h3 { font-size: 1rem; font-weight: 600 }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono { font-family: var(--f-mono); font-size: .82em }
.muted { color: var(--muted) }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600 }
.num { font-variant-numeric: tabular-nums }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px }
.brand svg { flex: none }
.brand b { font-family: var(--f-display); font-size: .95rem; font-weight: 700; line-height: 1.1 }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-weight: 500 }
.nav a:hover { background: var(--surface-2) }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent) }
.nav .cnt { font-size: .72rem; font-family: var(--f-mono); color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 7px }
.nav a[aria-current="page"] .cnt { background: var(--surface); color: var(--accent) }
.nav-g { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 14px 10px 4px }
.nav-g:first-child { padding-top: 0 }
.nav .cnt.alert, .subtabs .cnt.alert { color: var(--bad); background: var(--bad-soft) }
.vtable td { vertical-align: top }
.vtable .vname { font-weight: 600 }
.vtable .vval { min-width: 210px }
.vin { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 8px; width: 150px; max-width: 100% }
.vin.num { text-align: right; font-variant-numeric: tabular-nums }
.vtable .unit { margin-left: 6px; font-size: .8rem }
.vsrc { font-size: .78rem; margin-top: 4px }
.vsrc a, .vtable td a { color: var(--accent) }
.vused .tag { display: inline-block; margin: 0 2px 4px 0 }
.vhist summary { cursor: pointer; font-size: .8rem; color: var(--accent) }
.vhist div { font-size: .8rem; margin-top: 3px }
.dup { font-size: .75rem; color: var(--warn); margin-top: 2px }
.delta { font-size: .8rem; margin-top: 2px; color: var(--muted) }
.delta.good { color: var(--ok) } .delta.bad { color: var(--bad) }
.btn.mini { padding: 3px 8px; font-size: .78rem }
.filters input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; font-weight: 500; color: var(--fg); font-size: .9rem }
.subtabs { display: none; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 12px }
@media (max-width: 760px) { .subtabs { display: flex } }
.subtabs a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 500; font-size: .92rem }
.subtabs a:hover { border-color: var(--accent) }
.subtabs a[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.subtabs .cnt { font-size: .72rem; font-family: var(--f-mono); border-radius: 99px; padding: 1px 7px }
.nav-grp > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 12px 10px 4px; border-radius: 6px }
.nav-grp > summary::-webkit-details-marker { display: none }
.nav-grp > summary::after { content: "▾"; font-size: .8rem; margin-left: auto; transition: transform .15s } .nav-grp:not([open]) > summary::after { transform: rotate(-90deg) }
.nav-grp > summary:hover { color: var(--fg) }
.nav-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--bad); flex: none }
.nav-ribbon { display: none }
.gbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line) }
.gbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font: 500 .9rem var(--f-body); color: var(--fg); max-width: 100% }
.g-sync { font-size: .78rem; color: var(--muted) } .g-sync[data-mode="shared"]::before { content: "● "; color: var(--ok) } .g-sync[data-mode="local"]::before { content: "● "; color: var(--warn) }
.g-sp { flex: 1 }
.gbar kbd { font: 600 .68rem var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; color: var(--muted) }
.td-list, .td-soon { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.td-list li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.td-list li:last-child, .td-soon li:last-child { border-bottom: 0 }
.td-tag { font-size: .72rem; font-weight: 600; border-radius: 99px; padding: 2px 8px; text-align: center }
.td-bad .td-tag { background: var(--bad-soft); color: var(--bad) } .td-warn .td-tag { background: var(--warn-soft); color: var(--warn) } .td-info .td-tag { background: var(--accent-soft); color: var(--accent) }
.td-soon li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: .92rem }
.st-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .85rem }
.st-chips a { text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; background: var(--surface) }
.st-chips a:hover { border-color: var(--accent) } .st-chips a[data-state="done"] { color: var(--ok); border-color: var(--ok-soft); background: var(--ok-soft) }
.st-chips a[data-state="active"], .st-chips a[data-state="open"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft) }
.td-stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.td-stages li { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 120px; grid-template-areas: "n d p" "t t t"; gap: 4px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.td-stages li:last-child { border-bottom: 0 }
.td-st { grid-area: n; display: flex; gap: 10px; align-items: baseline; text-decoration: none; color: var(--fg) } .td-st:hover b { color: var(--accent) }
.td-stages li > .muted { grid-area: d; font-size: .85rem } .td-prog { grid-area: p; display: flex; flex-direction: column; gap: 4px; font-size: .8rem; text-align: right }
.mbar2 { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden } .mbar2 i { display: block; height: 100%; background: var(--accent) }
.td-tools { grid-area: t; display: flex; flex-wrap: wrap; gap: 6px } .td-tools a { font-size: .78rem; text-decoration: none; color: var(--accent); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px }
@media (max-width: 760px) { .td-stages li { grid-template-columns: minmax(0, 1fr) 90px; grid-template-areas: "n p" "d d" "t t" } }
.h2 { font-family: var(--f-display); font-size: 1.05rem; font-weight: 700; margin: 0 }
.search { position: fixed; z-index: 21; top: max(10vh, 16px); left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); max-height: 76vh; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 20px 60px rgb(0 0 0 / .25) }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font: 500 1rem var(--f-body); color: var(--fg) }
.s-res { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0 }
.s-item { display: grid; grid-template-columns: 96px minmax(0, 1fr); grid-template-areas: "k t" "k s"; gap: 0 10px; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 8px; color: var(--fg); font: inherit }
.s-item .tag { grid-area: k; align-self: start; justify-self: start } .s-t { grid-area: t; font-weight: 600 } .s-sub { grid-area: s; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.s-item.on, .s-item:hover { background: var(--accent-soft) }
.s-hint { font-size: .75rem }
.side-foot { margin-top: auto; font-size: .78rem; color: var(--muted); padding: 0 6px }

.main { padding-block: 24px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; min-width: 0 }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.demo { font-size: .75rem; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 3px 10px; font-weight: 600 }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px }
.grid { display: grid; gap: 14px }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)) }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.between { justify-content: space-between }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 10px; font-size: .78rem; font-weight: 600; white-space: nowrap }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.s-done { color: var(--ok); background: var(--ok-soft) }
.s-fail { color: var(--bad); background: var(--bad-soft) }
.s-agreed { color: var(--accent); background: var(--accent-soft) }
.s-new { color: var(--signal); background: var(--warn-soft) }
.s-changed { color: var(--info); background: var(--info-soft) }
.tag { font-size: .75rem; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; color: var(--muted); white-space: nowrap }
.tag.auto { border-color: var(--accent); color: var(--accent) }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500 }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent) }

/* Карточка */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 20px }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field .v { font-weight: 500 }
.field .v a { color: var(--accent) }
.field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 9px }
.field.key select { border-color: var(--accent) }
.field input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 9px; min-width: 0; width: 100% }
.field select:disabled, .field input:disabled { opacity: .7 }
.hint { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); color: var(--fg); border-radius: var(--r); padding: 12px 14px; font-size: .9rem }
.hint b { color: var(--accent) }

/* Стандарты */
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--muted); font-weight: 600 }
.filters select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; font-weight: 500; color: var(--fg); font-size: .9rem }
.filters select.from-card { border-color: var(--accent); background: var(--accent-soft) }
.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface) }
.summary > div { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0 }
.summary > div:last-child { border-right: 0 }
.summary .dir { font-weight: 600; font-size: .9rem }
.summary .full { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin-top: 8px }
.bar i { display: block; height: 100% }
.std-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden }
.std { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100% }
.std:last-child { border-bottom: 0 }
.std:hover { background: var(--surface-2) }
.std .t { font-weight: 600 }
.std .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
.prog { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); white-space: nowrap }
.empty { padding: 28px; text-align: center; color: var(--muted) }

/* Презентация ПК Start: слайды 16:9 — «бумага», всегда светлые, чтобы совпадать с выгрузкой */
.deck { display: grid; gap: 20px }
.deck:fullscreen { background: #1b2129; overflow-y: auto; padding: 24px; align-content: start }
.slide { aspect-ratio: 16 / 9; container-type: inline-size; background: #ffffff; color: #1b2129; border: 1px solid #d9dde3; border-radius: 10px; padding: 3.2cqw 4cqw; display: flex; flex-direction: column; gap: 1.6cqw; overflow: hidden; max-width: 100% }
.sl-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #d9dde3; padding-bottom: 1cqw }
.sl-head h2 { font-family: var(--f-display); font-size: 2.6cqw; color: #1b2129 }
.sl-head span { font-size: 1.1cqw; color: #5d6672 }
.sl-body { display: flex; flex-direction: column; gap: 1.4cqw; min-height: 0; font-size: 1.45cqw }
.sl-body svg { width: 100%; height: auto; max-height: 30cqw }
.sl-txt { font: 15px var(--f-body); fill: #1b2129 }
.sl-mut { fill: #5d6672 }
.sl-bar { fill: #c9d8f5; stroke: #1f5fd1 }
.sl-crit { fill: #f3c8c4; stroke: #c2382f }
.sl-late { fill: #c2382f; opacity: .35 }
.sl-axis { stroke: #8a929c; stroke-width: 1 }
.sl-line { fill: none; stroke: #1f5fd1; stroke-width: 3 }
.sl-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw }
.slide table { border-collapse: collapse; width: 100%; font-size: 1.35cqw }
.slide td, .slide th { border-bottom: 1px solid #e3e6ea; padding: .55cqw .4cqw; text-align: left; vertical-align: top; color: #1b2129 }
.slide td:first-child { color: #5d6672 }
.slide td:nth-child(2) { font-weight: 600 }
.slide th { font-size: 1.1cqw; color: #5d6672; text-transform: none; letter-spacing: 0 }
.sl-wide td:nth-child(n+2) { font-weight: 600 }
.slide td.bad { color: #c2382f } .slide td.good { color: #1f8a54 }
.sl-cover { display: flex; flex-direction: column; justify-content: center; gap: 1.4cqw; height: 100% }
.sl-cover h1 { font-family: var(--f-display); font-size: 4.6cqw; color: #1b2129; line-height: 1.1 }
.sl-cover p { font-size: 1.8cqw; color: #5d6672; margin: 0 }
.sl-eyebrow { font-size: 1.3cqw; letter-spacing: .12em; text-transform: uppercase; color: #1f5fd1; font-weight: 700 }
.sl-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2cqw }
.sl-kpi { background: #f5f6f8; border: 1px solid #d9dde3; border-radius: .8cqw; padding: 1cqw 1.2cqw; display: grid; gap: .3cqw }
.sl-kpi span { font-size: 1.1cqw; color: #5d6672 }
.sl-kpi b { font-family: var(--f-display); font-size: 1.9cqw; font-weight: 500; color: #1b2129 }
.sl-lead { margin: 0; font-size: 1.5cqw; color: #1b2129 }
.sl-note { margin: auto 0 0; font-size: 1.2cqw; color: #5d6672; font-style: italic }
.blocks-t th { white-space: normal; min-width: 0; font-size: .72rem }
.blocks-t input.vin.num { width: 64px; min-width: 0 }
.blocks-t input.vin:not(.num) { width: 110px; min-width: 0 }
.blocks-t select { max-width: 130px }
.smeta-obj summary { display: flex; justify-content: space-between; gap: 12px; cursor: pointer; padding: 6px 0; border-bottom: 1px solid var(--line) }
.wi-params { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 6px 0; min-width: 420px }
.wi-params label { display: flex; flex-direction: column; gap: 2px; font-size: .7rem; color: var(--muted) }
.wi-params span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.wi-params .vin { width: 100% }
.ch-k { grid-template-columns: repeat(4, minmax(0, 1fr)) }
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; align-items: start }
.ch-t { border-collapse: separate; border-spacing: 3px; width: auto }
.ch-t th, .ch-t td { padding: 0; border: 0; text-align: center; font-size: .75rem }
.ch-t thead th { color: var(--muted); font-weight: 500; padding-bottom: 2px }
.ch-t tbody th { color: var(--muted); font-weight: 500; min-width: 34px; padding-right: 4px; text-align: right }
.ch-c { display: flex; align-items: center; justify-content: center; width: 52px; height: 26px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font: 600 .72rem var(--f-body); padding: 0 }
button.ch-c { cursor: pointer } button.ch-c:disabled { cursor: default }
.ch-c.st1, .ch-sw.st1 { background: var(--info-soft); border-color: var(--info) }
.ch-c.st2, .ch-sw.st2 { background: var(--accent-soft); border-color: var(--accent) }
.ch-c.st3, .ch-sw.st3 { background: var(--warn-soft); border-color: var(--warn) }

.model-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }

.fs { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; min-width: 0; }
.fs legend { padding: 0; margin-bottom: 6px; }
.inrow { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 8px; align-items: center; font-size: 13px; }
.inrow label { color: var(--ink); line-height: 1.25; }
.inbox { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.inbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inbox input { width: 100%; min-width: 0; border: 0; background: none; padding: 6px 8px; font: inherit; font-size: 13px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.inbox span { padding-right: 8px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.inrow input[type="checkbox"] { justify-self: end; width: 18px; height: 18px; accent-color: var(--done); }
.model-out { display: grid; gap: 18px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.kpi { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi b { font-family: var(--f-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.kpi[data-tone="good"] b { color: var(--done); }
.kpi[data-tone="warn"] b { color: var(--accent-ink); }
.kpi[data-tone="bad"] b { color: var(--late); }
.verdict { padding: 12px 14px; border-radius: 10px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.verdict[data-tone="good"] { background: var(--done-soft); border-color: transparent; }
.verdict[data-tone="warn"] { background: var(--accent-soft); border-color: transparent; }
.verdict[data-tone="bad"] { background: var(--late-soft); border-color: transparent; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .cum-area { fill: var(--accent-soft); }
.chart .cum-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .debt-line { fill: none; stroke: var(--late); stroke-width: 2; stroke-dasharray: 5 4; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.chart-legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr.total td { font-weight: 600; border-bottom: 0; }
table.t th.num { text-align: right; }
.sens td { text-align: center; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 8px 4px; }
.sens th { text-align: center; }
.sens td[data-tone="bad"] { background: var(--late-soft); color: var(--late); }
.sens td[data-tone="warn"] { background: var(--accent-soft); color: var(--accent-ink); }
.sens td[data-tone="good"] { background: var(--done-soft); color: var(--done); }
.sens td.base { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.sens table { border-collapse: separate; border-spacing: 3px; width: 100%; }

/* Budget */
.tin { width: 100%; min-width: 110px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 5px 7px; font: inherit; font-size: 13px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.tin.note { text-align: left; min-width: 140px; }
.tin:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tin:disabled { background: var(--surface-2); color: var(--muted); }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; min-width: 70px; }
.meter i { display: block; height: 100%; background: var(--done); }
.meter[data-tone="bad"] i { background: var(--late); }
.dev[data-tone="bad"] { color: var(--late); font-weight: 600; }
.dev[data-tone="good"] { color: var(--done); }
.budget-mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

/* Gantt */
.g-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; }
.g-inner { position: relative; }
.g-body { position: relative; }
.g-row { display: grid; grid-template-columns: 300px auto; align-items: center; border-bottom: 1px solid var(--line); min-height: 34px; }
.g-row:last-child { border-bottom: 0; }
.g-head { min-height: 38px; background: var(--surface-2); }
.g-label { position: sticky; left: 0; z-index: 3; background: var(--surface); display: flex; gap: 6px; justify-content: space-between; align-items: center; padding: 4px 8px; height: 100%; border-right: 1px solid var(--line); font-size: 12.5px; min-width: 0; }
.g-head .g-label { background: var(--surface-2); }
.g-label .linkbtn { text-decoration: none; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.g-label .linkbtn:hover { text-decoration: underline; }
.g-dur { display: inline-flex; align-items: center; gap: 4px; flex: none; font-size: 11px; color: var(--muted); }
.g-dur .tin { width: 52px; min-width: 52px; padding: 3px 5px; font-size: 12px; }
.g-track { position: relative; height: 34px; }
.g-axis { height: 38px; }
.g-year { position: absolute; top: 3px; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink); padding-left: 3px; border-left: 1px solid var(--muted); }
.g-tick { position: absolute; bottom: 3px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); padding-left: 3px; }
.g-bar { position: absolute; top: 9px; height: 16px; border-radius: 4px; background: var(--accent-soft); border: 1px solid var(--accent); overflow: hidden; }
.g-bar i { display: block; height: 100%; background: var(--accent); opacity: .55; }
.g-bar.crit { background: var(--late-soft); border-color: var(--late); }
.g-bar.crit i { background: var(--late); }
.g-bar.done { background: var(--done); border-color: var(--done); }
.g-bar.done i { background: var(--done); opacity: 1; }
.g-bar.tail { background: var(--surface-2); border-color: var(--line); border-style: dashed; }
.g-bar.tail i { background: var(--locked); }
.g-slack { position: absolute; top: 16px; height: 2px; background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }
.g-late { position: absolute; top: 9px; height: 16px; border-radius: 0 4px 4px 0; background: repeating-linear-gradient(45deg, var(--late) 0 3px, transparent 3px 7px); opacity: .7; }
.g-late-name { color: var(--late); font-weight: 600; }
.g-overlay { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 1; }
.g-ygrid { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--line); }
.g-now { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--ink); }
.g-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.g-legend i { display: inline-block; width: 16px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lg-crit { background: var(--late-soft); border: 1px solid var(--late); }
.lg-bar { background: var(--accent-soft); border: 1px solid var(--accent); }
.lg-slack { height: 2px !important; background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); vertical-align: 3px !important; }
.lg-late { background: repeating-linear-gradient(45deg, var(--late) 0 3px, transparent 3px 7px); }
.lg-done { background: var(--done); }
.lg-now { width: 2px !important; background: var(--ink); }
.g-mode { display: flex; gap: 6px; flex-wrap: wrap; }
.g-mode .chip { cursor: pointer; padding: 6px 12px; font-size: 13px; }
.g-mode .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.g-crit { margin: 8px 0 0; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
@media (max-width: 560px) { .g-row { grid-template-columns: 180px auto; } .g-overlay { left: 180px !important; } .g-inner { min-width: auto !important; } }

/* Projects, achievements, minimap, norms */
.rep-bar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px; }
.rep-bar .meter { height: 10px; }
.rep-bar .mono { text-align: right; color: var(--muted); font-size: 12px; }
#proj-sel { width: 100%; font-weight: 500; }
table.t tr.cur td { background: var(--surface-2); }
.ach { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ach summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; list-style: none; font-size: 13px; font-weight: 500; }
.ach summary::-webkit-details-marker { display: none; }
.ach-mini { display: inline-flex; gap: 3px; }
.ach-mini i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.ach-mini i[data-on="true"] { background: var(--accent); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 0 14px 14px; }
.ach-item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.ach-item[data-on="false"] { opacity: .55; }
.ach-item .dl-sub { display: block; }
.ach-badge { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--line); color: var(--surface); font-size: 15px; }
.ach-item[data-on="true"] .ach-badge { background: var(--accent); }
.minimap { display: none; }
@media (max-width: 980px) {
  .minimap { display: grid; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0 0 12px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .mm-groups { display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .mm-g { display: grid; gap: 3px; }
  .mm-g > span { font-family: var(--f-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .mm-g > div { display: flex; gap: 3px; }
  .mm-dot { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--f-mono); font-size: 10px; padding: 0; color: var(--muted); cursor: pointer; }
  .mm-dot[data-state="open"], .mm-dot[data-state="active"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .mm-dot[data-state="risk"] { background: var(--risk-soft); border-color: var(--risk); color: var(--risk); }
  .mm-dot[data-state="done"] { background: var(--done); border-color: var(--done); color: var(--surface); }
  .mm-dot[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
  .minimap > .btn { justify-self: start; padding: 5px 10px; font-size: 12px; }
}
.refs { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; }

/* Region and language */
.region-bar { display: grid; gap: 6px; margin: 4px 0 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface); font-size: 13px; }
.region-bar[data-on="true"] { border-style: solid; border-color: var(--accent); }
.region-bar .row { align-items: center; }
.region-bar label { font-weight: 500; }
.region-bar .muted b { color: var(--accent-ink); }
.rank .row { flex-wrap: nowrap; }
.rank .row .btn:first-child { flex: 1; }

/* Attachments and log */
.att-chip { text-decoration: none; color: var(--ink); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-chip:hover { border-color: var(--ink); }
.att-box { grid-column: 1 / -1; display: grid; gap: 8px; padding-top: 4px; }
.att-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.att-item a { color: var(--ink); overflow-wrap: anywhere; }
.att-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.att-add input { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.sel { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.section-title { flex-wrap: wrap; }
@media (max-width: 560px) { .sel { width: 100%; } .section-title > .row { width: 100%; } }

/* Deadlines */
.dl-head { display: grid; gap: 10px; }
.dl-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; padding-top: 8px; border-top: 1px dashed var(--line); }
.dl-form .wide { grid-column: span 2; }
.dl-form select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.dl-quick { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; }
.dl-actions { grid-column: 1 / -1; }
.dl-title { font-weight: 500; }
.dl-sub { font-size: 12px; color: var(--muted); }
@media (max-width: 980px) {
  .model-grid { grid-template-columns: minmax(0, 1fr); }
  .model-inputs { position: static; max-height: none; }
  .dl-form { grid-template-columns: minmax(0, 1fr); }
  .dl-form .wide { grid-column: auto; }
}
.task input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--done); cursor: pointer; }
.task input:disabled, .task input:disabled + span { cursor: not-allowed; }
.task input:disabled + span { color: var(--muted); }
.task input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

.docs { display: grid; gap: 8px; }
.doc {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
  padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2);
}
.doc-ext {
  width: 34px; height: 40px; border-radius: 4px 10px 4px 4px; display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 9.5px; text-transform: uppercase; background: var(--surface); border: 1px solid var(--line); color: var(--muted);
}
.doc-title { font-size: 13px; font-weight: 500; line-height: 1.3; min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.tip { font-size: 13px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; }
.tip b { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); display: block; margin-bottom: 2px; }
.panel-close { display: none; }
.foot { margin-top: 28px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; align-items: center; }
.reset-confirm { display: inline-flex; gap: 6px; align-items: center; }

/* Document viewer */
dialog.viewer {
  width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
dialog.viewer::backdrop { background: rgba(10, 20, 35, .55); }
.viewer-head { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.viewer-head h3 { font-size: 15px; min-width: 0; }
.viewer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.viewer-body { padding: 18px; overflow: auto; max-height: calc(100vh - 160px); }
.viewer-body pre {
  margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
}
.viewer-note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50;
}

@media (max-width: 980px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .panel {
    position: fixed; inset: auto 0 0 0; top: auto; max-height: 86vh; border-radius: 16px 16px 0 0; z-index: 30;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .panel[data-open="false"] { display: none; }
  .panel-close { display: flex; position: sticky; top: 8px; width: max-content; margin: 8px 8px 0 auto; z-index: 2; box-shadow: var(--shadow); }
}
@media (max-width: 560px) {
  .hud { grid-template-columns: 1fr; }
  .rank { min-width: 0; }
  .tier { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .tier-label { grid-auto-flow: column; justify-self: center; gap: 8px; align-items: baseline; position: relative; z-index: 1; background: var(--bg); padding: 0 6px; }
  .node { width: 124px; }
}

/* В портале заголовок и вкладки дерева заменены заголовком и меню портала, а прогресс собран в одну строку. */
.hud > div:first-child, .tabs { display: none; }
/* Заголовки разделов, повторяющие заголовок страницы портала. */
#view-gantt .view-title, #view-deadlines .view-title, #view-projects .view-title { display: none; }
/* В показателях (финмодель, сроки) игровой прогресс не нужен, остаются выбор проекта и карточка. */
:host([data-view="model"]) .rank-row, :host([data-view="model"]) .xpbar, :host([data-view="model"]) .hud-meta,
:host([data-view="deadlines"]) .rank-row, :host([data-view="deadlines"]) .xpbar, :host([data-view="deadlines"]) .hud-meta { display: none; }
.hud { display: block; padding-top: 0; }
.rank { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; min-width: 0; }
.rank .xpbar { flex: 1 1 160px; }
#proj-sel { width: auto; min-width: 200px; }
/* Выбор проекта, статус сохранения и язык — в общей панели портала. Без игровых очков и рангов: прогресс виден по этапам. */
.hud, #ach { display: none !important; }
:host(:not([data-view="tree"])) .alerts { display: none; }
/* Дорожная карта: основной вид — этапы списком по фазам; схема связей — отдельный вид. */
:host([data-mode="map"]) .tree, :host([data-mode="map"]) .legend, :host([data-mode="map"]) .minimap { display: none !important; }
:host(:not([data-mode="map"])) .map { display: none; }
.map { display: flex; flex-direction: column; gap: 14px; }
.ph { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.ph-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.ph-h b { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.ph-h .mono { font-size: 12px; color: var(--muted); }
.ph-st { margin-left: auto; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px; }
.ph-st[data-s="done"] { background: var(--done-soft); color: var(--done); } .ph-st[data-s="now"] { background: var(--accent-soft, #e3ebfb); color: var(--accent); } .ph-st[data-s="next"] { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.mrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px; gap: 4px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mrow:last-child { border-bottom: 0; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-current="true"] { box-shadow: inset 3px 0 0 var(--accent); background: var(--surface-2); }
.mrow .mc { font: 600 12px var(--f-mono, monospace); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.mrow[data-state="done"] .mc { background: var(--done-soft); border-color: var(--done); color: var(--done); }

<script id="model-lib">
// Помесячная финмодель ЖК: выручка, затраты, НДС, финансирование, КПН, IRR.
window.MODEL_DEFAULTS = {
  area_sale: 32000, area_comm: 2000, parking: 250, area_total: 45000,
  price: 550000, price_comm: 700000, price_park: 4000000, growth: 5,
  land: 2000000000, design: 12000, smr: 260000, nets: 25000,
  supervision: 2, marketing: 3, admin: 2, reserve: 7,
  land_m: 1, design_start: 2, design_dur: 8, build_start: 10, build_dur: 26, sales_start: 12, sales_dur: 30,
  equity: 1500000000, rate: 21, discount: 18,
  vat: 16, vat_exempt: 1, cit: 20
};
window.runModel = function (p, f) {
  f = f || {};
  const kP = f.price || 1, kS = f.smr || 1;
  const N = Math.max(p.land_m, p.design_start + p.design_dur - 1, p.build_start + p.build_dur - 1, p.sales_start + p.sales_dur - 1) + 1;
  const z = () => new Array(N + 1).fill(0);
  const even = (start, dur, total) => { const a = z(); for (let m = start; m < start + dur && m <= N; m++) a[m] = total / dur; return a; };
  const bell = (start, dur, total) => {
    const a = z(); let s = 0;
    for (let i = 0; i < dur; i++) s += Math.sin(Math.PI * (i + 0.5) / dur);
    for (let i = 0; i < dur && start + i <= N; i++) a[start + i] = total * Math.sin(Math.PI * (i + 0.5) / dur) / s;
    return a;
  };
  const v = p.vat / 100;
  const revH = z(), revC = z(), revP = z();
  for (let m = p.sales_start; m < p.sales_start + p.sales_dur; m++) {
    const g = Math.pow(1 + p.growth / 100, (m - p.sales_start) / 12) * kP / p.sales_dur;
    revH[m] = p.area_sale * p.price * g;
    revC[m] = p.area_comm * p.price_comm * g;
    revP[m] = p.parking * p.price_park * g;
  }
  const rev = z().map((_, m) => revH[m] + revC[m] + revP[m]);
  const taxRev = z().map((_, m) => revC[m] + revP[m] + (p.vat_exempt ? 0 : revH[m]));
  const sum = a => a.reduce((s, x) => s + x, 0);
  const totalRev = sum(rev);
  const cat = {
    land: z(), design: even(p.design_start, p.design_dur, p.design * p.area_total),
    smr: bell(p.build_start, p.build_dur, p.smr * kS * p.area_total),
    nets: even(p.build_start, p.build_dur, p.nets * p.area_total)
  };
  cat.land[p.land_m] = p.land;
  cat.supervision = cat.smr.map(x => x * p.supervision / 100);
  cat.reserve = cat.smr.map(x => x * p.reserve / 100);
  cat.marketing = rev.map(x => x * p.marketing / 100);
  cat.admin = even(1, N, totalRev * p.admin / 100);
  const vatable = ["design", "smr", "nets", "supervision", "reserve", "marketing"];
  const share = totalRev ? sum(taxRev) / totalRev : 0;
  const rate = p.rate / 100 / 12, dm = Math.pow(1 + p.discount / 100, 1 / 12) - 1;
  let cash = 0, debt = 0, eqUsed = 0, vatBal = 0, cum = 0, peakDebt = 0, peakNeed = 0, interestT = 0, vatPaidT = 0, outVatT = 0, credT = 0;
  const months = [], eq = z();
  for (let m = 1; m <= N; m++) {
    const cost = Object.keys(cat).reduce((s, k) => s + cat[k][m], 0);
    const inVat = vatable.reduce((s, k) => s + cat[k][m], 0) * v / (1 + v);
    const outVat = taxRev[m] * v / (1 + v);
    outVatT += outVat; credT += inVat * share;
    vatBal += outVat - inVat * share;
    let vatPaid = 0;
    if (vatBal > 0) { vatPaid = vatBal; vatBal = 0; }
    vatPaidT += vatPaid;
    const pre = rev[m] - cost - vatPaid;
    cum += pre; peakNeed = Math.min(peakNeed, cum);
    const interest = debt * rate; interestT += interest;
    cash += pre - interest;
    if (cash < 0) {
      const e = Math.min(-cash, p.equity - eqUsed);
      eqUsed += e; eq[m] -= e; cash += e;
      if (cash < 0) { debt += -cash; cash = 0; }
    } else if (debt > 0) { const r = Math.min(cash, debt); debt -= r; cash -= r; }
    peakDebt = Math.max(peakDebt, debt);
    months.push({ m, rev: rev[m], cost, vat: vatPaid, interest, debt, cum, cat: Object.fromEntries(Object.keys(cat).map(k => [k, cat[k][m]])) });
  }
  const costT = Object.keys(cat).reduce((s, k) => s + sum(cat[k]), 0);
  const revNet = totalRev - outVatT, costNet = costT - credT;
  const pbt = revNet - costNet - interestT;
  const cit = Math.max(0, pbt * p.cit / 100);
  cash -= cit;
  eq[N] += cash - debt;
  const npvAt = r => eq.reduce((s, x, m) => s + x / Math.pow(1 + r, m), 0);
  let irr = null;
  if (eq.some(x => x < 0) && eq.some(x => x > 0)) {
    let lo = -0.99, hi = 1;
    if (npvAt(lo) * npvAt(hi) < 0) {
      for (let i = 0; i < 100; i++) { const mid = (lo + hi) / 2; if (npvAt(lo) * npvAt(mid) <= 0) hi = mid; else lo = mid; }
      irr = Math.pow(1 + (lo + hi) / 2, 12) - 1;
    }
  }
  const byCat = Object.fromEntries(Object.keys(cat).map(k => [k, sum(cat[k])]));
  return {
    N, months, byCat, eq,
    t: { rev: totalRev, revNet, costT, costNet, vatPaid: vatPaidT, interest: interestT, pbt, cit, net: pbt - cit,
      margin: costNet + interestT ? pbt / (costNet + interestT) : 0, irr, npv: npvAt(dm), peakDebt, peakNeed: -peakNeed, eqUsed,
      costM2: (costNet + interestT) / ((p.area_sale + p.area_comm) || 1) }
  };
};
</script>

<script id="xlsx-engine">
// Чтение .xlsx и расчёт формул в браузере — для калькуляторов отделов (ПНР ОРС): цены и формулы остаются в файле отдела,
// портал подставляет данные проекта и считает по формулам файла. Функции: IF, IFS, AND, OR, SUM, AVERAGE, ROUND, ROUNDUP,
// VLOOKUP, ISNUMBER, YEAR, MONTH. Незнакомая функция даёт ошибку #NAME? в своей ячейке, остальной расчёт продолжается.
window.XLSXEngine = (function () {
  const dec = new TextDecoder();
  const xml = s => s.replace(/&(lt|gt|quot|apos|amp|#(\d+)|#x([0-9a-fA-F]+));/g, (m, k, d, h) =>
    d ? String.fromCodePoint(+d) : h ? String.fromCodePoint(parseInt(h, 16)) : { lt: "<", gt: ">", quot: '"', apos: "'", amp: "&" }[k]);
  // Защита от «zip-бомбы»: часть файла после распаковки не больше 500 МБ (больше браузер всё равно не прочитает как текст).
  const MAX_UNZIP = 500 * 1048576;
  async function inflate(data) {
    const r = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader(), parts = [];
    let n = 0;
    for (;;) {
      const { done, value } = await r.read();
      if (done) break;
      n += value.length;
      if (n > MAX_UNZIP) { r.cancel(); throw new Error("файл слишком большой после распаковки"); }
      parts.push(value);
    }
    const out = new Uint8Array(n); let o = 0;
    parts.forEach(x => { out.set(x, o); o += x.length; });
    return out;
  }
  async function unzip(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength), files = {};
    let e = u8.length - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("Это не файл Excel (.xlsx)");
    let p = dv.getUint32(e + 16, true);
    const n = dv.getUint16(e + 10, true);
    for (let i = 0; i < n; i++) {
      const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true),
        el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
      const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
      files[name] = { method, data: u8.subarray(start, start + size) };
      p += 46 + nl + el + cl;
    }
    return async name => { const f = files[name]; if (!f) return null; return dec.decode(f.method === 0 ? f.data : await inflate(f.data)); };
  }
  // --- адреса ---
  const colNum = s => s.split("").reduce((a, c) => a * 26 + c.charCodeAt(0) - 64, 0);
  const colStr = n => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };
  const SHEET = "(?:'((?:[^']|'')+)'|([A-Za-zА-Яа-яЁё_][\\wА-Яа-яЁё.]*))!";
  const REF_RE = new RegExp("(" + SHEET + ")?(?:(\\$?)([A-Z]{1,3})(\\$?)(\\d+)(?::(\\$?)([A-Z]{1,3})(\\$?)(\\d+))?|(\\$?)([A-Z]{1,3}):(\\$?)([A-Z]{1,3}))(?![\\w(])", "y");
  // Сдвиг относительных ссылок общей (shared) формулы на dr строк и dc колонок.

    [/^Заполните в карточке проекта: (.+)\. Эти данные подставятся автоматически\. Остальные поля в квадратных скобках заполните вручную\.$/, m => "Жоба карточкасында толтырыңыз: " + trFields(m[1]) + ". Бұл деректер автоматты түрде қойылады. Шаршы жақшадағы қалған өрістерді қолмен толтырыңыз."],
    [/^Этап пройден! Открыто: (.+)$/, m => "Кезең өтті! Ашылды: " + trList(m[1])],
    [/^Загружаю «(.+)»…$/, m => "«" + m[1] + "» жүктелуде…"],
    [/^Сбросить отметки, назначения и досрочные старты\? Карточка проекта, финмодель, бюджет и реестр сроков останутся\.$/, () => "Белгілерді, тағайындауларды және мерзімінен бұрын бастауларды тастау керек пе? Жоба карточкасы, қаржы моделі, бюджет және мерзімдер тізілімі сақталады."],
    [/^Да, сбросить$/, () => "Иә, тастау"],
    [/^\+(\d+) пунктов? для региона$/, m => "Өңір үшін +" + m[1] + " тармақ"],
  ];

  const CYR = /[А-Яа-яЁё]/;
  function translate(s) {
    if (!CYR.test(s)) return null;
    const lead = s.match(/^\s*/)[0], trail = s.match(/\s*$/)[0];
    const core = s.slice(lead.length, s.length - trail.length);
    if (!core) return null;
    if (D.has(core)) return lead + D.get(core) + trail;
    for (let i = 0; i < P.length; i++) {
      const m = core.match(P[i][0]);
      if (m) { const res = P[i][1](m); if (res != null) return lead + res + trail; }
    }
    // «Имя: действие» в истории этапа: переводим часть после двоеточия
    if (core.indexOf(": ") === 0) { const rest = translate(core.slice(2)); if (rest != null) return lead + ": " + rest + trail; }
    // Список этапов «01 · Название, 02 · Название»
    if (/^\d\d · /.test(core) && core.indexOf(", ") > 0) {
      const parts = core.split(", ");
      if (parts.every(x => /^\d\d · ./.test(x))) return lead + parts.map(x => x.slice(0, 5) + tr(x.slice(5))).join(", ") + trail;
    }
    // Части через « · » и «подпись: значение»
    if (core.indexOf(" · ") > 0 || core.indexOf("· ") === 0) {
      const parts = core.split(/( ?· )/);
      let changed = false;
      const outp = parts.map(x => { if (/^ ?· $/.test(x) || !CYR.test(x)) return x; const t = translate(x); if (t != null) { changed = true; return t; } return x; });
      if (changed) return lead + outp.join("") + trail;
    }
    const kv = core.match(/^([^:]{2,60}): (.+)$/);
    if (kv && D.has(kv[1])) return lead + D.get(kv[1]) + ": " + (D.has(kv[2]) ? D.get(kv[2]) : kv[2]) + trail;
    return null;
  }

  const SKIP = "script,style,title,textarea,pre,[data-noi18n]";
  const ATTRS = ["placeholder", "title", "aria-label"];
  const origText = new WeakMap(), outText = new WeakMap(), origAttr = new WeakMap();
  function procText(node) {
    const p = node.parentElement;
    if (!p || p.closest(SKIP)) return;
    const cur = node.nodeValue;
    if (outText.get(node) === cur) return;
    const res = translate(cur);
    if (res != null && res !== cur) { origText.set(node, cur); outText.set(node, res); node.nodeValue = res; }
  }
  function procAttr(el, a) {
    if (!el.hasAttribute(a) || (el.parentElement && el.parentElement.closest(SKIP)) || el.matches("script,style,title,pre,[data-noi18n]")) return;
    const store = origAttr.get(el) || {};
    const cur = el.getAttribute(a);
    if (store[a] && store[a].out === cur) return;
    const res = translate(cur);
    if (res != null && res !== cur) { store[a] = { orig: cur, out: res }; origAttr.set(el, store); el.setAttribute(a, res); }
  }
  function walk(root) {
    if (root.nodeType === 3) { procText(root); return; }
    if (root.nodeType !== 1) return;
    if (root.matches && root.matches(SKIP)) return;
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n; while ((n = tw.nextNode())) procText(n);
    ATTRS.forEach(a => { if (root.hasAttribute && root.hasAttribute(a)) procAttr(root, a); root.querySelectorAll("[" + a + "]").forEach(el => procAttr(el, a)); });
  }
  function restore(root) {
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = tw.nextNode())) {
      if (origText.has(n) && outText.get(n) === n.nodeValue) n.nodeValue = origText.get(n);
      origText.delete(n); outText.delete(n);
    }
    ATTRS.forEach(a => root.querySelectorAll("[" + a + "]").forEach(el => {
      const st = origAttr.get(el);
      if (st && st[a] && st[a].out === el.getAttribute(a)) el.setAttribute(a, st[a].orig);
    }));
  }
  // Переводится весь портал: встроенная дорожная карта (свой корень) и страницы портала со всплывающими окнами.
  const roots = () => window.ZHK_ROOT ? [window.ZHK_ROOT, document.querySelector(".app"), document.getElementById("layer")].filter(Boolean) : [document.body];
  const obs = new MutationObserver(muts => {
    if (lang !== "kk") return;
    muts.forEach(m => {
      if (m.type === "childList") m.addedNodes.forEach(walk);
      else if (m.type === "characterData") procText(m.target);
      else if (m.type === "attributes") procAttr(m.target, m.attributeName);
    });
  });

  return {
    lang: () => lang,
    start() {
      roots().forEach(r => obs.observe(r, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS }));
      document.documentElement.lang = lang === "kk" ? "kk" : "ru";
      if (lang === "kk") roots().forEach(walk);
    },
    set(l) {
      lang = l === "kk" ? "kk" : "ru";
      try { localStorage.setItem("zhk-lang", lang); } catch (e) {}
      document.documentElement.lang = lang;
      roots().forEach(r => { if (lang === "kk") walk(r); else restore(r); });
    },
    t: s => lang === "kk" ? (translate(s) || s) : s,
    tplTitle: (id, ru) => lang === "kk" && KK.templates[id] && KK.templates[id].title ? KK.templates[id].title : ru,
    tplBody: (id, ru) => lang === "kk" && KK.templates[id] && KK.templates[id].body ? KK.templates[id].body : ru,
    disclaimer: ru => lang === "kk" ? KK.disclaimer : ru,
    fieldBlank: (id, ru) => {
      if (lang !== "kk") return ru;
      const f = KK.fields[id];
      return ru === "___" ? ru : (f ? f.label : ru);
    }
  };
})();
</script>

<script id="zhk-app">
// Приложение дорожной карты. Портал запускает его при первом открытии раздела и передаёт document изолированного блока.
window.ZHK_BOOT = function (document) {
(function () {
  const T = window.TREE;
  const byId = Object.fromEntries(T.nodes.map(n => [n.id, n]));
  const children = Object.fromEntries(T.nodes.map(n => [n.id, []]));
  T.nodes.forEach(n => n.req.forEach(r => children[r].push(n.id)));
  const fieldLabel = Object.fromEntries(T.fields.map(f => [f.id, f.label]));
  const fieldBlank = Object.fromEntries(T.fields.map(f => [f.id, f.blank || f.label]));
  T.nodes.forEach(n => { n.baseTasks = n.tasks.slice(); });
  const totalTasks = () => T.nodes.reduce((s, n) => s + n.tasks.length, 0);
  const REG = window.REGIONS, L = window.I18N;
  let regionApplied = null;
  // Региональные пункты добавляются в конец этапа со своими ключами (survey.s1), чтобы смена региона не путала отметки.
  function applyRegion() {
    const reg = (S && S.project && REG[S.project.region]) ? S.project.region : "";
    if (reg === regionApplied) return;
    regionApplied = reg;
    T.nodes.forEach(n => {
      const extra = reg ? (REG[reg].tasks[n.id] || []) : [];
      n.tasks = n.baseTasks.concat(extra.map(t => t.ru));
      n.keyIds = n.baseTasks.map((_, i) => String(i)).concat(extra.map(t => t.id));
    });
  }
  const XP_PER_TASK = 10;
  const RANKS = [[0, "Стажёр"], [1, "Аналитик"], [4, "Девелопер"], [8, "Застройщик"], [13, "Генеральный застройщик"], [21, "Магнат ЖК"]];
  const STATUS = { locked: "Закрыт", open: "Доступен", active: "В работе", risk: "Начат с риском", done: "Пройден" };
  const LOCAL_KEY = "zhk-skill-tree-v2", LEGACY_KEY = "zhk-skill-tree-v1";
  const KEYS = ["checked", "meta", "early", "project", "model", "budget", "deadlines", "sched", "vars", "baseline", "risks", "team", "partners", "blocks", "b0", "pnr", "pnrCalc", "smeta", "scenarios", "chess", "plans", "planRooms"];
  const VIEWS = ["tree", "gantt", "model", "budget", "deadlines", "projects"];

  // S — всё состояние проекта, хранится одним документом.
  let S;
  let selected = null, view = "tree";
  let docRef = null, docExists = false, readOnly = false;
  let downloads = null;
  const openEdits = new Set();
  let earlyFormFor = null;
  let dbCap = null, userCap = null, assetsCap = null, meId = null;
  const names = {};
  let attDel = null, pendingAttKey = null;
  const PROJ_IDS = "zhk-project-ids", CUR_PROJ = "zhk-current-project";
  let curProject = "main", projects = null, canAdmin = true;
  try { curProject = localStorage.getItem(CUR_PROJ) || "main"; } catch (e) {}

  // --- helpers ------------------------------------------------------------
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  function merge(t, p) {
    Object.keys(p).forEach(k => {
      if (isObj(p[k]) && isObj(t[k])) merge(t[k], p[k]);
      else t[k] = isObj(p[k]) ? JSON.parse(JSON.stringify(p[k])) : p[k];
    });
  }
  function normalize(d) {
    d = isObj(d) ? JSON.parse(JSON.stringify(d)) : {};

  }

    const d = new Date();

  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const NF = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
  const num = n => NF.format(Math.round(n || 0)).replace(/[  ]/g, " ");
  const money = n => num(n) + " тг";
  const dec = (x, d) => x.toFixed(d).replace(".", ",");

  function parseNum(s) {
    if (s == null) return null;
    const t = String(s).replace(/[\s  ]/g, "").replace(",", ".");
    if (t === "") return null;
    const v = Number(t);
    return isFinite(v) ? v : null;
  }
  const newId = () => "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // --- storage ------------------------------------------------------------
  // Основной проект хранится под старым ключом, остальные — под ключом с id проекта.
  const localKey = id => id === "main" ? LOCAL_KEY : LOCAL_KEY + "-" + id;

  }
  // Вне claude.ai (например, на GitHub Pages) файлы сохраняются обычной ссылкой на скачивание.
  const blobSaver = { save: async ({ filename, data }) => {

          catch (e2) {

              readOnly = true; setSync("local", "Только просмотр: изменения не сохраняются"); renderAll(); return;
            }
          }
        }
        setSync("local", "Нет связи с хранилищем, прогресс сохранён в браузере");
      }
    });
  }
  // Запись в конкретный проект: нужна, когда между действием и записью было ожидание (загрузка файла).
  function writeTo(proj, patch) {
    if (proj === curProject) { commit(patch); return; }
    if (readOnly) return;
    if (dbCap) { const ref = dbCap.doc("progress/" + proj); writeChain = writeChain.then(() => ref.update(patch).catch(() => {})); return; }
    const d = loadLocal(proj); merge(d, patch);
    try { localStorage.setItem(localKey(proj), JSON.stringify(d)); } catch (e) {}
  }
  function commit(patch, opts) {
    trackVars(patch);
    merge(S, patch); saveLocal(); write(patch);
    if (opts && opts.defer) {
      // Фокус ещё переходит на следующее поле: перерисуем поля ввода, когда он устроится.
      renderChrome(); setTimeout(() => { renderPanel(); renderView(); }, 0);
    } else renderAll();
  }

  async function connect() {
    const use = window.claude && window.claude.use;
    if (!use) { downloads = blobSaver; setSync("local", "Прогресс сохраняется в этом браузере"); renderAll(); return; }
    try { downloads = await use("downloads"); } catch (e) { downloads = null; }
    try { assetsCap = await use("assets"); } catch (e) { assetsCap = null; }
    try { userCap = await use("user"); meId = userCap ? await userCap.id() : null; } catch (e) { userCap = null; meId = null; }
    try { canAdmin = userCap ? (await userCap.canEdit()) !== false : true; } catch (e) { canAdmin = true; }
    let db = null;
    try { db = await use("db"); } catch (e) { db = null; }
    if (!db) { setSync("local", "Прогресс сохраняется в этом браузере"); renderAll(); return; }
    dbCap = db;
    docRef = db.doc("progress/" + curProject);
    setSync("pending", "Синхронизация…");
    // Каждый проект — отдельный документ коллекции progress; основной проект — progress/main.
    db.collection("progress").onSnapshot(q => {
      const map = {};
      q.docs.forEach(d => { map[d.id] = d.data(); });
      projects = map;
      if (curProject !== "main" && !map[curProject]) {
        curProject = "main"; try { localStorage.setItem(CUR_PROJ, "main"); } catch (e) {}
        docRef = db.doc("progress/main"); achSeen = null;
      }
      const data = map[curProject];
      docExists = !!data;
      if (!data && hasData() && curProject === "main") {
        // Первый запуск общего хранилища: переносим локальный прогресс.
        write({});
      } else {
        S = normalize(data || {});
        saveLocal();
      }
      regionApplied = null;
      setSync("shared", readOnly ? "Только просмотр" : "Общий прогресс команды сохраняется");
      renderAll(); renderProjSel();
    }, () => setSync("local", "Нет связи с хранилищем, прогресс сохранён в браузере"));
  }

  // --- guarded rendering --------------------------------------------------
  // Не перерисовываем блок с полями ввода, пока в нём фокус или идёт клик: иначе пропадёт ввод или клик.
  let pointerDown = false;
  const dirty = new Map();
  function busyIn(el) {
    const a = document.activeElement;
    return !!a && el.contains(a) && (a.tagName === "TEXTAREA" || a.tagName === "SELECT" || (a.tagName === "INPUT" && a.type !== "checkbox"));
  }
  function guarded(el, fn) {
    const run = force => {
      if (!force && (busyIn(el) || pointerDown)) { dirty.set(run, true); return; }
