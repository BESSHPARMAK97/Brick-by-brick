      const actions = readOnly ? "" : dlConfirmDelete === d.id
        ? '<button class="btn" type="button" data-dl-del-yes="' + d.id + '">Удалить</button><button class="btn ghost" type="button" data-dl-del-no>Отмена</button>'
        : '<button class="btn ghost" type="button" data-dl-edit="' + d.id + '">Изменить</button><button class="btn ghost" type="button" data-dl-del="' + d.id + '">Удалить</button>';
      return "<tr><td><div class=\"dl-title\">" + esc(d.title) + "</div>" + (d.num || d.note ? '<div class="dl-sub">' + esc([d.num ? "№ " + d.num : "", d.note].filter(Boolean).join(" · ")) + "</div>" : "") + "</td>" +
        "<td>" + (st ? '<button class="chip" type="button" data-open-stage="' + st.id + '" data-state="' + stateOf(st) + '">' + esc(st.code + " · " + st.name) + "</button>" : '<span class="muted">—</span>') + "</td>" +

  document.getElementById("dl-csv").addEventListener("click", () => {
    const lines = ["Документ;Номер;Этап;Выдан;Действует до;Статус;Ответственный;Примечание"].concat(deadlineList().map(d =>
      [d.title, d.num, d.stage && byId[d.stage] ? byId[d.stage].name : "", fmt(d.issued), fmt(d.expires), dlStatus(d).text, d.owner, d.note].map(x => String(x || "").replace(/;/g, ",")).join(";")));
    save(fileName({ title: "Реестр сроков документов" }, "csv"), "﻿" + lines.join("\r\n"));

  // --- schedule (Gantt, critical path) -----------------------------------
  // Плановые длительности этапов в месяцах. Продажи по ДДУ идут весь срок стройки, в графике это месяц запуска.
  const DUR = { idea: 2, land: 3, ird: 2, survey: 1.5, sketch: 2, finance: 4, psd: 4, expert: 2, tender: 1.5, dolevka: 1, start: 1, zero: 4, nets: 12, frame: 11, envelope: 6, mep: 8, finish: 6, commission: 1.5, handover: 2, warranty: 24 };
  const KEYS_END = "handover";
  const ganttEl = document.getElementById("view-gantt");
  const thisMonth = () => today().slice(0, 7);
  const schedStart = () => (S.sched && /^\d{4}-\d{2}$/.test(S.sched.start || "")) ? S.sched.start : thisMonth();
  const durOf = id => { const v = S.sched && S.sched.dur && S.sched.dur[id]; return typeof v === "number" && v >= 0 ? v : DUR[id]; };
  const monthsFrom = (ym, iso) => { const y1 = +ym.slice(0, 4), m1 = +ym.slice(5, 7), y2 = +iso.slice(0, 4), m2 = +iso.slice(5, 7), d = +(iso.slice(8, 10) || 1); return (y2 - y1) * 12 + (m2 - m1) + (d - 1) / 30; };
  const ymAdd = (ym, m) => { const t = +ym.slice(0, 4) * 12 + (+ym.slice(5, 7) - 1) + Math.floor(m); return String(Math.floor(t / 12)) + "-" + String(t % 12 + 1).padStart(2, "0"); };
  const ymFmt = ym => ym.slice(5, 7) + "." + ym.slice(0, 4);
  const mdec = x => dec(Math.round(x * 10) / 10, Math.abs(x - Math.round(x)) < 0.05 ? 0 : 1);
  function topo() {
    const out = [], seen = {};
    const visit = n => { if (seen[n.id]) return; seen[n.id] = true; n.req.forEach(r => visit(byId[r])); out.push(n); };
    T.nodes.forEach(visit);
    return out;
  }
  function schedule() {
    const order = topo(), start = schedStart(), now = monthsFrom(start, today());
    const P = {};
    order.forEach(n => {
      const es = n.req.length ? Math.max(...n.req.map(r => P[r].ef)) : 0;
      P[n.id] = { es, ef: es + durOf(n.id), dur: durOf(n.id) };
    });
    const end = P[KEYS_END].ef;
    // Обратный проход: всё, что не ведёт к ключам (гарантия), в критический путь не входит.
    [...order].reverse().forEach(n => {
      const succ = children[n.id].filter(c => c !== "warranty");
      const lf = n.id === "warranty" ? P[n.id].ef : succ.length ? Math.min(...succ.map(c => P[c].ls)) : end;
      P[n.id].lf = lf; P[n.id].ls = lf - P[n.id].dur; P[n.id].slack = Math.max(0, P[n.id].ls - P[n.id].es);
      P[n.id].critical = n.id !== "warranty" && P[n.id].slack < 0.05;
    });
    // Прогноз: завершённый этап кончается по дате последней отметки, просроченный сдвигает всё, что после него.
    order.forEach(n => {
      const p = P[n.id], frac = n.tasks.length ? doneCount(n) / n.tasks.length : 0;
      const fs = Math.max(p.es, ...n.req.map(r => P[r].fe));
      if (isDone(n)) {
        const dates = n.tasks.map((_, i) => metaOf(key(n, i)).doneAt).filter(Boolean).sort();
        p.fe = dates.length ? Math.max(monthsFrom(start, dates[dates.length - 1]), fs) : fs + p.dur;
        p.actual = !!dates.length;
      } else {
        p.fe = now > fs ? Math.max(fs + p.dur, now + p.dur * (1 - frac)) : fs + p.dur;
      }
      p.fs = fs; p.frac = frac;
      p.late = !isDone(n) && now > p.ef + 0.05;
    });
    return { P, order, start, now, end, fend: P[KEYS_END].fe };
  }

  const renderGantt = guarded(ganttEl, function () {
    const G = schedule(), P = G.P;
    const total = Math.ceil(Math.max(P.warranty.ef, P.warranty.fe, G.now + 1, 1)) + 1;
    const W = 22;
    const crit = T.nodes.filter(n => P[n.id].critical);
    const blocking = crit.filter(n => !isDone(n));
    const delay = G.fend - G.end;
    const ticks = [];
    for (let m = 0; m <= total; m++) {
      const ym = ymAdd(G.start, m);
      if (ym.slice(5, 7) === "01" || m === 0) ticks.push('<span class="g-year" style="left:' + (m * W) + 'px">' + ym.slice(0, 4) + "</span>");
      if (m % 3 === 0) ticks.push('<span class="g-tick" style="left:' + (m * W) + 'px">' + ym.slice(5, 7) + "</span>");
    }
    const grid = [];
    for (let m = 0; m <= total; m++) if (ymAdd(G.start, m).slice(5, 7) === "01") grid.push('<i class="g-ygrid" style="left:' + (m * W) + 'px"></i>');
    const nowLine = G.now >= 0 && G.now <= total ? '<i class="g-now" style="left:' + (G.now * W) + 'px" title="Сегодня"></i>' : "";
    const rows = T.nodes.map(n => {
      const p = P[n.id], st = stateOf(n);
      const cls = "g-bar" + (p.critical ? " crit" : "") + (st === "done" ? " done" : "") + (n.id === "warranty" ? " tail" : "");
      const shift = p.fe - p.ef;
      const ext = shift > 0.25 && !isDone(n) ? '<span class="g-late" style="left:' + (p.ef * W) + "px;width:" + (shift * W) + 'px" title="Прогноз: +' + mdec(shift) + ' мес."></span>' : "";
      const slack = p.slack > 0.05 && n.id !== "warranty" ? '<span class="g-slack" style="left:' + (p.ef * W) + "px;width:" + (p.slack * W) + 'px" title="Резерв ' + mdec(p.slack) + ' мес."></span>' : "";
      return '<div class="g-row"><div class="g-label"><button class="linkbtn' + (p.late ? " g-late-name" : "") + '" type="button" data-open-stage="' + n.id + '"' + (p.late ? ' title="Срок этапа по плану прошёл"' : "") + '><span class="mono">' + n.code + "</span> " + esc(n.name) + "</button>" +
        '<span class="g-dur"><input class="tin" type="text" inputmode="decimal" aria-label="Длительность, мес.: ' + esc(n.name) + '" data-gdur="' + n.id + '" value="' + mdec(p.dur) + '"' + (readOnly ? " disabled" : "") + "><span>мес.</span></span></div>" +
        '<div class="g-track" style="width:' + (total * W) + 'px">' + slack + ext +
        '<span class="' + cls + '" style="left:' + (p.es * W) + "px;width:" + Math.max(p.dur * W, 3) + 'px" title="' + esc(n.name) + ": " + ymFmt(ymAdd(G.start, p.es)) + " – " + ymFmt(ymAdd(G.start, Math.max(p.ef - 0.01, p.es))) + '"><i style="width:' + Math.round(p.frac * 100) + '%"></i></span>' +
        "</div></div>";
    }).join("");
    const kpi = (label, value, tone) => '<div class="kpi"' + (tone ? ' data-tone="' + tone + '"' : "") + "><span>" + label + "</span><b>" + value + "</b></div>";
    ganttEl.innerHTML =
      '<div class="kpis">' +
        kpi("Старт проекта", ymFmt(G.start)) +
        kpi("Ключи по плану", ymFmt(ymAdd(G.start, G.end))) +
        kpi("Ключи по прогнозу", ymFmt(ymAdd(G.start, G.fend)), delay > 0.25 ? "bad" : "good") +
        kpi("До ключей", mdec(G.end) + " мес.") +
        kpi("Отставание", delay > 0.25 ? "+" + mdec(delay) + " мес." : "нет", delay > 0.25 ? "bad" : "good") +
      "</div>" +
      '<div class="card"><div class="section-title"><h2 class="view-title">График строительства</h2>' +
        '<div class="row"><label class="field" for="g-start" style="grid-auto-flow:column;align-items:center;gap:8px"><span>Старт</span><input type="month" id="g-start" class="sel" value="' + G.start + '"' + (readOnly ? " disabled" : "") + "></label>" +
        (readOnly ? "" : '<button class="btn ghost" type="button" id="g-reset">Типовые длительности</button>') + "</div></div>" +
        '<p class="muted">График строится из связей дерева: этап начинается, когда закончены все этапы, которые он требует. Красные этапы лежат на критическом пути: если любой из них задержится, сдвинутся ключи. Длительности можно менять, план пересчитается сразу.</p>' +
        (blocking.length ? '<p class="g-crit"><b>Сдачу сейчас определяют:</b> ' + blocking.slice(0, 6).map(n => '<button class="chip" type="button" data-open-stage="' + n.id + '" data-state="' + stateOf(n) + '">' + esc(n.code + " · " + n.name) + "</button>").join(" ") + "</p>" : "") +
        '<div class="g-legend"><span><i class="lg-crit"></i>Критический путь</span><span><i class="lg-bar"></i>Есть резерв</span><span><i class="lg-slack"></i>Резерв времени</span><span><i class="lg-late"></i>Прогноз сдвига</span><span><i class="lg-done"></i>Пройден</span><span><i class="lg-now"></i>Сегодня</span></div>' +
        '<div class="g-wrap"><div class="g-inner" style="min-width:' + (300 + total * W) + 'px"><div class="g-row g-head"><div class="g-label"></div><div class="g-track g-axis" style="width:' + (total * W) + 'px">' + ticks.join("") + "</div></div>" +
        '<div class="g-body">' + rows + '<div class="g-overlay" style="left:300px;width:' + (total * W) + 'px">' + grid.join("") + nowLine + "</div></div></div></div>" +
        '<p class="muted" style="margin-top:10px">Прогноз: пройденный этап заканчивается по дате последней отметки, незавершённый этап, у которого вышел срок, сдвигает все последующие. Гарантия идёт после ключей и в критический путь не входит.</p></div>';
  });
  ganttEl.addEventListener("change", e => {
    const el = e.target;
    if (el.id === "g-start" && /^\d{4}-\d{2}$/.test(el.value)) {
      commit({ sched: { start: el.value } }, { defer: true });
      return;
    }
    const id = el.dataset.gdur;
    if (!id) return;
    const v = parseNum(el.value);
    if (v == null || v < 0 || v > 120) { toast("Введите длительность в месяцах, от 0 до 120"); el.value = mdec(durOf(id)); return; }
    const val = Math.round(v * 4) / 4;
    if (val === durOf(id)) { el.value = mdec(val); return; }
    commit({ sched: { dur: { [id]: val } } }, { defer: true });
  });
  ganttEl.addEventListener("click", e => {
    const os = e.target.closest("[data-open-stage]");
    if (os) { setView("tree", false); select(os.dataset.openStage, true); return; }
    if (e.target.id === "g-reset") {
      const patch = {};
      Object.keys((S.sched && S.sched.dur) || {}).forEach(k => { patch[k] = null; });
      if (S.sched) S.sched.dur = {};
      commit({ sched: { dur: patch } });
      toast("Возвращены типовые длительности");
    }
  });

  // --- projects (portfolio) ----------------------------------------------
  const portEl = document.getElementById("view-projects");
  const projSel = document.getElementById("proj-sel");
  let projDel = null;
  function projectIds() {
    const ids = dbCap ? ["main"].concat(Object.keys(projects || {}).filter(x => x !== "main")) : localIds();
    if (ids.indexOf(curProject) < 0) ids.push(curProject);
    return ids;
  }
  function projData(id) { return id === curProject ? S : normalize(dbCap ? (projects && projects[id]) || {} : loadLocal(id)); }
  function projName(id) { const d = projData(id); return (d.project && d.project.name) || (id === "main" ? "Основной проект" : "Без названия"); }
  function renderProjSel() {
    const ids = projectIds();
    projSel.innerHTML = ids.map(id => '<option value="' + id + '"' + (id === curProject ? " selected" : "") + ">" + esc(projName(id)) + "</option>").join("") +
      '<option value="__all">Все проекты…</option>';
  }
  projSel.addEventListener("change", () => {
    const v = projSel.value;
    if (v === "__all") { renderProjSel(); setView("projects", true); return; }
    switchProject(v);
  });
  function switchProject(id) {
    if (id === curProject) return;
    curProject = id;
    try { localStorage.setItem(CUR_PROJ, id); } catch (e) {}
    if (dbCap) { docRef = dbCap.doc("progress/" + id); const data = projects && projects[id]; docExists = !!data; S = normalize(data || {}); }
    else S = loadLocal(id);
    regionApplied = null; openEdits.clear(); earlyFormFor = null; attDel = null; achSeen = null;
    applyRegion();
    selected = firstQuest();
    renderAll(); renderProjSel();
    toast("Открыт проект «" + projName(id) + "»");
  }
  async function createProject(name) {
    const id = "p" + Date.now().toString(36);
    const init = normalize({ project: { name } });
    if (dbCap) {
      try { await dbCap.doc("progress/" + id).set(init); } catch (e) { toast("Не удалось создать проект"); return; }
      projects = Object.assign({}, projects, { [id]: init });
    } else {
      try {
        localStorage.setItem(localKey(id), JSON.stringify(init));
        localStorage.setItem(PROJ_IDS, JSON.stringify(localIds().filter(x => x !== "main").concat(id)));
      } catch (e) {}
    }
    switchProject(id);
  }
  async function deleteProject(id) {
    if (id === "main") { toast("Основной проект удалить нельзя."); return; }
    if (!canAdmin) { toast("Удалять проекты могут только редакторы страницы"); return; }
    if (dbCap) {
      try { await dbCap.doc("progress/" + id).delete(); } catch (e) { toast("Не удалось удалить проект"); return; }
      if (projects) { const c = Object.assign({}, projects); delete c[id]; projects = c; }
    } else {
      try { localStorage.removeItem(localKey(id)); localStorage.setItem(PROJ_IDS, JSON.stringify(localIds().filter(x => x !== "main" && x !== id))); } catch (e) {}
    }
    if (id === curProject) switchProject("main"); else { renderProjSel(); renderPortfolio(true); }
    toast("Проект удалён");
  }
  // Метрики чужого проекта считаем теми же функциями, временно подставив его данные.
  function withState(data, fn) {
    const saved = S;
    S = normalize(data); regionApplied = null; applyRegion();
    try { return fn(); } finally { S = saved; regionApplied = null; applyRegion(); }
  }
  function projMetrics() {
    const tasksDone = T.nodes.reduce((s, n) => s + doneCount(n), 0), G = schedule(), bt = budgetTotals();
    return { ready: tasksDone / totalTasks(), stages: T.nodes.filter(isDone).length, keys: ymFmt(ymAdd(G.start, G.fend)), delay: G.fend - G.end,
      budget: bt.plan ? bt.fact / bt.plan : null,
      city: S.project.city || "", region: S.project.region && REG[S.project.region] ? REG[S.project.region].ru.name : "" };
  }
  const renderPortfolio = guarded(portEl, function () {
    const ids = projectIds();
    const rows = ids.map(id => ({ id, name: projName(id), m: id === curProject ? projMetrics() : withState(projData(id), projMetrics) }));
    const avg = rows.reduce((s, r) => s + r.m.ready, 0) / (rows.length || 1);
    const lateN = rows.filter(r => r.m.delay > 0.25).length;
    const tr = rows.map(r => {
      const cur = r.id === curProject;
      const act = cur ? '<span class="mchip" data-tone="ok">Открыт</span>' : '<button class="btn" type="button" data-proj-open="' + r.id + '">Открыть</button>';
      const del = r.id === "main" || readOnly || !canAdmin ? "" : projDel === r.id
        ? '<button class="btn" type="button" data-proj-del-yes="' + r.id + '">Да, удалить</button><button class="btn ghost" type="button" data-proj-del-no>Отмена</button>'
        : '<button class="btn ghost" type="button" data-proj-del="' + r.id + '">Удалить</button>';
      return "<tr" + (cur ? ' class="cur"' : "") + '><td><div class="dl-title">' + esc(r.name) + "</div>" + (r.m.city ? '<div class="dl-sub">' + esc(r.m.city) + "</div>" : "") + "</td>" +
        "<td>" + (r.m.region ? esc(r.m.region) : '<span class="muted">—</span>') + "</td>" +
        '<td><div class="rep-bar" style="grid-template-columns:minmax(60px,1fr) 44px"><div class="meter"><i style="width:' + Math.round(r.m.ready * 100) + '%"></i></div><span class="mono">' + pct(r.m.ready) + "</span></div></td>" +
        '<td class="num">' + r.m.stages + " / " + T.nodes.length + '</td><td class="num">' + r.m.keys + "</td>" +
        '<td class="num dev" data-tone="' + (r.m.delay > 0.25 ? "bad" : "good") + '">' + (r.m.delay > 0.25 ? "+" + mdec(r.m.delay) + " мес." : "нет") + "</td>" +
        '<td class="num">' + (r.m.budget == null ? "—" : pct(r.m.budget)) + "</td>" +
        '<td><div class="row" style="flex-wrap:nowrap">' + act + del + "</div></td></tr>";
    }).join("");
    portEl.innerHTML =
      '<div class="kpis">' +
        '<div class="kpi"><span>Проектов</span><b>' + rows.length + "</b></div>" +
        '<div class="kpi"><span>Средняя готовность</span><b>' + pct(avg) + "</b></div>" +
        '<div class="kpi" data-tone="' + (lateN ? "bad" : "good") + '"><span>С отставанием</span><b>' + lateN + "</b></div>" +
      "</div>" +
      '<div class="card"><div class="section-title"><h2 class="view-title">Портфель проектов</h2></div>' +
        '<p class="muted">Каждый проект хранит свои этапы, график, финмодель, бюджет и реестр сроков. Переключайтесь между проектами в шапке или здесь.</p>' +
        (readOnly ? "" : '<form class="row" id="proj-form" style="margin:10px 0" autocomplete="off"><input type="text" id="proj-name" class="sel" maxlength="80" placeholder="Название нового ЖК" aria-label="Название нового ЖК" style="flex:1;min-width:180px"><button class="btn primary" type="submit">Новый проект</button></form>') +
        '<div class="tablewrap"><table class="t"><tr><th>Проект</th><th>Регион</th><th>Готовность</th><th class="num">Этапов</th><th class="num">Ключи (прогноз)</th><th class="num">Отставание</th><th class="num">Бюджет</th><th></th></tr>' + tr + "</table></div></div>";
  });
  portEl.addEventListener("submit", e => {
    if (e.target.id !== "proj-form") return;
    e.preventDefault();
    const name = (document.getElementById("proj-name").value || "").trim();
    if (!name) { toast("Введите название проекта"); return; }
    createProject(name);
  });
  portEl.addEventListener("click", e => {
    const o = e.target.closest("[data-proj-open]");
    if (o) { switchProject(o.dataset.projOpen); setView("tree", true); return; }
    const d = e.target.closest("[data-proj-del]");
    if (d) { projDel = d.dataset.projDel; renderPortfolio(true); return; }
    if (e.target.closest("[data-proj-del-no]")) { projDel = null; renderPortfolio(true); return; }
    const y = e.target.closest("[data-proj-del-yes]");
    if (y) { projDel = null; deleteProject(y.dataset.projDelYes); }
  });

  // --- achievements -------------------------------------------------------
  const ACH = [
    ["first", "Первый шаг", "Отмечен первый пункт чек-листа", c => c.tasksDone >= 1],
    ["land", "Земля наша", "Пройден этап «Земельный участок»", c => isDone(byId.land)],
    ["tu", "Все ТУ на руках", "Пройден этап «АПЗ и техусловия»", c => isDone(byId.ird)],
    ["expert", "Положительное заключение", "Пройдена экспертиза", c => isDone(byId.expert)],
    ["contour", "Контур до ноября", "Этап «Контур здания» закрыт до 1 ноября", c => c.contourMonth > 0 && c.contourMonth <= 10],
    ["keys", "Ключи вручены", "Пройден этап «Передача квартир и ОСИ»", c => isDone(byId.handover)],
    ["magnate", "Магнат ЖК", "Пройдены все 20 этапов", c => T.nodes.every(isDone)],
    ["ontime", "Точно в срок", "Пройдено 5+ этапов, прогноз ключей без отставания", c => c.stages >= 5 && c.delay <= 0.25],
    ["nolate", "Без просрочек", "10+ пунктов со сроками и ни одного просроченного", c => c.dueCount >= 10 && c.late === 0],
    ["budget", "Казначей", "План бюджета задан для 10+ этапов", c => c.planned >= 10],
    ["docs", "Документы под контролем", "5+ документов в реестре сроков, ни одного истёкшего", c => c.docs >= 5 && c.expired === 0],
    ["archive", "Полный архив", "10+ вложений к пунктам чек-листов", c => c.att >= 10],
    ["model", "Финансист", "Финмодель заполнена своими цифрами", c => c.modelKeys >= 5]
  ];
  const achEl = document.getElementById("ach");
  let achSeen = null;
  function achContext() {
    const env = byId.envelope, envDates = isDone(env) ? env.tasks.map((_, i) => metaOf(key(env, i)).doneAt).filter(Boolean).sort() : [];
    const G = schedule();
    let dueCount = 0, att = 0;
    Object.values(S.meta).forEach(m => { if (m && m.due) dueCount++; att += attList(m).length; });
    const dl = deadlineList();
    return {
      tasksDone: T.nodes.reduce((s, n) => s + doneCount(n), 0), stages: T.nodes.filter(isDone).length, delay: G.fend - G.end,
      contourMonth: envDates.length ? +envDates[envDates.length - 1].slice(5, 7) : 0,
      dueCount, late: T.nodes.reduce((s, n) => s + lateCount(n), 0), att,
      planned: budgetRows().filter(r => bOf(r.id).plan > 0).length,
      docs: dl.length, expired: dl.filter(d => dlStatus(d).level === 3).length,
      modelKeys: Object.keys(S.model).filter(k => typeof S.model[k] === "number").length
    };
  }
  function renderAch() {
    const c = achContext(), got = ACH.filter(a => a[3](c)).map(a => a[0]);

  // --- document viewer ----------------------------------------------------
  const viewer = document.getElementById("viewer");
  let currentDoc = null;

  function docText(id) {
    const t = T.templates[id];
    return t.ext === "csv" ? t.body : L.disclaimer(DISCLAIMER) + "\n\n" + fill(L.tplBody(id, t.body));
  }
  function fileName(t, ext) {
    const base = t.title.replace(/[^\p{L}\p{N}\s-]/gu, "").trim().replace(/\s+/g, "_");
    const proj = (S.project.name || "").replace(/[^\p{L}\p{N}\s-]/gu, "").trim().replace(/\s+/g, "_");
    return base + (proj ? "_" + proj : "") + "." + ext;
  }
  function openDoc(id) {
    currentDoc = id;
    const t = T.templates[id];
    const csv = t.ext === "csv";
    const tokens = (t.body.match(/\{\{(\w+)\}\}/g) || []).map(s => s.slice(2, -2));
    const missing = [...new Set(tokens)].filter(f => !(S.project[f] || "").trim());

    document.getElementById("viewer-text").textContent = docText(id);

      : tokens.length && !missing.length
        ? "Данные из карточки проекта уже подставлены. Остальные поля в квадратных скобках заполните вручную."
        : tokens.length
          ? "Заполните в карточке проекта: " + missing.map(f => fieldLabel[f]).join(", ") + ". Эти данные подставятся автоматически. Остальные поля в квадратных скобках заполните вручную."
          : "Поля в квадратных скобках заполните своими данными.";

      const r = document.createRange(); r.selectNodeContents(document.getElementById("viewer-text"));

    if (!downloads) return;

  let toastTimer;

        toast("Прогресс сброшен");

    const n = T.nodes.find(n => stateOf(n) === "active") || T.nodes.find(n => stateOf(n) === "risk") ||

  }

  S = loadLocal();
  applyRegion();
  const langBtn = document.getElementById("lang-toggle");
  const setLangLabel = () => { langBtn.textContent = L.lang() === "kk" ? "Русский" : "Қазақша"; langBtn.setAttribute("aria-label", L.lang() === "kk" ? "Перейти на русский" : "Қазақ тіліне ауысу"); };

  window.ZHK = {

    project: () => S.project,
    setProject: patch => { if (!readOnly) commit({ project: patch }); },
    readOnly: () => readOnly,
    current: () => firstQuest(),
    regions: () => Object.keys(REG).map(id => [id, REG[id].ru.name]),

  };
  connect();
})();
};

  set(k, v) { try { localStorage.setItem("bbb:" + k, JSON.stringify(v)) } catch {} },
};

function pick(o) { const r = {}; KEYS.forEach(k => r[k] = o[k]); return r }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) }
function matches(s, f) {
  for (const k of KEYS) { if (f[k] && s[k] !== ALL && !s[k].includes(f[k])) return false }
  if (f.dir && s.dir !== f.dir) return false;
  if (f.status && s.status !== f.status) return false;
  return true;
}
function done(s) { return s.checks.filter((_, i) => checks[s.code + ":" + i]).length }
function chip(st) { const x = STATUS[st]; return `<span class="chip ${x.c}">${x.t}</span>` }
function relevant() { return STD.filter(s => matches(s, { ...pick(card) })) }

function openStd(code) {
  const s = STD.find(x => x.code === code); if (!s) return;
  const layer = document.getElementById("layer");
  const render = () => {
    const n = done(s);
    layer.innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
      <div class="row between"><span class="mono muted">${s.code} · v${s.ver} · ${s.dir}</span><button class="btn" data-close id="close-std">Закрыть</button></div>
      <div class="stack" style="gap:8px"><h2>${esc(s.name)}</h2><div class="row">${chip(s.status)}${[...new Set([].concat(s.stage === ALL ? ["Все этапы"] : s.stage.map(id => STAGE[id]), s.work === ALL ? [] : s.work))].map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
      ${s.scheme ? `<section class="stack" style="gap:8px"><span class="label">Схема (векторная графика)</span><div class="scheme">${scheme(s.scheme)}</div></section>` : ""}
      <section class="stack" style="gap:4px"><div class="row between"><span class="label">Чек-лист выполнения</span><span class="mono num">${n}/${s.checks.length}</span></div>
        <div class="bar"><i style="width:${n / s.checks.length * 100}%;background:var(--ok)"></i></div>
        <div>${s.checks.map((c, i) => { const id = s.code + ":" + i; return `<label class="check${checks[id] ? " on" : ""}"><input type="checkbox" id="chk-${i}" data-chk="${id}"${checks[id] ? " checked" : ""}><span>${esc(c)}</span></label>` }).join("")}</div>
      </section>
      ${s.nom.length ? `<section class="stack" style="gap:8px"><span class="label">Сметная номенклатура СМР и ТМЦ</span><div class="tbl"><table><thead><tr><th>Тип</th><th>Код</th><th>Наименование</th><th>Ед.</th></tr></thead><tbody>${s.nom.map(r => `<tr><td><span class="tag">${r[0]}</span></td><td class="mono">${r[1]}</td><td>${esc(r[2])}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
      <div class="row"><button class="btn primary" id="agree">Согласовать</button><button class="btn" id="propose">Предложить изменение</button></div>
      <div id="std-msg" class="muted" aria-live="polite"></div>
    </aside>`;
    layer.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
    layer.querySelectorAll("[data-chk]").forEach(b => b.onchange = () => { checks[b.dataset.chk] = b.checked; store.set("checks", checks); if (done(s) === s.checks.length && s.status !== "done") s.status = "done"; render(); });
    layer.querySelector("#agree").onclick = () => { s.status = "agreed"; render(); layer.querySelector("#std-msg").textContent = "Стандарт согласован (в прототипе — до перезагрузки)." };
    layer.querySelector("#propose").onclick = () => { s.status = "changed"; render(); layer.querySelector("#std-msg").textContent = "Изменение отправлено владельцу стандарта, статус «Изменён»." };
  };
  const close = () => { layer.innerHTML = ""; route() };
  render();
  document.getElementById("close-std").focus();
}

  const same = (a, b) => a.toDateString() === b.toDateString();
  return head("Календарь событий", "ГПР ключевых работ, тендеры, комиссии, передача ключей и праздники РК.") + `
  <div class="row">${Object.entries(KIND).map(([k, [t, c]]) => `<button class="typebtn ${c}" aria-pressed="${evKinds.has(k)}" data-kind="${k}">${t}</button>`).join("")}</div>
  ${Object.entries(months).map(([m, evs]) => `<section class="month"><span class="label">${m}</span>${evs.map(([d, k, t]) => `<div class="ev${d < TODAY && !same(d, TODAY) ? " past" : ""}${same(d, TODAY) ? " today" : ""}"><span class="d num">${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}</span><span>${esc(t)}${same(d, TODAY) ? ' <span class="muted">· сегодня</span>' : ""}</span><span class="chip ${KIND[k][1]}">${KIND[k][0]}</span></div>`).join("")}</section>`).join("") || '<div class="empty">Выберите хотя бы один тип событий.</div>'}`;
}

function viewTeam() {
  return head("Команда проекта", "Роли и зоны ответственности. Пустые роли уходят заявкой в HR.") + `<div class="grid g3">${TEAM.map(([role, who, zone]) => `
    <div class="panel person"><div class="ava${who ? "" : " vac"}">${who ? who.split(" ").map(w => w[0]).join("").replace(".", "") : "?"}</div>
    <div class="stack" style="gap:2px;min-width:0"><span class="label">${role}</span><b>${who || "Не назначен"}</b><span class="muted" style="font-size:.88rem">${zone}</span>${who ? "" : '<button class="btn" style="margin-top:6px;align-self:flex-start" data-hr>Заявка в HR</button>'}</div></div>`).join("")}</div>
    <div id="hr-msg" class="muted" aria-live="polite"></div>`;
}

function viewKpi() {
  const K = [
    ["Качество", "12", "открытых замечаний технадзора", "−5 за неделю", "up"],
    ["Безопасность", "86", "дней без инцидентов", "1 нарушение СТ-БиОТ-003", "down"],
    ["Сроки", "+6 дн.", "отклонение от ГПР", "котлован, подъезд 2", "down"],
    ["Финансы", "2,4 млрд ₸", "освоено из 18,6 млрд ₸", "13% бюджета", "up"],
    ["Опер. факт", "640 м³", "бетона за неделю, план 700", "91% плана", "down"],
  ];
  const floors = 12, per = 18;
  let h = `<div class="chess" style="grid-template-columns:34px repeat(${per}, minmax(0,1fr))">`;
  let sold = 0, res = 0;
  for (let f = floors; f >= 1; f--) {
    h += `<div class="fl">${f}</div>`;
    for (let a = 1; a <= per; a++) {
      const v = (f * 7 + a * 13 + (f > 8 ? 5 : 0)) % 10;
      const st = v < 4 ? "sold" : v < 5 ? "res" : "free";
      if (st === "sold") sold++; if (st === "res") res++;
      h += `<button class="cell c-${st}" title="Этаж ${f}, кв. ${(f - 1) * per + a}: ${{ sold: "продано", res: "бронь", free: "свободно" }[st]}">${(f - 1) * per + a}</button>`;
    }
  }
  h += "</div>";
  const total = floors * per;
  return head("Показатели проекта", "Качество, безопасность, сроки, финансы и оперативный факт.") + `
  <div class="grid g5">${K.map(([l, v, d, dl, dir]) => `<div class="panel kpi"><span class="label">${l}</span><div class="big num">${v}</div><div class="muted" style="font-size:.85rem">${d}</div><div class="delta ${dir}">${dl}</div></div>`).join("")}</div>
  <section class="panel stack"><div class="row between"><h2>Поэтажная шахматка</h2><div class="legend"><span><i class="c-sold"></i>Продано <b class="num">${sold}</b></span><span><i class="c-res"></i>Бронь <b class="num">${res}</b></span><span><i class="c-free"></i>Свободно <b class="num">${total - sold - res}</b></span></div></div>
  <div class="chess-wrap">${h}</div><div class="muted" style="font-size:.85rem">Продано ${Math.round(sold / total * 100)}% квартир. Наведите на ячейку, чтобы увидеть номер и статус.</div></section>`;
}

function viewPartners() {
  return head("Партнёры", "Подрядчики, поставщики и финансовые партнёры проекта.") + `<div class="panel tbl"><table><thead><tr><th>Роль</th><th>Организация</th><th>Предмет</th><th>Статус</th></tr></thead><tbody>${PARTNERS.map(([r, o, p, s]) => `<tr><td><b>${r}</b></td><td>${esc(o)}</td><td class="muted">${esc(p)}</td><td>${s === "ok" ? '<span class="chip s-done">Договор</span>' : '<span class="chip s-new">Тендер</span>'}</td></tr>`).join("")}</tbody></table></div>`;
}

// ---------- Маршрутизация и события ----------
function navHtml(v) {
  let g = "";
  const on = VIEWS[v].p || v;
  return Object.entries(VIEWS).filter(([, x]) => !x.p).map(([k, x]) => {
    const n = x.z ? zhkBadge(x.z) : k === "kpi" ? zhkBadge("deadlines") : x.cnt();
    const grp = x.g !== g ? `<span class="nav-g">${(g = x.g)}</span>` : "";
    return `${grp}<a href="#${k}"${k === on ? ' aria-current="page"' : ""}><span>${x.t}</span>${n !== "" ? `<span class="cnt${x.z || k === "kpi" ? " alert" : ""}">${n}</span>` : ""}</a>`;
  }).join("");
}
function route() {
  let v = location.hash.slice(1);
  if (!VIEWS[v]) v = window.TREE && TREE.nodes.some(n => n.id === v) ? "roadmap" : "card";
  cur = v;
  document.getElementById("nav").innerHTML = navHtml(v);
  const main = document.getElementById("main");
  main.innerHTML = VIEWS[v].r() + subTabs(v);
  if (VIEWS[v].z) mountZhk(main, VIEWS[v].z);
  bind(main);
}

// Показатели: сводка, финмодель и сроки документов — подразделы одной страницы.
function subTabs(v) {
  const fam = v === "kpi" || VIEWS[v].p === "kpi"; if (!fam) return "";
  const tab = (k, t) => { const b = k === "kpi" ? "" : zhkBadge(k); return `<a href="#${k}"${k === v ? ' aria-current="page"' : ""}>${t}${b ? ` <span class="cnt alert">${b}</span>` : ""}</a>` };
  return `<nav class="subtabs" aria-label="Разделы показателей">${tab("kpi", "Сводка")}${tab("model", "Финмодель")}${tab("deadlines", "Сроки документов")}</nav>`;
}

// ---------- Дорожная карта (приложение дерева этапов) ----------
// Работает в изолированном блоке (shadow DOM): свои стили не пересекаются с порталом, цвета берутся из портала.
let cur = "card", zhkHost = null;
const ZKEY = Object.fromEntries(Object.entries(VIEWS).filter(([, x]) => x.z).map(([k, x]) => [x.z, k]));
function bootZhk() {
  zhkHost = document.createElement("div");
  zhkHost.id = "zhk";
  const root = zhkHost.attachShadow({ mode: "open" });
  root.innerHTML = document.getElementById("zhk-tpl").innerHTML;
  const body = root.querySelector(".zhk");
  window.ZHK_ROOT = body;
  window.ZHK_BOOT({
    getElementById: id => root.getElementById(id), querySelector: s => root.querySelector(s), querySelectorAll: s => root.querySelectorAll(s),
    addEventListener: (...a) => root.addEventListener(...a), createElement: t => document.createElement(t), createRange: () => document.createRange(),
    fonts: document.fonts, body, documentElement: document.documentElement, get activeElement() { return root.activeElement },
  });
}
function mountZhk(main, view) {
  main.appendChild(zhkHost);
  zhkHost.dataset.view = view;
  window.ZHK.setView(view);
}
function zhkBadge(view) {
  const b = zhkHost && zhkHost.shadowRoot.getElementById("badge-" + view);
  return b && !b.hidden && b.textContent.trim() ? b.textContent.trim() : "";
}
// Переход внутри дерева (например, «Открыть в графике»): обновить заголовок и меню без перерисовки дерева.
window.ZHK_onView = v => {
  const k = ZKEY[v]; if (!k) return;
  cur = k; zhkHost.dataset.view = v;
  document.getElementById("nav").innerHTML = navHtml(k);
  const old = document.querySelector("#main > .subtabs"); if (old) old.remove();
  const top = document.querySelector("#main > .topbar"); if (top) top.outerHTML = VIEWS[k].r() + subTabs(k);
};
// Данные проекта изменились (своя правка или синхронизация команды): обновить карточку, стандарты и счётчики.
window.ZHK_onChange = () => {
  const before = JSON.stringify(pick(card));
  syncCard();
  if (JSON.stringify(pick(card)) !== before) filt = { ...filt, ...pick(card) };
  if (!document.getElementById("main").children.length) return;
  if (VIEWS[cur].z) { const l = document.querySelector("#main > .topbar .crumbs .label"); if (l) l.textContent = projTitle(); return; }
  const a = document.activeElement;
  if (a && a.closest && a.closest("#main") && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type === "text"))) return;
  route();
};
window.ZHK_onBadges = () => {
  if (!zhkHost) return;
  document.getElementById("nav").innerHTML = navHtml(cur);
  const st = document.querySelector("#main > .subtabs"); if (st) st.outerHTML = subTabs(cur);
};

function bind(m) {
  m.querySelectorAll("[data-pk]").forEach(el => el.onchange = () => window.ZHK.setProject({ [el.dataset.pk]: el.value.trim() }));
  m.querySelectorAll("[data-f]").forEach(s => s.onchange = () => { filt[s.dataset.f] = s.value; route() });
  const fc = m.querySelector("#f-card"); if (fc) fc.onclick = () => { filt = { ...pick(card), dir: "", status: "" }; route() };
  const fx = m.querySelector("#f-clear"); if (fx) fx.onclick = () => { filt = { region: "", city: "", klass: "", stage: "", work: "", construct: "", dir: "", status: "" }; route() };
  m.querySelectorAll("[data-std]").forEach(b => b.onclick = () => openStd(b.dataset.std));
  m.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { const k = b.dataset.kind; evKinds.has(k) ? evKinds.delete(k) : evKinds.add(k); route() });
  m.querySelectorAll("[data-hr]").forEach(b => b.onclick = () => { b.disabled = true; b.textContent = "Заявка отправлена"; m.querySelector("#hr-msg").textContent = "Заявка на роль «Специалист БиОТ» передана в HR (в прототипе — без отправки)." });
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("layer").innerHTML) { document.getElementById("layer").innerHTML = ""; route() } });
addEventListener("hashchange", () => { document.getElementById("layer").innerHTML = ""; route(); scrollTo(0, 0) });
bootZhk();
syncCard();
filt = { ...filt, ...pick(card) };
route();
</script>
