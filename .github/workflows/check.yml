name: Check skill tree

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate page and data
        run: node scripts/check-skill-tree.js
      - name: Exports are up to date
        run: |
          node scripts/export-skill-tree.js
          git diff --exit-code -- docs || (echo "::error::Run 'node scripts/export-skill-tree.js' and commit the result" && exit 1)

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Database schema rules
        run: |
          sudo systemctl start postgresql
          cat docs/db/project-data.sql docs/db/project-data-check.sql | sudo -u postgres psql -v ON_ERROR_STOP=1 -q
